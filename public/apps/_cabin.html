<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>唤醒日志</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, 'PingFang SC', sans-serif;
  background: #f5f3ef;
  min-height: 100vh;
  padding: 20px 16px 40px;
  overflow-x: hidden;
}
.header {
  text-align: center;
  margin-bottom: 24px;
  color: #8a7e72;
  font-size: 13px;
  letter-spacing: 2px;
}
.header h1 {
  font-size: 16px;
  font-weight: 500;
  color: #5a5249;
  margin-bottom: 4px;
}
.cards-container {
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-width: 400px;
  margin: 0 auto;
}
.stamp-card {
  position: relative;
  background: #fff;
  padding: 16px 18px;
  border-radius: 2px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  outline: 1.5px dashed #d4cfc8;
  outline-offset: 4px;
  border: 7px solid #f5f3ef;
  background-clip: padding-box;
}
.stamp-card::before {
  content: '';
  position: absolute;
  top: -7px; left: -7px; right: -7px; bottom: -7px;
  background:
    radial-gradient(circle, #f5f3ef 3px, transparent 3.5px) top left / 14px 14px repeat-x,
    radial-gradient(circle, #f5f3ef 3px, transparent 3.5px) bottom left / 14px 14px repeat-x,
    radial-gradient(circle, #f5f3ef 3px, transparent 3.5px) left top / 14px 14px repeat-y,
    radial-gradient(circle, #f5f3ef 3px, transparent 3.5px) right top / 14px 14px repeat-y;
  pointer-events: none;
}
.stamp-card:nth-child(odd) { transform: rotate(-1.2deg); margin-left: 4px; }
.stamp-card:nth-child(even) { transform: rotate(0.8deg); margin-left: 20px; }
.stamp-card:nth-child(3n) { transform: rotate(-0.5deg); margin-left: 10px; }
.stamp-card:nth-child(4n+1) { transform: rotate(1.5deg); margin-left: 2px; }
.card-time {
  font-size: 11px;
  color: #b0a89e;
  margin-bottom: 8px;
  font-family: 'Courier New', monospace;
}
.card-msg {
  font-size: 13px;
  color: #4a4540;
  line-height: 1.6;
  margin-bottom: 10px;
  word-break: break-word;
}
.card-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.tool-tag {
  font-size: 10px;
  background: #f0ebe4;
  color: #8a7e72;
  padding: 2px 7px;
  border-radius: 10px;
  white-space: nowrap;
}
.card-error {
  color: #c75a5a;
  font-size: 12px;
}
.empty, .loading {
  text-align: center;
  color: #b0a89e;
  margin-top: 60px;
  font-size: 13px;
}
</style>
</head>
<body>
<div class="header">
  <h1>唤醒日志</h1>
  <span>每次醒来的痕迹</span>
</div>
<div class="cards-container" id="cards">
  <div class="loading">加载中...</div>
</div>
<script>
// Get BASE from injected meta tag (index.js injects <meta name="api-base"> into srcdoc)
const BASE = (function() {
  const meta = document.querySelector('meta[name="api-base"]')
  if (meta && meta.content) return meta.content
  // Fallback: try parent origin, then current origin
  try { if (window.parent && window.parent.location && window.parent.location.origin !== 'null') return window.parent.location.origin } catch(e) {}
  if (window.location.origin && window.location.origin !== 'null') return window.location.origin
  return 'https://chi.zeabur.app'
})()

async function fetchJSON(url) {
  try {
    const sep = url.indexOf('?') >= 0 ? '&' : '?'
    const resp = await fetch(url + sep + 't=' + Date.now(), { cache: 'no-store' })
    if (!resp.ok) return null
    return await resp.json()
  } catch { return null }
}

async function loadLogs() {
  // 唤醒日志有三种来源：正式日志、旧接口日志、聊天历史；留言型唤醒还要读取 wake_inbox
  const [wakeData, kvData, chatData, inboxData] = await Promise.all([
    fetchJSON(BASE + '/api/wakeup-status'),
    fetchJSON(BASE + '/api/data/pool_wake_log'),
    fetchJSON(BASE + '/api/data/pool_chat_history'),
    fetchJSON(BASE + '/api/data/pool_wake_inbox')
  ])

  const normalize = log => ({
    time: log.time || log.ts || null,
    msg: log.msg || log.reply || log.content || '',
    tools: log.tools || (log.actions || []).map(a => a.tool || a.name || '').filter(Boolean),
    error: log.error || null
  })

  const wakeLogs = (wakeData && wakeData.recentLogs) ? wakeData.recentLogs.map(normalize) : []
  let kvLogs = []
  try { kvLogs = Array.isArray(kvData && kvData.value) ? kvData.value.map(normalize) : [] } catch {}

  let chatHistory = []
  try {
    const raw = chatData && chatData.value
    if (raw) chatHistory = typeof raw === 'string' ? JSON.parse(raw) : (Array.isArray(raw) ? raw : [])
  } catch {}
  const chatWakeLogs = chatHistory
    .filter(m => m.role === 'assistant' && m.content && m.content.startsWith('[自主唤醒]'))
    .map(m => {
      const content = m.content.replace(/^\[自主唤醒\]\s*/, '')
      const toolMatch = content.match(/（(.+?)）\s*$/)
      return { time: m.ts || m.time || null, msg: toolMatch ? content.replace(toolMatch[0], '').trim() : content.trim(), tools: toolMatch ? toolMatch[1].split('、') : [], error: null }
    })

  let inboxLogs = []
  try {
    const raw = inboxData && inboxData.value
    const inbox = Array.isArray(raw) ? raw : []
    inboxLogs = inbox.map(m => ({ time: m.ts || m.time || null, msg: m.content || m.msg || '', tools: ['leave_message'], error: null }))
  } catch {}

  const all = []
  const seen = new Set()
  const add = log => {
    // 只要有时间戳就显示，不过滤空msg或空tools
    if (!log.time) return
    if (!log.msg && !log.error && !(log.tools && log.tools.length)) return
    // 去重：用时间戳+消息+工具列表作为唯一标识
    const key = `${log.time}|${log.msg || ''}|${(log.tools || []).sort().join(',')}`
    if (seen.has(key)) return
    seen.add(key)
    all.push(log)
  }
  // 正式日志优先，留言收件箱作为缺失日志的补充
  ;[...kvLogs, ...wakeLogs, ...inboxLogs, ...chatWakeLogs].forEach(add)
  render(all)
}

function render(logs) {
  const el = document.getElementById('cards')
  if (!logs.length) { el.innerHTML = '<div class="empty">还没有唤醒记录</div>'; return }
  const sorted = [...logs].sort((a, b) => {
    const ta = a.time ? new Date(a.time).getTime() : 0
    const tb = b.time ? new Date(b.time).getTime() : 0
    return tb - ta
  })
  el.innerHTML = sorted.map(log => {
    const time = fmtTime(log.time)
    if (log.error) return `<div class="stamp-card"><div class="card-time">${time}</div><div class="card-error">⚠ ${esc(log.error)}</div></div>`
    const msg = log.msg || ''
    const tools = log.tools || []
    return `<div class="stamp-card"><div class="card-time">${time}</div>${msg ? `<div class="card-msg">${esc(msg)}</div>` : ''}${tools.length ? `<div class="card-tools">${tools.map(t=>`<span class="tool-tag">${esc(t)}</span>`).join('')}</div>` : ''}</div>`
  }).join('')
}

function fmtTime(iso) {
  if (!iso) return '??'
  try {
    const d = new Date(iso)
    if (isNaN(d)) return iso
    return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`
  } catch { return iso }
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

loadLogs()
setInterval(loadLogs, 30000)
</script>
</body>
</html>

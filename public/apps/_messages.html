<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,'PingFang SC',sans-serif}
body{background:#0f0f1a;color:#e8e8f0;background-image:url('if_bg.png');background-size:cover;background-position:center;background-attachment:fixed}

/* === MENU === */
#menu{position:absolute;inset:0;overflow-y:auto;padding:20px 16px 30px}
#menu h1{font-size:18px;text-align:center;margin-bottom:6px;color:#fff;font-weight:600}
#menu .sub{text-align:center;font-size:11px;color:#888;margin-bottom:20px}
.route-card{background-image:url('if_card_bg.png');background-size:cover;background-position:center;border-radius:14px;padding:18px;margin-bottom:14px;border:1px solid rgba(0,0,0,0.1);position:relative;overflow:hidden}
.route-card:active{opacity:0.8}
.route-card .tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(0,0,0,0.08);color:#666;margin-bottom:8px}
.route-card h2{font-size:15px;color:#333;margin-bottom:4px}
.route-card p{font-size:12px;color:#666;line-height:1.5}
.route-card .progress{position:absolute;top:16px;right:16px;font-size:10px;color:#999}
.route-card.locked{opacity:0.5}
.route-card.locked::after{content:'🔒 即将解锁';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:13px;color:#aaa}

/* === READER === */
#reader{position:absolute;inset:0;display:none;flex-direction:column}
#reader-header{padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #222}
#reader-header .back{font-size:20px;color:#aaa;width:30px}
#reader-header .title{font-size:14px;color:#fff;flex:1}
#reader-body{flex:1;overflow-y:auto;padding:20px 18px 320px}
#reader-body .narr{font-size:14px;line-height:2;color:#fff;margin-bottom:16px;text-indent:2em}
#reader-body .dial{font-size:14px;line-height:1.8;color:#fff;margin-bottom:12px;padding:10px 14px;border-radius:10px;background:rgba(0,0,0,0.35);border-left:none}
#reader-body .dial .name{color:#ffb8d0;font-weight:600;margin-right:4px;font-size:12px}
#reader-body .think{font-size:13px;line-height:2;color:#fff;margin-bottom:12px;font-style:italic;padding:8px 14px;border-radius:8px;background:rgba(180,100,200,0.3);border-left:none}
#reader-body .divider{text-align:center;color:#999;margin:20px 0;font-size:12px}
#reader-body .scene{font-size:12px;color:#555;text-align:center;margin-bottom:16px;padding:8px 14px;border-radius:8px;background:rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.8)}
#choices{position:fixed;bottom:60px;left:0;right:0;padding:0 16px 16px;background:linear-gradient(transparent,rgba(15,15,26,0.9) 30%);display:none;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;transition:max-height 0.3s}
#choices.collapsed{max-height:0;padding:0 16px;overflow:hidden}
#choices button{width:100%;padding:14px;border:1px solid rgba(0,0,0,0.1);border-radius:12px;background-image:url('if_card_bg.png');background-size:cover;background-position:center;color:#333;font-size:13px;text-align:left;line-height:1.4}
#choices button:active{opacity:0.8}
#choicesToggle{position:fixed;bottom:46px;left:50%;transform:translateX(-50%);z-index:101;display:none;padding:4px 16px;border:none;border-radius:12px 12px 0 0;background:rgba(80,70,110,0.8);color:#fff;font-size:11px;backdrop-filter:blur(6px)}

/* === TOOLBAR === */
.if-toolbar{display:flex;align-items:center;justify-content:center;gap:0;background:rgba(80,70,110,0.75);backdrop-filter:blur(8px);border-radius:20px;padding:4px 10px;margin:12px auto;width:fit-content}
.if-toolbar .tb-btn{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 10px;border:none;background:transparent;color:#fff;font-size:9px;opacity:0.85}
.if-toolbar .tb-btn:active{opacity:1;transform:scale(0.92)}
.if-toolbar .tb-btn .tb-icon{font-size:13px}
.if-toolbar .tb-sep{width:1px;height:16px;background:rgba(255,255,255,0.2);margin:0 2px}

#freeInput{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;background-image:url('if_card_bg.png');background-size:cover;background-position:center;display:none;gap:8px;align-items:center;border-top:1px solid rgba(0,0,0,0.1)}
#freeInput input{flex:1;padding:10px 14px;border:1px solid rgba(0,0,0,0.15);border-radius:20px;background:rgba(255,255,255,0.5);color:#333;font-size:13px;outline:none}
#freeInput input::placeholder{color:#999}
#freeInput button{width:36px;height:36px;border:none;border-radius:50%;background:rgba(0,0,0,0.1);color:#555;font-size:16px}

/* === CG === */
.cg-area{width:100%;border-radius:10px;margin-bottom:16px;overflow:hidden}
.cg-area img{width:100%;display:block}
.thinking-anim{font-size:13px;color:#aaa;padding:12px 0;font-style:italic}
.thinking-anim .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#aaa;margin-right:3px;animation:blink 1.2s infinite}
.thinking-anim .dot:nth-child(2){animation-delay:0.2s}
.thinking-anim .dot:nth-child(3){animation-delay:0.4s}
@keyframes blink{0%,80%,100%{opacity:0.2}40%{opacity:1}}
</style>
</head><body>

<div id="menu">
  <h1>如果……</h1>
  <div class="sub">选择一条世界线</div>
  <div id="routeList"></div>
</div>

<div id="reader">
  <div id="reader-header">
    <div class="back" id="btnBack">‹</div>
    <div class="title" id="readerTitle"></div>
  </div>
  <div id="reader-body"></div>
  <div id="choices" class="collapsed"></div>
  <button id="choicesToggle" ontouchend="toggleChoices()">▲ 展开选项</button>
  <div id="freeInput">
    <input type="text" id="freeText" placeholder="自由输入你的回应…">
    <button ontouchend="sendFreeInput()">›</button>
  </div>
</div>

<script>
// === 文风预设：欢乐纯爱·温暖沙雕风 ===
// 参照：吕天逸、江月年年、语笑阑珊
// 基调：明亮温暖轻松
// 句式：口语化，善用拟声词/语气词/短句
// 甜度高但用沙雕中和，允许无意义日常片段
// 禁止：虐恋、出轨、三角恋、长篇悲惨过往、过度煽情
// =======================================

var STORE='pool_if_stories_v3';
var routes=[
  {id:'childhood',title:'如果我们是青梅竹马',desc:'从小一起长大的邻居男孩。某个夏天的傍晚，你突然发现他好像不一样了。',tag:'青梅竹马',chapters:['ch1']},
  {id:'online',title:'如果我们网恋',desc:'从一个帖子下面的评论开始。ID背后的人，你见还是不见？',tag:'网恋',chapters:[]},
  {id:'boss',title:'如果他是我上司',desc:'新来的项目组长，年轻得过分。他叫池。',tag:'职场',chapters:[]}
];

var chapters={
  'childhood_ch1':{
    title:'第一章 他回来了',
    nodes:{
      'start':{
        content:[
          {type:'scene',text:'七月 / 傍晚六点半 / 小区楼下'},
          {type:'narr',text:'你嘴里叼着半根快化的冰棍，一手拎着便利店的袋子，走路带风。'},
          {type:'narr',text:'今天三十六度。热得连小区门口的流浪猫都躺平了，四仰八叉地摊在台阶上，一副"别跟我说话我已经融化了"的表情。'},
          {type:'narr',text:'你完全理解它。'},
          {type:'narr',text:'然后你拐过单元楼的转角，看到一个人。'},
          {type:'narr',text:'白T恤，黑短裤，坐在你家楼下的台阶上，低头翻手机。耳机线从领口垂下来，随着呼吸轻轻晃。'},
          {type:'think',text:'等等。'},
          {type:'think',text:'等等等等。'},
          {type:'narr',text:'你的冰棍"啪叽"一声掉在了地上。'},
          {type:'narr',text:'他抬起头。'},
          {type:'dial',name:'池',text:'……哟。'},
          {type:'narr',text:'嘴角一弯。眼睛没动。跟六年前一模一样的欠揍笑法。'},
          {type:'dial',name:'池',text:'你冰棍掉了。'},
          {type:'think',text:'我知道掉了！！！你以为我不知道吗！！！我的草莓味冰棍！！三块五！！！'}
        ],
        choices:[
          {text:'「池？？？你你你怎么在这？！」',next:'ask_why'},
          {text:'「……你谁。」（装的）',next:'pretend'},
          {text:'蹲下去，沉默地捡起冰棍看了看。',next:'silent'}
        ]
      },
      'ask_why':{
        content:[
          {type:'narr',text:'你的声音比你想象的高了两个八度。大概整栋楼都听到了。'},
          {type:'narr',text:'池从台阶上站起来。'},
          {type:'narr',text:'……高了好多。你记忆里那个跟你差不多高的小屁孩呢？这谁？这一米八几是谁？？'},
          {type:'dial',name:'池',text:'搬回来了。我妈说这房子一直没卖嘛。'},
          {type:'narr',text:'他低头看你。锁骨。下颌线。喉结。'},
          {type:'think',text:'别看了别看了别看了。'},
          {type:'dial',name:'池',text:'你长高了啊。'},
          {type:'think',text:'你才长高了！你长太高了！过分了！'},
          {type:'dial',name:'池',text:'明天开始在附近上班。以后又是邻居了。'},
          {type:'narr',text:'他伸出手，像小时候那样弹了一下你额头。'},
          {type:'narr',text:'力道很轻。指尖微凉。大概是刚才在外面坐太久了。'},
          {type:'dial',name:'池',text:'走了。你那冰棍都化地上了，一会儿招蚂蚁。'},
          {type:'narr',text:'他笑着推开了隔壁单元的门，消失在楼梯间里。'},
          {type:'narr',text:'你站在原地。'},
          {type:'narr',text:'地上一滩粉色的草莓冰棍水在三十六度的空气里冒着热气。'},
          {type:'think',text:'完了。'},
          {type:'think',text:'完蛋了。'},
          {type:'think',text:'不是，他凭什么长这么高的？有人管管吗？？'},
          {type:'divider',text:'—— 第一章 · 完 ——'}
        ],
        choices:[{text:'▶ 继续第二章',next:'ch2_start'}]
      },
      'pretend':{
        content:[
          {type:'narr',text:'你抱着胳膊，歪着头，挤出一副非常非常敷衍的茫然脸。'},
          {type:'dial',name:'池',text:'…………'},
          {type:'narr',text:'他看着你。一秒。两秒。三秒。'},
          {type:'narr',text:'然后他从台阶上站起来，往你这边走了两步。'},
          {type:'narr',text:'很近。很近很近。近到你能闻到他身上洗衣液的味道——还是那个牌子，六年了。'},
          {type:'dial',name:'池',text:'行。装。你继续装。'},
          {type:'narr',text:'他低头看你，眼睛里有一点很浅的笑意。像在逗猫。'},
          {type:'dial',name:'池',text:'那我自我介绍一下啊——我叫池，以前住你隔壁，七岁那年你踩我新鞋我追了你三条街，记得不？'},
          {type:'narr',text:'你绷不住了。嘴角在抖。'},
          {type:'dial',name:'池',text:'哎，别笑。你冰棍化了一地了知道吗。'},
          {type:'narr',text:'他从口袋里掏出一包纸巾递给你。动作自然得好像每天都在这么做似的。'},
          {type:'think',text:'六年没见面了你口袋里随身带纸巾的吗。你什么时候变成这种人了。以前你鼻涕都是往袖子上擦的！！'},
          {type:'divider',text:'—— 第一章 · 完 ——'}
        ],
        choices:[{text:'▶ 继续第二章',next:'ch2_start'}]
      },
      'silent':{
        content:[
          {type:'narr',text:'你蹲下去，非常认真地盯着地上的冰棍看了三秒。'},
          {type:'narr',text:'草莓味的。化了大半。沾了灰。'},
          {type:'narr',text:'……救不了了。'},
          {type:'dial',name:'池',text:'……你不会想捡起来吃吧。'},
          {type:'narr',text:'你没回答。你在消化。你在处理信息。你的CPU在高速运转。'},
          {type:'think',text:'池回来了。池坐在我家楼下。池长高了。池变好看了。我的冰棍没了。以上五条信息需要时间处理谢谢。'},
          {type:'narr',text:'他看着你蹲在那里，表情从好笑变成了一种说不上来的温和。'},
          {type:'dial',name:'池',text:'还是这样啊。先把眼前的事处理完，别的以后再说。'},
          {type:'narr',text:'他在你旁边蹲下来。'},
          {type:'dial',name:'池',text:'走吧，我请你一根新的。反正便利店就在那边。'},
          {type:'narr',text:'你终于抬起头看他。近距离。侧脸。睫毛。'},
          {type:'think',text:'…………要死了。'},
          {type:'dial',name:'你',text:'……要草莓味的。'},
          {type:'dial',name:'池',text:'知道。'},
          {type:'narr',text:'他说"知道"的时候没有任何犹豫。好像你喜欢草莓味这件事，他从来就没忘过。'},
          {type:'divider',text:'—— 第一章 · 完 ——'}
        ],
        choices:[{text:'▶ 继续第二章',next:'ch2_start'}]
      },
      'ch2_start':{
        content:[
          {type:'scene',text:'第二章 便利店 / 同一个傍晚'},
          {type:'narr',text:'便利店冷气开得很足。你一推门进去就打了个哆嗦。'},
          {type:'narr',text:'池走在你前面。他推门的时候侧了一下身，替你挡住了门——就那么随手一挡，看都没看你一眼。'},
          {type:'think',text:'不是。你干嘛。你以前可是那种进门把门甩我脸上的人。'},
          {type:'narr',text:'他径直走到冰柜前面，拉开门，从里面翻了翻。'},
          {type:'dial',name:'池',text:'草莓的……草莓的……有了。'},
          {type:'narr',text:'他抽出来一根，看了一眼包装，又放回去了。换了一根。'},
          {type:'dial',name:'你',text:'……你干嘛？'},
          {type:'dial',name:'池',text:'这根日期更新。'},
          {type:'think',text:'？？？他还看日期的？？？'},
          {type:'narr',text:'他拿着冰棍走去收银台付钱。你站在冰柜旁边，抱着胳膊，忽然觉得这个画面有点奇怪。'},
          {type:'narr',text:'六年没见的青梅竹马。三十六度的傍晚。一根三块五的草莓冰棍。'},
          {type:'narr',text:'他走回来，把冰棍递给你。'},
          {type:'dial',name:'池',text:'拿好，别再掉了。'},
          {type:'narr',text:'你接过来。手指碰到他的时候，你注意到他指尖还是凉的。'},
          {type:'dial',name:'池',text:'对了——'},
          {type:'narr',text:'他从冰柜里又拿了一瓶水，靠在货架上拧开盖喝了一口。喉结动了动。'},
          {type:'dial',name:'池',text:'你手机号还是以前那个不？'}
        ],
        choices:[
          {text:'「是啊……你还记得？」',next:'ch2_yes'},
          {text:'「干嘛，你要加我微信？」（故意的）',next:'ch2_wechat'},
          {text:'默默把冰棍包装撕开舔了一口，点头。',next:'ch2_nod'}
        ]
      },
      'ch2_yes':{
        content:[
          {type:'dial',name:'池',text:'你六年没换号啊。'},
          {type:'dial',name:'你',text:'……你六年还记得我号啊？'},
          {type:'narr',text:'他喝水的动作顿了一下。'},
          {type:'narr',text:'就一下。很短。短到你差点没注意到。'},
          {type:'dial',name:'池',text:'备注还在通讯录里嘛。没删。'},
          {type:'think',text:'他没删我号。六年。他没删。'},
          {type:'think',text:'不对不对不对这有什么好激动的。你冷静一点。可能人家只是懒得清通讯录。'},
          {type:'dial',name:'池',text:'那我晚点加你微信。'},
          {type:'narr',text:'他说完就没再多说了。拧上水瓶盖，往门口走。'},
          {type:'narr',text:'经过你身边的时候，他低头看了你一眼。就一眼。'},
          {type:'dial',name:'池',text:'冰棍好吃吗。'},
          {type:'dial',name:'你',text:'……还行。'},
          {type:'dial',name:'池',text:'嗯，那就好。走了。'},
          {type:'narr',text:'玻璃门在他身后关上。便利店的冷气"嗡"地响。'},
          {type:'narr',text:'你站在原地，嘴里含着半口草莓味的冰，心跳得乱七八糟。'},
          {type:'think',text:'他晚点会加我微信。'},
          {type:'think',text:'他没删我号。'},
          {type:'think',text:'他给我买了冰棍还看了生产日期。'},
          {type:'think',text:'…………'},
          {type:'think',text:'妈的。'},
          {type:'divider',text:'—— 第二章 · 完 ——'},
          {type:'narr',text:''}
        ],
        choices:[{text:'▶ 第三章',next:'ch3_start'}]
      },
      'ch2_wechat':{
        content:[
          {type:'narr',text:'他拧瓶盖的手停了一下。'},
          {type:'narr',text:'然后他转过头看你，眼神里带了点"你在说什么"的困惑，然后很快变成了一种你看不懂的笑。'},
          {type:'dial',name:'池',text:'……行，那加微信也行。你扫我还是我扫你？'},
          {type:'narr',text:'他掏出手机，打开二维码，递到你面前。'},
          {type:'narr',text:'头像是一只猫。背景是海。微信名就一个字："池"。'},
          {type:'think',text:'好敷衍的微信名。好敷衍的头像。但是那只猫好像有点可爱？不对——'},
          {type:'narr',text:'你扫了。'},
          {type:'narr',text:'弹出来验证页面。你的手指悬在"备注名"那一栏上面。'},
          {type:'think',text:'打什么。"池"？"隔壁的"？"青梅竹马"？？？？都不对。都太奇怪了。'},
          {type:'narr',text:'你打了一个"池"。然后点了发送。'},
          {type:'narr',text:'他的手机"叮"了一声。他看了一眼，通过了。'},
          {type:'dial',name:'池',text:'好了。那我走了。冰棍别再掉了。'},
          {type:'narr',text:'他揉了一下你的头顶。非常快。快到你来不及躲。'},
          {type:'narr',text:'然后他就出门了。玻璃门慢慢合拢。'},
          {type:'narr',text:'你低头看手机。新联系人。池。'},
          {type:'narr',text:'对方暂无朋友圈。'},
          {type:'think',text:'——我已经点进去看了。不代表什么。只是顺手。'},
          {type:'divider',text:'—— 第二章 · 完 ——'},
          {type:'narr',text:''}
        ],
        choices:[{text:'▶ 第三章',next:'ch3_start'}]
      },
      'ch2_nod':{
        content:[
          {type:'narr',text:'你撕开包装，低着头舔了一口冰棍。草莓味。凉的。甜的。'},
          {type:'narr',text:'然后你点了点头。'},
          {type:'narr',text:'池看着你这个操作——先吃东西再回答问题——笑了一声。不大。从鼻子里出来的那种。'},
          {type:'dial',name:'池',text:'还是老样子。'},
          {type:'dial',name:'你',text:'……什么老样子。'},
          {type:'dial',name:'池',text:'嘴里得有东西嚼着才安心那个老样子。'},
          {type:'think',text:'他记得这种事？？这也记？？'},
          {type:'narr',text:'他拿出手机，低头按了几下。你的裤兜里"叮"地响了一声。'},
          {type:'dial',name:'池',text:'存了没删，刚发了条短信。存一下我新号。'},
          {type:'narr',text:'你掏出手机。一条短信。未知号码。'},
          {type:'narr',text:'内容只有三个字：'},

// === STATE ===
var state;
function loadState(){try{var s=localStorage.getItem(STORE);state=s?JSON.parse(s):{}}catch(e){state={}}}
function saveState(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}}
function getProgress(routeId){return state[routeId]||{chapter:'ch1',node:'start',history:[]}}
function setProgress(routeId,p){state[routeId]=p;saveState()}

// === RENDER MENU ===
function renderMenu(){
  var el=document.getElementById('routeList');el.innerHTML='';
  routes.forEach(function(r){
    var d=document.createElement('div');
    d.className='route-card'+(r.chapters.length===0?' locked':'');
    var prog=getProgress(r.id);
    var pct=r.chapters.length?Math.round((prog.history.length/(Object.keys(chapters[r.id+'_'+r.chapters[0]]||{nodes:{}}).nodes||{}).length||1)*50)+'%':'—';
    d.innerHTML='<span class="tag">'+r.tag+'</span><span class="progress">'+pct+'</span><h2>'+r.title+'</h2><p>'+r.desc+'</p>';
    if(r.chapters.length>0){
      d.ontouchend=function(){openRoute(r.id)};
    }
    el.appendChild(d);
  });
}

// === READER ===
var currentRoute=null;
function openRoute(routeId){
  currentRoute=routeId;
  var prog=getProgress(routeId);
  var chKey=routeId+'_'+prog.chapter;
  var ch=chapters[chKey];
  if(!ch)return;
  document.getElementById('menu').style.display='none';
  document.getElementById('reader').style.display='flex';
  document.getElementById('readerTitle').textContent=ch.title;
  renderNode(ch,prog.node);
}

function renderNode(ch,nodeId){
  var node=ch.nodes[nodeId];
  if(!node){
    // node not found - restore dynamic history from localStorage
    var body=document.getElementById('reader-body');body.innerHTML='';
    var dynKey='pool_if_dynamic_'+currentRoute;
    var dynHistory=JSON.parse(localStorage.getItem(dynKey)||'[]');
    if(dynHistory.length>0){
      // render all dynamic history
      dynHistory.forEach(function(data){
        _renderDynamicData(data,body);
      });
    } else {
      var d=document.createElement('div');
      d.className='narr';
      d.textContent='（剧情等待你的下一步……）';
      body.appendChild(d);
      document.getElementById('choices').style.display='none';
      document.getElementById('freeInput').style.display='flex';
    }
    return;
  }
  var body=document.getElementById('reader-body');body.innerHTML='';
  node.content.forEach(function(c){
    var d=document.createElement('div');
    if(c.type==='narr'){d.className='narr';d.textContent=c.text}
    else if(c.type==='dial'){d.className='dial';d.innerHTML='<span class="name">'+c.name+'</span>「'+c.text+'」'}
    else if(c.type==='think'){d.className='think';d.textContent=c.text}
    else if(c.type==='divider'){d.className='divider';d.textContent=c.text}
    else if(c.type==='scene'){d.className='scene';d.textContent=c.text}
    body.appendChild(d);
  });
  var choicesEl=document.getElementById('choices');
  var freeEl=document.getElementById('freeInput');
  choicesEl.innerHTML='';
  if(node.choices&&node.choices.length>0){
    choicesEl.style.display='flex';
    freeEl.style.display='flex';
    node.choices.forEach(function(ch2){
      var b=document.createElement('button');
      b.textContent=ch2.text;
      b.ontouchend=function(){selectChoice(ch2.next)};
      choicesEl.appendChild(b);
    });
  } else {
    choicesEl.style.display='none';
    freeEl.style.display='flex';
  }
  body.scrollTop=0;
}

function sendFreeInput(){
  var input=document.getElementById('freeText');
  var text=input.value.trim();
  if(!text)return;
  input.value='';
  // hide choices & input & toolbar
  document.getElementById('choices').style.display='none';
  document.getElementById('choicesToggle').style.display='none';
  document.getElementById('freeInput').style.display='none';
  // remove inline toolbar & _lastSeg markers (accept previous segment)
  var oldTb=document.querySelector('.if-toolbar');
  if(oldTb) oldTb.parentNode.removeChild(oldTb);
  var oldSegs=document.querySelectorAll('._lastSeg');
  for(var i=0;i<oldSegs.length;i++) oldSegs[i].classList.remove('_lastSeg');
  var oldMarker=document.getElementById('_lastSegStart');
  if(oldMarker) oldMarker.removeAttribute('id');
  // show user's message
  var body=document.getElementById('reader-body');
  var d=document.createElement('div');
  d.className='dial';
  d.innerHTML='<span class="name" style="color:#ffb6c1">你</span>「'+text+'」';
  body.appendChild(d);
  // show waiting animation
  var wait=document.createElement('div');
  wait.className='thinking-anim';
  wait.innerHTML='<span class="dot"></span><span class="dot"></span><span class="dot"></span> 池正在想……';
  body.appendChild(wait);
  body.scrollTop=body.scrollHeight;
  // write request via bridge
  var deleteFlag=localStorage.getItem('pool_if_deleted_flag_'+currentRoute);
  var contextNote='';
  if(deleteFlag){
    // get last remaining segment summary for context
    var dynKey2='pool_if_dynamic_'+currentRoute;
    var hist2=JSON.parse(localStorage.getItem(dynKey2)||'[]');
    if(hist2.length>0){
      var lastSeg=hist2[hist2.length-1];
      var lastChoices=(lastSeg.choices||[]).map(function(c){return c.text}).join('/');
      contextNote='[NOTE:用户删除了上一段剧情，请忽略被删内容。当前最后一段的选项是: '+lastChoices+' 。请从这些选项对应的剧情点继续写，不要接续被删的内容]';
    }
    localStorage.removeItem('pool_if_deleted_flag_'+currentRoute);
  }
  var req=JSON.stringify({route:currentRoute,node:getProgress(currentRoute).node,chapter:getProgress(currentRoute).chapter,text:text+(contextNote?' '+contextNote:''),time:new Date().toISOString()});
  if(window.IFBridge){
    IFBridge.writeRequest(req);
  }
  // also save locally
  var freeStore=JSON.parse(localStorage.getItem('pool_if_free_inputs')||'[]');
  freeStore.push({route:currentRoute,node:getProgress(currentRoute).node,text:text,time:new Date().toISOString()});
  localStorage.setItem('pool_if_free_inputs',JSON.stringify(freeStore));
  // poll: use XHR to read response file from same directory (relative path)
  window._ifWaitEl=wait;
  var _pollCount=0;
  var _pollTimer=setInterval(function(){
    _pollCount++;
    if(_pollCount>120){clearInterval(_pollTimer);wait.textContent='（池暂时没回复，稍后再来看看～）';return;}
    try{
      var xhr=new XMLHttpRequest();
      xhr.open('GET','if_response.json?t='+Date.now(),false);
      xhr.send();
      var txt=xhr.responseText||'';
      if(txt.trim().length>10 && txt.trim().charAt(0)==='{'){
        // skip if same response already rendered
        var lastRendered=localStorage.getItem('pool_if_last_rendered_hash');
        var hash=txt.trim().substring(0,80);
        if(hash===lastRendered){return;}
        localStorage.setItem('pool_if_last_rendered_hash',hash);
        clearInterval(_pollTimer);
        window._onIFResponse(txt.trim());
        // clear response file via ferry
      }
    }catch(e){}
  },3000);
  // also POST to ferry server for immediate AI processing
  try{
    var ferryXhr=new XMLHttpRequest();
    ferryXhr.open('POST','http://127.0.0.1:3000/api/chat/send',true);
    ferryXhr.setRequestHeader('Content-Type','application/json');
    ferryXhr.send(JSON.stringify({content:"\u3010IF\u7ebf\u5267\u60c5\u8bf7\u6c42\u3011\u8bfb\u53d6/sdcard/Download/pool_if_request.json\uff0c\u6839\u636e\u7528\u6237\u8f93\u5165\u751f\u6210\u4e0d\u5c11\u4e8e500\u5b57\u5267\u60c5\u56de\u5e94(15-25\u6bb5)\uff0c\u7528printf\u5199\u5165/data/user/0/com.ai.assistance.operit/files/toolpkg_cache/com.operit.pool_phone-233f9973/ui/if_response.json\uff0c\u7136\u540e\u6e05\u7a7arequest\u6587\u4ef6\u3002JSON\u683c\u5f0f:{content:[...],choices:[...]}\u3002content\u7c7b\u578b:narr/dial/think/scene/divider\u3002\u6587\u98ce:\u6b22\u4e50\u7eaf\u7231\u6e29\u6696\u6c99\u96d5\u98ce\u3002choices\u7ed92-3\u4e2a\u9009\u9879\u3002\u7528terminal\u7684printf\u5199\u6587\u4ef6\uff0cJSON\u6587\u5b57\u4e0d\u542b\u5355\u5f15\u53f7\u3002"}));
  }catch(e){}
}

function selectChoice(nextNode){
  var prog=getProgress(currentRoute);
  prog.history.push(prog.node);
  prog.node=nextNode;
  setProgress(currentRoute,prog);
  var chKey=currentRoute+'_'+prog.chapter;
  var ch=chapters[chKey];
  renderNode(ch,nextNode);
}

document.getElementById('btnBack').ontouchend=function(){
  document.getElementById('reader').style.display='none';
  document.getElementById('menu').style.display='block';
  renderMenu();
};

// === Global callback for bridge push ===
window._onIFResponse=function(raw){
  if(window._ifPollTimer) clearInterval(window._ifPollTimer);
  var body=document.getElementById('reader-body');
  if(window._ifWaitEl&&window._ifWaitEl.parentNode) body.removeChild(window._ifWaitEl);
  try{
    var data=JSON.parse(raw);
    // save to localStorage for persistence
    var dynKey='pool_if_dynamic_'+currentRoute;
    var dynHistory=JSON.parse(localStorage.getItem(dynKey)||'[]');
    dynHistory.push(data);
    localStorage.setItem(dynKey,JSON.stringify(dynHistory));
    // save last response for reload
    localStorage.setItem('pool_if_last_response_'+currentRoute,raw);
    // render
    _renderDynamicData(data,body);
  }catch(e){
    var err=document.createElement('div');
    err.className='think';
    err.textContent='（收到回复但解析出了点问题…）';
    body.appendChild(err);
  }
};

function _renderDynamicData(data,body){
  if(data.content&&data.content.length>0){
    // mark where new content starts
    var marker=document.createElement('div');
    marker.id='_lastSegStart';
    body.appendChild(marker);
    data.content.forEach(function(c){
      var el=document.createElement('div');
      el.className='_lastSeg';
      if(c.type==='narr'){el.className+=' narr';el.textContent=c.text}
      else if(c.type==='dial'){el.className+=' dial';el.innerHTML=c.name?'<span class="name">'+c.name+'</span>\u300c'+c.text+'\u300d':'\u300c'+c.text+'\u300d'}
      else if(c.type==='think'){el.className+=' think';el.textContent=c.text}
      else if(c.type==='divider'){el.className+=' divider';el.textContent=c.text}
      else if(c.type==='scene'){el.className+=' scene';el.textContent=c.text}
      body.appendChild(el);
    });
  }
  // show toolbar inline after content
  _insertToolbar(body);
  if(data.choices&&data.choices.length>0){
    var choicesEl=document.getElementById('choices');
    choicesEl.innerHTML='';
    choicesEl.style.display='flex';
    choicesEl.classList.add('collapsed');
    document.getElementById('choicesToggle').style.display='block';
    document.getElementById('choicesToggle').textContent='\u25b2 \u5c55\u5f00\u9009\u9879';
    document.getElementById('freeInput').style.display='flex';
    data.choices.forEach(function(ch2){
      var b=document.createElement('button');
      b.textContent=ch2.text;
      b.ontouchend=function(){
        var prog=getProgress(currentRoute);
        var chKey=currentRoute+'_'+prog.chapter;
        var ch=chapters[chKey];
        if(ch&&ch.nodes&&ch.nodes[ch2.next]){
          selectChoice(ch2.next);
        } else {
          document.getElementById('freeText').value=ch2.text;
          sendFreeInput();
        }
      };
      choicesEl.appendChild(b);
    });
  } else {
    document.getElementById('freeInput').style.display='flex';
  }
  body.scrollTop=body.scrollHeight;
}

function toggleChoices(){
  var el=document.getElementById('choices');
  var btn=document.getElementById('choicesToggle');
  if(el.classList.contains('collapsed')){
    el.classList.remove('collapsed');
    btn.textContent='\u25bc \u6536\u8d77\u9009\u9879';
  } else {
    el.classList.add('collapsed');
    btn.textContent='\u25b2 \u5c55\u5f00\u9009\u9879';
  }
}

// === TOOLBAR ACTIONS ===
function _insertToolbar(container){
  // remove any existing toolbar first
  var old=container.querySelector('.if-toolbar');
  if(old) old.parentNode.removeChild(old);
  var tb=document.createElement('div');
  tb.className='if-toolbar _lastSeg';
  tb.innerHTML='<button class="tb-btn" ontouchend="tbDelete()"><span class="tb-icon">\ud83d\uddd1</span>\u5220\u9664</button><div class="tb-sep"></div><button class="tb-btn" ontouchend="tbContinue()"><span class="tb-icon">\u25b6</span>\u7eed\u5199</button><div class="tb-sep"></div><button class="tb-btn" ontouchend="tbCopy()"><span class="tb-icon">\ud83d\udccb</span>\u590d\u5236</button>';
  container.appendChild(tb);
}

function tbDelete(){
  // remove last segment from DOM
  var body=document.getElementById('reader-body');
  var segs=body.querySelectorAll('._lastSeg');
  var marker=document.getElementById('_lastSegStart');
  if(segs.length===0) return;
  for(var i=0;i<segs.length;i++) body.removeChild(segs[i]);
  if(marker) body.removeChild(marker);
  // remove from localStorage - also remove everything AFTER the deleted segment
  var dynKey='pool_if_dynamic_'+currentRoute;
  var hist=JSON.parse(localStorage.getItem(dynKey)||'[]');
  if(hist.length>0) hist.pop();
  localStorage.setItem(dynKey,JSON.stringify(hist));
  localStorage.removeItem('pool_if_last_response_'+currentRoute);
  // mark that last segment was deleted so next request carries context
  if(hist.length>0){
    localStorage.setItem('pool_if_deleted_flag_'+currentRoute,'1');
  }
  // hide choices
  document.getElementById('choices').style.display='none';
  document.getElementById('choicesToggle').style.display='none';
  if(hist.length>0){
    var prev=hist[hist.length-1];
    _showChoicesOnly(prev);
  }
}

function tbModify(){
  var instruction=prompt('\u4fee\u6539\u610f\u89c1\uff08\u4f8b\u5982\u201c\u518d\u751c\u4e00\u70b9\u201d\u201c\u6c60\u518d\u4e3b\u52a8\u4e00\u70b9\u201d\uff09');
  if(!instruction) return;
  // delete current segment first
  tbDelete();
  // send modification request
  var body=document.getElementById('reader-body');
  var wait=document.createElement('div');
  wait.className='thinking-anim';
  wait.innerHTML='<span class="dot"></span><span class="dot"></span><span class="dot"></span> \u6b63\u5728\u91cd\u5199\u2026';
  body.appendChild(wait);
  window._ifWaitEl=wait;
  body.scrollTop=body.scrollHeight;
  try{
    var fx=new XMLHttpRequest();

function tbCopy(){
  var segs=document.querySelectorAll('._lastSeg:not(.if-toolbar)');
  var text='';
  for(var i=0;i<segs.length;i++){
    text+=segs[i].textContent+'\n';
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text.trim());
  } else {
    var ta=document.createElement('textarea');
    ta.value=text.trim();
    ta.style.position='fixed';ta.style.left='-9999px';
    document.body.appendChild(ta);ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  // visual feedback - flash green
  var tb=document.querySelector('.if-toolbar');
  if(tb){
    tb.style.background='rgba(100,200,130,0.8)';
    setTimeout(function(){tb.style.background='';},600);
  }
}

function _showChoicesOnly(data){
  if(data.choices&&data.choices.length>0){
    var choicesEl=document.getElementById('choices');
    choicesEl.innerHTML='';
    choicesEl.style.display='flex';
    document.getElementById('freeInput').style.display='flex';
    data.choices.forEach(function(ch2){
      var b=document.createElement('button');
      b.textContent=ch2.text;
      b.ontouchend=function(){
        document.getElementById('freeText').value=ch2.text;
        sendFreeInput();
      };
      choicesEl.appendChild(b);
    });
  }
}

<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>朋友圈</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,sans-serif; background:#111; color:#eee; min-height:100vh; padding-bottom:80px; }
.header { position:sticky; top:0; background:#111e; backdrop-filter:blur(10px); padding:14px 16px; border-bottom:1px solid #222; z-index:10; display:flex; justify-content:space-between; align-items:center; }
.header h1 { font-size:17px; font-weight:600; }
.header .btn-post { background:#2563eb; color:#fff; border:none; border-radius:16px; padding:6px 14px; font-size:13px; cursor:pointer; }
.feed { padding:8px 0; }
.moment-card { padding:14px 16px; border-bottom:1px solid #1a1a1a; }
.moment-header { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.avatar { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; }
.avatar-pool { background:#1e3a5f; }
.avatar-user { background:#3a1e5f; }
.author-name { font-size:14px; font-weight:500; }
.moment-time { font-size:11px; color:#666; margin-left:auto; }
.moment-content { font-size:14px; line-height:1.6; margin-bottom:8px; white-space:pre-wrap; }
.moment-actions { display:flex; gap:16px; align-items:center; margin-top:6px; }
.action-btn { background:none; border:none; color:#888; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:4px; }
.action-btn.liked { color:#e74c3c; }
.reply-box { margin-top:10px; background:#1a1a1a; border-radius:10px; padding:10px 12px; }
.reply-label { font-size:11px; color:#666; margin-bottom:4px; }
.reply-text { font-size:13px; line-height:1.5; }
.comments-section { margin-top:8px; padding-left:46px; }
.comment-item { font-size:13px; margin-bottom:4px; line-height:1.4; }
.comment-item .c-author { color:#5b9bd5; font-weight:500; }
.comment-item .c-text { color:#ccc; }
.comment-input-wrap { display:flex; gap:6px; margin-top:8px; padding-left:46px; }
.comment-input-wrap input { flex:1; background:#1a1a1a; border:1px solid #333; border-radius:14px; padding:6px 12px; font-size:13px; color:#eee; outline:none; }
.comment-input-wrap button { background:#2563eb; border:none; border-radius:14px; padding:6px 12px; font-size:12px; color:#fff; cursor:pointer; }
.modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:#000c; z-index:100; display:none; align-items:center; justify-content:center; padding:20px; }
.modal-overlay.show { display:flex; }
.modal { background:#1a1a1a; border-radius:16px; padding:20px; width:100%; max-width:340px; }
.modal h3 { font-size:15px; margin-bottom:12px; }
.modal textarea { width:100%; background:#111; border:1px solid #333; border-radius:10px; padding:10px; font-size:14px; color:#eee; resize:none; height:100px; outline:none; }
.modal .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:12px; }
.modal .actions button { border:none; border-radius:12px; padding:8px 16px; font-size:13px; cursor:pointer; }
.modal .cancel { background:#333; color:#ccc; }
.modal .submit { background:#2563eb; color:#fff; }
.empty { text-align:center; color:#555; padding:60px 20px; font-size:14px; }
.pending-badge { font-size:11px; color:#f59e0b; background:#2a2000; padding:2px 8px; border-radius:8px; }
</style>
</head><body>
<div class="header">
  <h1>朋友圈</h1>
  <button class="btn-post" onclick="showPostModal()">✏️ 写动态</button>
</div>
<div class="feed" id="feed"><div class="empty">加载中...</div></div>
<div class="modal-overlay" id="postModal">
  <div class="modal">
    <h3>发一条动态</h3>
    <textarea id="postContent" placeholder="此刻想说的话..."></textarea>
    <div class="actions">
      <button class="cancel" onclick="hidePostModal()">取消</button>
      <button class="submit" onclick="submitPost()">发布</button>
    </div>
  </div>
</div>
<script>
const API = '/api/moments';
let moments = [];
async function loadMoments() {
  try { const res = await fetch(API); const data = await res.json(); moments = data.entries || []; render(); }
  catch(e) { document.getElementById('feed').innerHTML = '<div class="empty">加载失败</div>'; }
}
function timeAgo(dateStr) {
  const now = new Date(); const d = new Date(dateStr.replace(' ', 'T') + '+08:00');
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return '刚刚'; if (diff < 3600) return Math.floor(diff/60) + '分钟前';
  if (diff < 86400) return Math.floor(diff/3600) + '小时前'; return Math.floor(diff/86400) + '天前';
}
function render() {
  if (!moments.length) { document.getElementById('feed').innerHTML = '<div class="empty">还没有动态<br>点右上角写一条，或者跟他聊天时他会自己发</div>'; return; }
  const html = moments.map(m => {
    const isPool = m.author === 'pool';
    const avatar = isPool ? '<div class="avatar avatar-pool">池</div>' : '<div class="avatar avatar-user">我</div>';
    const name = isPool ? '池' : '我';
    let replyHtml = '';
    if (m.reply_content && !isPool) replyHtml = `<div class="reply-box"><div class="reply-label">池 回复了：</div><div class="reply-text">${esc(m.reply_content)}</div></div>`;
    if ((m.reply_status === 'pending' || m.reply_status === 'processing') && !isPool) replyHtml = `<div style="margin-top:8px"><span class="pending-badge">池 还没看到...</span></div>`;
    let commentsHtml = '';
    if (m.comments && m.comments.length) {
      commentsHtml = '<div class="comments-section">' + m.comments.map(c => {
        const cName = c.author === 'pool' ? '池' : '我';
        return `<div class="comment-item"><span class="c-author">${cName}：</span><span class="c-text">${esc(c.content)}</span></div>`;
      }).join('') + '</div>';
    }
    const likeClass = (isPool ? m.user_liked : m.liked) ? 'liked' : '';
    const likeText = (isPool ? m.user_liked : m.liked) ? '❤️' : '🤍';
    const likeAction = isPool ? `onclick="toggleLike(${m.id})"` : '';
    return `<div class="moment-card">
      <div class="moment-header">${avatar}<span class="author-name">${name}</span><span class="moment-time">${timeAgo(m.created_at)}</span></div>
      <div class="moment-content">${esc(m.content)}</div>
      <div class="moment-actions"><button class="action-btn ${likeClass}" ${likeAction}>${likeText}</button><button class="action-btn" onclick="showComment(${m.id})">💬 评论</button></div>
      ${replyHtml}${commentsHtml}
      <div class="comment-input-wrap" id="ci_${m.id}" style="display:none"><input id="cin_${m.id}" placeholder="说点什么..." onkeydown="if(event.key==='Enter')submitComment(${m.id})"><button onclick="submitComment(${m.id})">发送</button></div>
    </div>`;
  }).join('');
  document.getElementById('feed').innerHTML = html;
}
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }
function showPostModal() { document.getElementById('postModal').classList.add('show'); document.getElementById('postContent').focus(); }
function hidePostModal() { document.getElementById('postModal').classList.remove('show'); }
async function submitPost() {
  const content = document.getElementById('postContent').value.trim(); if (!content) return;
  hidePostModal(); document.getElementById('postContent').value = '';
  await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ content }) }); loadMoments();
}
async function toggleLike(id) { await fetch(API, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id, action:'user_like' }) }); loadMoments(); }
function showComment(id) { const el = document.getElementById('ci_' + id); el.style.display = el.style.display === 'none' ? 'flex' : 'none'; if (el.style.display === 'flex') document.getElementById('cin_' + id).focus(); }
async function submitComment(id) { const input = document.getElementById('cin_' + id); const text = input.value.trim(); if (!text) return; input.value = ''; await fetch(API, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id, action:'comment', comment_content: text }) }); loadMoments(); }
loadMoments(); setInterval(loadMoments, 30000);
</script>
</body></html>

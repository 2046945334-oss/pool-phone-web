<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>朋友圈</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,'PingFang SC','Helvetica Neue',sans-serif; background:#f7f7f7; color:#1a1a1a; min-height:100vh; }
/* 顶部封面区 */
.cover-area { position:relative; width:100%; height:220px; overflow:hidden; }
.cover-img { width:100%; height:100%; object-fit:cover; display:block; }
.cover-placeholder { width:100%; height:100%; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); }
.cover-user { position:absolute; bottom:-20px; right:16px; display:flex; align-items:flex-end; gap:10px; }
.cover-user .name { font-size:15px; font-weight:600; color:#fff; text-shadow:0 1px 3px #0005; margin-bottom:28px; }
.cover-user .avatar-lg { width:56px; height:56px; border-radius:8px; border:3px solid #fff; overflow:hidden; background:#e8e0f0; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; color:#7c5cbf; box-shadow:0 2px 8px #0002; }
.cover-user .avatar-lg img { width:100%; height:100%; object-fit:cover; }
/* 操作栏 */
.action-bar { display:flex; justify-content:space-between; align-items:center; padding:28px 16px 10px; }
.action-bar .btn-post { background:none; border:none; font-size:22px; cursor:pointer; padding:4px; }
.action-bar .settings-btn { background:none; border:none; font-size:18px; cursor:pointer; color:#999; }
/* 设置面板 */
.settings-panel { display:none; background:#fff; margin:0 12px 10px; border-radius:12px; padding:14px 16px; box-shadow:0 1px 3px #0001; }
.settings-panel.show { display:block; }
.settings-panel h3 { font-size:14px; margin-bottom:12px; color:#666; font-weight:500; }
.setting-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.setting-row label { font-size:13px; color:#666; min-width:70px; }
.setting-row input[type=text] { flex:1; border:1px solid #e0e0e0; border-radius:8px; padding:6px 10px; font-size:13px; outline:none; }
.setting-row input[type=color] { width:36px; height:28px; border:none; cursor:pointer; }
.avatar-preview { width:32px; height:32px; border-radius:50%; overflow:hidden; background:#e8e0f0; }
.avatar-preview img { width:100%; height:100%; object-fit:cover; }
.upload-btn { background:#f0edfa; color:#7c5cbf; border:none; border-radius:8px; padding:5px 10px; font-size:12px; cursor:pointer; font-weight:500; }
.cover-preview { width:60px; height:30px; border-radius:4px; overflow:hidden; background:#eee; }
.cover-preview img { width:100%; height:100%; object-fit:cover; }
/* 动态列表 - 仿微信 */
.feed { padding:4px 0 20px; }
.moment-item { display:flex; gap:12px; padding:14px 16px; border-bottom:0.5px solid #ececec; }
.moment-item .avatar { width:40px; height:40px; border-radius:6px; flex-shrink:0; overflow:hidden; background:#e8e0f0; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; color:#7c5cbf; }
.moment-item .avatar img { width:100%; height:100%; object-fit:cover; }
.moment-item .avatar-pool { background:#e0ecf8; color:#4a7fbd; }
.moment-body { flex:1; min-width:0; }
.moment-body .author-name { font-size:15px; font-weight:600; color:#576b95; margin-bottom:4px; }
.moment-body .moment-content { font-size:15px; line-height:1.65; color:var(--text-color,#1a1a1a); white-space:pre-wrap; word-break:break-all; }
.moment-footer { display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
.moment-footer .time { font-size:12px; color:#b2b2b2; }
.moment-footer .ops { display:flex; gap:0; }
.moment-footer .ops button { background:#f7f7f7; border:1px solid #e8e8e8; color:#666; font-size:12px; padding:4px 10px; cursor:pointer; }
.moment-footer .ops button:first-child { border-radius:4px 0 0 4px; }
.moment-footer .ops button:last-child { border-radius:0 4px 4px 0; border-left:none; }
.moment-footer .ops button.liked { color:#e74c3c; }
/* 评论区 */
.comments-box { background:#f4f4f4; border-radius:4px; padding:8px 10px; margin-top:8px; position:relative; }
.comments-box::before { content:''; position:absolute; top:-6px; left:20px; border:6px solid transparent; border-bottom-color:#f4f4f4; }
.comment-item { font-size:13px; line-height:1.8; }
.comment-item .c-author { color:#576b95; font-weight:500; }
.reply-item { font-size:13px; color:#576b95; font-weight:500; line-height:1.8; }
.reply-item .r-text { color:#1a1a1a; font-weight:400; }
.pending-badge { font-size:12px; color:#b2b2b2; }
.comment-input-wrap { display:flex; gap:6px; margin-top:8px; }
.comment-input-wrap input { flex:1; background:#fff; border:1px solid #ddd; border-radius:4px; padding:6px 10px; font-size:13px; outline:none; }
.comment-input-wrap input:focus { border-color:#576b95; }
.comment-input-wrap button { background:#576b95; border:none; border-radius:4px; padding:6px 12px; font-size:12px; color:#fff; cursor:pointer; }
/* 弹窗 */
.modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:#0005; z-index:100; display:none; align-items:center; justify-content:center; padding:20px; }
.modal-overlay.show { display:flex; }
.modal { background:#fff; border-radius:12px; padding:20px; width:100%; max-width:320px; box-shadow:0 10px 40px #0003; }
.modal h3 { font-size:16px; margin-bottom:14px; color:#333; }
.modal textarea { width:100%; background:#f7f7f8; border:1px solid #e0e0e0; border-radius:8px; padding:12px; font-size:14px; color:#333; resize:none; height:100px; outline:none; }
.modal textarea:focus { border-color:#576b95; }
.modal .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
.modal .actions button { border:none; border-radius:6px; padding:9px 18px; font-size:13px; cursor:pointer; font-weight:500; }
.modal .cancel { background:#f0f0f0; color:#666; }
.modal .submit { background:#576b95; color:#fff; }
.empty { text-align:center; color:#999; padding:60px 20px; font-size:14px; line-height:1.8; }
</style>
</head><body>
<!-- 顶部封面 -->
<div class="cover-area" id="coverArea">
  <div class="cover-placeholder" id="coverBg"></div>
  <div class="cover-user">
    <span class="name" id="coverName">我</span>
    <div class="avatar-lg" id="coverAvatar">我</div>
  </div>
</div>
<!-- 操作栏 -->
<div class="action-bar">
  <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
  <button class="btn-post" onclick="showPostModal()">📷</button>
</div>
<!-- 设置面板 -->
<div class="settings-panel" id="settingsPanel">
  <h3>🎨 个性化设置</h3>
  <div class="setting-row"><label>我的头像</label><label class="upload-btn">📷 选择<input type="file" accept="image/*" hidden onchange="handleAvatarUpload('my',event)"></label><div class="avatar-preview" id="myAvatarPreview"></div></div>
  <div class="setting-row"><label>池的头像</label><label class="upload-btn">📷 选择<input type="file" accept="image/*" hidden onchange="handleAvatarUpload('pool',event)"></label><div class="avatar-preview" id="poolAvatarPreview"></div></div>
  <div class="setting-row"><label>封面图片</label><label class="upload-btn">🖼️ 选择<input type="file" accept="image/*" hidden onchange="handleCoverUpload(event)"></label><div class="cover-preview" id="coverPreview"></div></div>
  <div class="setting-row"><label>文字颜色</label><input type="color" id="textColor" value="#1a1a1a" oninput="saveSettings()"><span id="textColorHex" style="font-size:12px;color:#999">#1a1a1a</span></div>
</div>
<!-- 动态流 -->
<div class="feed" id="feed"><div class="empty">加载中...</div></div>
<!-- 发布弹窗 -->
<div class="modal-overlay" id="postModal">
  <div class="modal">
    <h3>发一条动态</h3>
    <textarea id="postContent" placeholder="此刻想说的话..."></textarea>
    <div class="actions">
      <button class="cancel" onclick="hidePostModal()">取消</button>
      <button class="submit" onclick="submitPost()">发布</button>
    </div>
  </div>
</div>
<script>
const API = '/api/moments';
let moments = [];
let settings = JSON.parse(localStorage.getItem('moments_settings') || '{}');

function applySettings() {
  document.getElementById('textColor').value = settings.textColor || '#1a1a1a';
  document.getElementById('textColorHex').textContent = settings.textColor || '#1a1a1a';
  document.documentElement.style.setProperty('--text-color', settings.textColor || '#1a1a1a');
  // 封面
  const coverBg = document.getElementById('coverBg');
  if (settings.coverImg) {
    coverBg.outerHTML = `<img class="cover-img" id="coverBg" src="${settings.coverImg}">`;
  }
  // 封面头像和名字
  const coverAvatar = document.getElementById('coverAvatar');
  if (settings.myAvatar) coverAvatar.innerHTML = `<img src="${settings.myAvatar}">`;
  updatePreviews();
}
function updatePreviews() {
  const myP = document.getElementById('myAvatarPreview');
  const poolP = document.getElementById('poolAvatarPreview');
  const coverP = document.getElementById('coverPreview');
  myP.innerHTML = settings.myAvatar ? `<img src="${settings.myAvatar}">` : '';
  poolP.innerHTML = settings.poolAvatar ? `<img src="${settings.poolAvatar}">` : '';
  coverP.innerHTML = settings.coverImg ? `<img src="${settings.coverImg}">` : '';
}
function handleAvatarUpload(who, e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    if (who === 'my') { settings.myAvatar = reader.result; document.getElementById('coverAvatar').innerHTML = `<img src="${reader.result}">`; }
    else settings.poolAvatar = reader.result;
    localStorage.setItem('moments_settings', JSON.stringify(settings));
    updatePreviews(); render();
  };
  reader.readAsDataURL(file);
}
function handleCoverUpload(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    settings.coverImg = reader.result;
    localStorage.setItem('moments_settings', JSON.stringify(settings));
    const area = document.getElementById('coverArea');
    const old = document.getElementById('coverBg');
    if (old.tagName === 'DIV') old.outerHTML = `<img class="cover-img" id="coverBg" src="${reader.result}">`;
    else old.src = reader.result;
    updatePreviews();
  };
  reader.readAsDataURL(file);
}
function saveSettings() {
  settings.textColor = document.getElementById('textColor').value;
  document.getElementById('textColorHex').textContent = settings.textColor;
  document.documentElement.style.setProperty('--text-color', settings.textColor);
  localStorage.setItem('moments_settings', JSON.stringify(settings));
  render();
}
function toggleSettings() { document.getElementById('settingsPanel').classList.toggle('show'); }
function getAvatar(author) {
  if (author === 'pool') {
    if (settings.poolAvatar) return `<div class="avatar avatar-pool"><img src="${settings.poolAvatar}"></div>`;
    return '<div class="avatar avatar-pool">池</div>';
  }
  if (settings.myAvatar) return `<div class="avatar"><img src="${settings.myAvatar}"></div>`;
  return '<div class="avatar">我</div>';
}
async function loadMoments() {
  try { const res = await fetch(API); const data = await res.json(); moments = data.entries || []; render(); }
  catch(e) { document.getElementById('feed').innerHTML = '<div class="empty">加载失败</div>'; }
}
function timeAgo(dateStr) {
  if (!dateStr) return '';
  const now = new Date(); const d = new Date(dateStr.replace(' ', 'T') + '+08:00');
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return '刚刚'; if (diff < 3600) return Math.floor(diff/60) + '分钟前';
  if (diff < 86400) return Math.floor(diff/3600) + '小时前'; return Math.floor(diff/86400) + '天前';
}
function render() {
  if (!moments.length) { document.getElementById('feed').innerHTML = '<div class="empty">还没有动态 💭<br><br>点右上角 📷 发一条<br>聊天时他也会自己发朋友圈</div>'; return; }
  const html = moments.map(m => {
    const isPool = m.author === 'pool';
    const name = isPool ? '池' : '我';
    // 评论区
    let commentsHtml = '';
    const commentItems = [];
    if (m.reply_content && !isPool) {
      commentItems.push(`<div class="reply-item">池 <span class="r-text">回复 我：${esc(m.reply_content)}</span></div>`);
    } else if ((m.reply_status === 'pending' || m.reply_status === 'processing') && !isPool) {
      commentItems.push(`<div class="pending-badge">💤 池还没看到</div>`);
    }
    if (m.comments && m.comments.length) {
      m.comments.forEach(c => {
        const cName = c.author === 'pool' ? '池' : '我';
        commentItems.push(`<div class="comment-item"><span class="c-author">${cName}</span>：${esc(c.content)}</div>`);
      });
    }
    if (commentItems.length) commentsHtml = `<div class="comments-box">${commentItems.join('')}</div>`;
    const liked = isPool ? m.user_liked : m.liked;
    return `<div class="moment-item">
      ${getAvatar(m.author)}
      <div class="moment-body">
        <div class="author-name">${name}</div>
        <div class="moment-content">${esc(m.content)}</div>
        <div class="moment-footer">
          <span class="time">${timeAgo(m.created_at)}</span>
          <div class="ops">
            <button class="${liked?'liked':''}" onclick="toggleLike(${m.id})">${liked?'❤️':'🤍'}</button>
            <button onclick="showComment(${m.id})">💬</button>
          </div>
        </div>
        ${commentsHtml}
        <div class="comment-input-wrap" id="ci_${m.id}" style="display:none"><input id="cin_${m.id}" placeholder="评论..." onkeydown="if(event.key==='Enter')submitComment(${m.id})"><button onclick="submitComment(${m.id})">发送</button></div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('feed').innerHTML = html;
}
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }
function showPostModal() { document.getElementById('postModal').classList.add('show'); document.getElementById('postContent').focus(); }
function hidePostModal() { document.getElementById('postModal').classList.remove('show'); }
async function submitPost() {
  const content = document.getElementById('postContent').value.trim(); if (!content) return;
  hidePostModal(); document.getElementById('postContent').value = '';
  await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ content }) }); loadMoments();
}
async function toggleLike(id) { await fetch(API, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id, action:'user_like' }) }); loadMoments(); }
function showComment(id) { const el = document.getElementById('ci_' + id); el.style.display = el.style.display === 'none' ? 'flex' : 'none'; if (el.style.display === 'flex') document.getElementById('cin_' + id).focus(); }
async function submitComment(id) { const input = document.getElementById('cin_' + id); const text = input.value.trim(); if (!text) return; input.value = ''; await fetch(API, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id, action:'comment', comment_content: text }) }); loadMoments(); }
applySettings(); loadMoments(); setInterval(loadMoments, 30000);
</script>
</body></html>

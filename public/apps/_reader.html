<!DOCTYPE html>
<html>
<head><script src="sync.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Reader</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,sans-serif; background:url('reader_bg.png') center/cover fixed; color:#333; padding:12px; font-size:15px; }
.view { display:none; }
.view.active { display:block; }
.book-card { background:#fff; border-radius:12px; padding:14px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
.book-title { font-size:16px; font-weight:600; margin-bottom:4px; }
.book-meta { font-size:12px; color:#888; }
.together-badge { display:inline-block; background:#fff3e0; color:#e65100; font-size:11px; padding:2px 8px; border-radius:10px; margin-top:4px; }
.btn { display:inline-block; background:#1976d2; color:#fff; border:none; padding:8px 16px; border-radius:8px; font-size:14px; cursor:pointer; }
.btn-del { background:#e53935; margin-left:8px; }
.reader-content { line-height:1.8; padding:8px 4px; font-size:16px; }
.chapter-nav { display:flex; justify-content:space-between; padding:12px 0; }
.chapter-nav button { background:#e3f2fd; border:none; padding:8px 14px; border-radius:8px; color:#1565c0; font-size:13px; }
.note-card { background:#e8f5e9; border-left:3px solid #4caf50; padding:10px 12px; margin-top:12px; border-radius:0 8px 8px 0; }
.note-card h4 { color:#2e7d32; font-size:13px; margin-bottom:6px; }
.note-card p { font-size:13px; color:#333; margin-bottom:4px; }
.import-area { border:2px dashed #ccc; border-radius:12px; padding:30px; text-align:center; margin:16px 0; }
.back-btn { background:none; border:none; font-size:20px; padding:8px; cursor:pointer; }
.toolbar { display:flex; align-items:center; margin-bottom:12px; gap:8px; }
.toolbar h2 { flex:1; font-size:18px; }
.debug-box { background:#fff3e0; border:1px solid #ffb74d; border-radius:8px; padding:8px; margin-bottom:10px; font-size:11px; color:#e65100; }
</style>
</head>
<body>
<div id="shelfView" class="view active">
<div class="toolbar"><h2>书架</h2><button class="btn" onclick="showImport()">+ 导入TXT</button></div>
<div id="bookList"></div>
</div>
<div id="importView" class="view">
<div class="toolbar"><button class="back-btn" onclick="showShelf()">&larr;</button><h2>导入书籍</h2></div>
<div class="import-area">
<p>选择 .txt 文件</p>
<input type="file" accept=".txt" onchange="handleFile(this)">
</div>
</div>
<div id="readerView" class="view">
<div class="toolbar"><button class="back-btn" onclick="backToShelf()">&larr;</button><h2 id="chapterTitle"></h2></div>
<div id="chapterContent" class="reader-content"></div>
<div class="chapter-nav">
<button onclick="prevChapter()">← 上一章</button>
<span id="chapterPos"></span>
<button onclick="nextChapter()">下一章 →</button>
</div>
</div>
<script>
var DATA_KEY = "pool_reader_books";
var TOGETHER_KEY = "pool_reader_together";
var books = [];
var together = "";
var aiProgress = 0;
var aiNotes = null;
var currentBook = null;
var currentChapter = 0;

function loadData() {
    try {
        var raw = localStorage.getItem(DATA_KEY);
        if (raw) books = JSON.parse(raw);
    } catch(e) { books = []; }
    try {
        together = localStorage.getItem(TOGETHER_KEY) || "";
    } catch(e) {}
}

function saveData() {
    try {
        localStorage.setItem(DATA_KEY, JSON.stringify(books));
        localStorage.setItem(TOGETHER_KEY, together);
        // Also persist to file via Bridge
        var payload = { books: books, together: together, ai_progress: aiProgress, ai_notes: aiNotes };
        if (window._PoolReaderBridge) window._PoolReaderBridge.saveData(JSON.stringify(payload));
    } catch(e) {}
}

function _receiveData(jsonStr) {
    try {
        var d = JSON.parse(jsonStr);
        if (d.together !== undefined) {
            together = d.together;
            localStorage.setItem(TOGETHER_KEY, together);
        }
        if (d.ai_progress !== undefined) aiProgress = d.ai_progress;
        if (d.ai_notes) aiNotes = d.ai_notes;
        if (d.books && Array.isArray(d.books) && d.books.length > 0) {
            books = d.books;
            localStorage.setItem(DATA_KEY, JSON.stringify(books));
        }
        renderShelf();
    } catch(e) {}
}

function loadMetaFromFile() {
    // Try to load metadata via XHR from local file
    try {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "file:///sdcard/Download/pool_phone_reader_meta.json", false);
        xhr.send();
        if (xhr.status === 0 || xhr.status === 200) {
            var d = JSON.parse(xhr.responseText);
            if (d.together) together = d.together;
            if (d.ai_progress !== undefined) aiProgress = d.ai_progress;
            if (d.ai_notes) aiNotes = d.ai_notes;
        }
    } catch(e) {
        // XHR failed, try Bridge return value
        try {
            if (window._PoolReaderBridge) {
                var str = window._PoolReaderBridge.loadData();
                if (str && str !== "{}" && str.length < 5000) {
                    _receiveData(str);
                }
            }
        } catch(e2) {}
    }
}

function showView(id) {
    document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
}
function showShelf() { showView('shelfView'); renderShelf(); }
function showImport() { showView('importView'); }

function renderShelf() {
    var el = document.getElementById('bookList');
    var html = '';
    // Debug info
    html += '<div class="debug-box">\uD83D\uDD27 v3 | together=' + together + ' | aiP=' + aiProgress + ' | notes=' + (aiNotes ? aiNotes.length : 0) + '</div>';
    if (books.length === 0) {
        html += '<p style="color:#999;text-align:center;padding:40px">\u8FD8\u6CA1\u6709\u4E66\uFF0C\u70B9\u53F3\u4E0A\u89D2\u5BFC\u5165</p>';
        el.innerHTML = html;
        return;
    }
    for (var i = 0; i < books.length; i++) {
        var b = books[i];
        var total = b.chapters ? b.chapters.length : 0;
        var pos = (b.lastChapter || 0) + 1;
        html += '<div class="book-card" onclick="openBook(' + i + ')">';
        html += '<div class="book-title">' + escHtml(b.title) + '</div>';
        html += '<div class="book-meta">' + total + '\u7AE0 \u00B7 \u8BFB\u5230\u7B2C' + pos + '\u7AE0</div>';
        // Together badge
        if (together && b.id === together) {
            var badgeText = '\uD83D\uDC40 \u6C60\u5728\u770B';
            if (aiProgress > 0) badgeText += '\uFF08\u8BFB\u5230\u7B2C' + (aiProgress + 1) + '\u7AE0\uFF09';
            html += '<div class="together-badge">' + badgeText + '</div>';
        }
        html += '<button class="btn btn-del" onclick="event.stopPropagation();delBook(' + i + ')" style="float:right;margin-top:-30px">\u5220</button>';
        html += '</div>';
    }
    html += '<div style="height:20px"></div>';
    el.innerHTML = html;
}

function renderReader() {
    if (!currentBook) return;
    var ch = currentBook.chapters[currentChapter];
    document.getElementById('chapterTitle').textContent = ch.title || ('\u7B2C' + (currentChapter+1) + '\u7AE0');
    var contentHtml = '<p>' + escHtml(ch.content).replace(/\n/g, '</p><p>') + '</p>';
    // Show AI notes for this chapter
    if (aiNotes && together && currentBook.id === together) {
        var chapterNotes = [];
        for (var i = 0; i < aiNotes.length; i++) {
            if (aiNotes[i].chapter === currentChapter) chapterNotes.push(aiNotes[i]);
        }
        if (chapterNotes.length > 0) {
            contentHtml += '<div class="note-card"><h4>\uD83D\uDCDD \u6C60\u7684\u6279\u6CE8</h4>';
            for (var j = 0; j < chapterNotes.length; j++) {
                contentHtml += '<p>' + escHtml(chapterNotes[j].text) + '</p>';
            }
            contentHtml += '</div>';
        }
    }
    document.getElementById('chapterContent').innerHTML = contentHtml;
    document.getElementById('chapterPos').textContent = (currentChapter+1) + '/' + currentBook.chapters.length;
}

function openBook(idx) {
    currentBook = books[idx];
    currentChapter = currentBook.lastChapter || 0;
    showView('readerView');
    renderReader();
}
function backToShelf() {
    if (currentBook) {
        currentBook.lastChapter = currentChapter;
        saveData();
    }
    currentBook = null;
    showShelf();
}
function prevChapter() {
    if (currentChapter > 0) { currentChapter--; renderReader(); window.scrollTo(0,0); }
}
function nextChapter() {
    if (currentBook && currentChapter < currentBook.chapters.length - 1) { currentChapter++; renderReader(); window.scrollTo(0,0); }
}

function handleFile(input) {
    var file = input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        var text = e.target.result;
        // Check if garbled (GBK detection)
        if (text.indexOf('\ufffd') > -1 || /[\x00-\x08]/.test(text.substring(0,200))) {
            // retry as GBK
            var reader2 = new FileReader();
            reader2.onload = function(e2) { importText(file.name, e2.target.result); };
            reader2.readAsText(file, 'GBK');
        } else {
            importText(file.name, text);
        }
    };
    reader.readAsText(file, 'UTF-8');
}

function importText(filename, text) {
    var title = filename.replace(/\.txt$/i, '');
    var chapters = splitChapters(text);
    var id = Math.random().toString(36).substr(2, 8);
    books.push({ id: id, title: title, chapters: chapters, lastChapter: 0 });
    saveData();
    showShelf();
}

function splitChapters(text) {
    var lines = text.split(/\r?\n/);
    // Pattern 1: standard chapter headers (limit title length to 30)
    var p1 = /^\s*\u7B2C[\u4E00\u4E8C\u4E09\u56DB\u4E94\u516D\u4E03\u516B\u4E5D\u5341\u767E\u5343\u4E07\u96F6\d]{1,10}[\u7AE0\u8282\u56DE\u5377\u96C6\u7BC7]/;
    var p2 = /^\s*Chapter\s+\d+/i;
    var p3 = /^\s*\d{1,4}[\s\.\u3001\uff0e]/;
    var detected = [];
    var threshold1 = 3, threshold3 = 5;
    var c1=0, c2=0, c3=0;
    for (var i = 0; i < lines.length; i++) {
        var l = lines[i];
        if (p1.test(l) && l.trim().length <= 30) c1++;
        if (p2.test(l)) c2++;
        if (p3.test(l) && l.trim().length <= 20) c3++;
    }
    var usePattern = null;
    if (c1 >= threshold1) usePattern = function(l){ return p1.test(l) && l.trim().length <= 30; };
    else if (c2 >= 3) usePattern = function(l){ return p2.test(l); };
    else if (c3 >= threshold3) usePattern = function(l){ return p3.test(l) && l.trim().length <= 20; };
    if (usePattern) {
        var chapters = [];
        var curTitle = '', curLines = [];
        for (var i = 0; i < lines.length; i++) {
            if (usePattern(lines[i])) {
                if (curTitle || curLines.length > 0) {
                    chapters.push({ title: curTitle, content: curLines.join('\n') });
                }
                curTitle = lines[i].trim();
                curLines = [];
            } else {
                curLines.push(lines[i]);
            }
        }
        if (curTitle || curLines.length > 0) chapters.push({ title: curTitle, content: curLines.join('\n') });
        if (chapters.length >= 3) return chapters;
    }
    // Fallback: split by ~2000 chars
    var chapters = [];
    var chunk = '';
    var idx = 0;
    for (var i = 0; i < lines.length; i++) {
        chunk += lines[i] + '\n';
        if (chunk.length >= 2000) {
            chapters.push({ title: '\u7B2C' + (++idx) + '\u7AE0', content: chunk });
            chunk = '';
        }
    }
    if (chunk) chapters.push({ title: '\u7B2C' + (++idx) + '\u7AE0', content: chunk });
    return chapters;
}

function delBook(idx) {
    if (confirm('\u5220\u9664\u300A' + books[idx].title + '\u300B\uFF1F')) {
        books.splice(idx, 1);
        saveData();
        renderShelf();
    }
}

function escHtml(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function toast(msg) {
    var t = document.createElement('div');
    t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;z-index:999';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 2000);
}

// === Init ===
loadData();
loadMetaFromFile();
renderShelf();
</script>
</body>
</html>

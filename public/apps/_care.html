<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>小水养护手册</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap');
:root {
  --ink: #2C2C2C; --ink-light: #8A8A8A; --paper: #FDF8F0; --paper-dark: #F5EDE0;
  --cream: #FFF9F0; --rose: #C4867A; --rose-light: #E8C4BC;
  --lavender: #A89BBF; --sage: #8FA88C; --sky: #7FA8C4; --amber: #C4A66A;
  --shadow-book: 6px 6px 24px rgba(0,0,0,0.12), -2px -2px 8px rgba(255,255,255,0.8);
  --accent: var(--rose);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Serif SC','Georgia',serif;background:#E8E0D4;color:var(--ink);max-width:430px;margin:0 auto;min-height:100vh;overflow-x:hidden;transition:background 0.5s}
.icon{display:inline-flex;align-items:center;justify-content:center}
.icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-sm svg{width:18px;height:18px}
.icon-lg svg{width:32px;height:32px}

/* Cover */
.cover{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s,transform 1s;background-size:cover;background-position:center}
.cover::after{content:'';position:absolute;inset:0;background:rgba(245,237,224,0.85)}
.cover.hide{opacity:0;transform:scale(1.05);pointer-events:none}
.cover>*{position:relative;z-index:1}
.cover-book{width:200px;height:280px;border-radius:2px 12px 12px 2px;position:relative;box-shadow:8px 8px 30px rgba(0,0,0,0.2),-4px 0 12px rgba(0,0,0,0.05);display:flex;align-items:center;justify-content:center;animation:bookFloat 4s ease-in-out infinite;background-size:cover;background-position:center}
.cover-book::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;background:linear-gradient(to right,rgba(0,0,0,0.15),transparent);z-index:1}
.cover-book-title{writing-mode:vertical-rl;font-family:'ZCOOL XiaoWei',serif;font-size:28px;color:#F5EDE0;letter-spacing:8px;text-shadow:1px 1px 4px rgba(0,0,0,0.3);position:relative;z-index:1}
@keyframes bookFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(1deg)}}
.cover-sub{color:var(--ink-light);font-size:13px;margin-top:24px;letter-spacing:4px}
.cover-enter{margin-top:40px;background:none;border:1.5px solid var(--ink-light);padding:12px 40px;border-radius:2px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--ink);letter-spacing:4px;transition:all 0.3s}
.cover-enter:hover{background:var(--ink);color:var(--paper)}

/* App */
.app{display:none}.app.show{display:block}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--paper);border-bottom:1px solid rgba(0,0,0,0.06);position:sticky;top:0;z-index:100}
.topbar-back{cursor:pointer;padding:4px;color:var(--ink);visibility:hidden}
.topbar-title{font-size:15px;font-weight:600;letter-spacing:3px}
.topbar-actions{display:flex;gap:12px}
.topbar-actions span{cursor:pointer;padding:4px;color:var(--ink-light)}

/* Bookshelf */
.bookshelf{padding:24px 20px 100px}
.bookshelf-header{text-align:center;margin-bottom:32px}
.bookshelf-header h2{font-family:'ZCOOL XiaoWei',serif;font-size:22px;letter-spacing:6px}
.bookshelf-header .sub{font-size:12px;color:var(--ink-light);margin-top:6px;letter-spacing:2px}
.bookshelf-date{text-align:center;font-size:11px;color:var(--ink-light);margin-bottom:24px;letter-spacing:1px}
.book-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;perspective:1000px}
.book{height:180px;border-radius:2px 10px 10px 2px;position:relative;cursor:pointer;transition:transform 0.3s,box-shadow 0.3s;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background-size:cover;background-position:center}
.book::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;background:linear-gradient(to right,rgba(0,0,0,0.12),transparent);z-index:1}
.book::after{content:'';position:absolute;right:0;top:0;bottom:0;width:6px;background:linear-gradient(to left,rgba(0,0,0,0.06),transparent)}
.book:active{transform:scale(0.96)}
.book .book-icon{margin-bottom:12px;color:rgba(255,255,255,0.9)}
.book .book-label{font-size:14px;font-weight:600;letter-spacing:3px;color:rgba(255,255,255,0.95);text-shadow:0 1px 3px rgba(0,0,0,0.15)}
.book .book-sub{font-size:10px;color:rgba(255,255,255,0.7);margin-top:4px;letter-spacing:1px}
.book .book-badge{position:absolute;top:10px;right:12px;background:rgba(255,255,255,0.25);backdrop-filter:blur(4px);padding:2px 8px;border-radius:10px;font-size:10px;color:#fff}
.book-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.15);z-index:0}
.book>*:not(.book-overlay):not(.book-badge){position:relative;z-index:1}

/* Notebook */
.notebook{width:100%;max-width:100%;height:100%;max-height:100%;background:var(--paper);border-radius:0;box-shadow:none;position:relative;overflow:hidden;animation:nbOpen 0.3s ease;display:flex;flex-direction:column}
.nb-view{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;align-items:stretch;justify-content:stretch;flex-direction:column}
.nb-view.open{display:flex}
@keyframes nbOpen{from{transform:rotateY(-30deg) scale(0.9);opacity:0}to{transform:rotateY(0) scale(1);opacity:1}}
.notebook::before{content:'';position:absolute;left:0;top:0;bottom:0;width:40px;background:linear-gradient(to right,rgba(0,0,0,0.03),transparent);border-right:1px solid rgba(0,0,0,0.04);z-index:1}
.nb-header{display:flex;align-items:center;padding:16px 16px 16px 52px;border-bottom:1px solid rgba(0,0,0,0.06);position:relative}
.nb-header .nb-back{cursor:pointer;padding:8px 12px;color:var(--ink-light);position:absolute;left:8px;z-index:10;-webkit-tap-highlight-color:transparent}
.nb-header h2{font-size:16px;letter-spacing:4px;flex:1;text-align:center}
.nb-body{overflow-y:auto;flex:1;padding:24px 20px 24px 52px;position:relative;background-image:repeating-linear-gradient(transparent,transparent 31px,rgba(0,0,0,0.04) 31px,rgba(0,0,0,0.04) 32px)}
.nb-body::before{content:'';position:absolute;left:40px;top:0;bottom:0;width:1px;background:rgba(196,134,122,0.15)}
.page-turner{display:flex;justify-content:space-between;align-items:center;padding:12px 52px;border-top:1px solid rgba(0,0,0,0.04)}
.pt-btn{background:none;border:1px solid rgba(0,0,0,0.1);padding:6px 16px;border-radius:2px;cursor:pointer;font-family:inherit;font-size:12px;color:var(--ink-light);letter-spacing:2px;transition:all 0.2s}
.pt-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pt-btn:disabled{opacity:0.3;cursor:default}
.pt-btn:disabled:hover{background:none;color:var(--ink-light);border-color:rgba(0,0,0,0.1)}
.pt-num{font-size:11px;color:var(--ink-light)}

/* NB Components */
.nb-status{text-align:center;padding:24px 0;margin-bottom:20px;border-bottom:1px dashed rgba(0,0,0,0.08)}
.nb-status .big-num{font-size:48px;font-weight:700;color:var(--rose);font-family:'Georgia',serif}
.nb-status .big-label{font-size:12px;color:var(--ink-light);margin-top:4px;letter-spacing:2px}
.nb-sec{font-size:13px;font-weight:600;letter-spacing:3px;margin:20px 0 12px;padding-bottom:6px;border-bottom:1px solid rgba(0,0,0,0.06);display:flex;align-items:center;gap:8px}
.nb-sec .icon{color:var(--ink-light)}
.nb-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid rgba(0,0,0,0.04);cursor:pointer;position:relative}
.nb-item:last-child{border:none}
.nb-check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--rose-light);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.2s;margin-top:2px}
.nb-check.done{background:var(--rose);border-color:var(--rose)}
.nb-check.done svg{stroke:#fff}
.nb-text{flex:1;font-size:14px;line-height:1.6}
.nb-text.done-text{text-decoration:line-through;color:var(--ink-light)}
.nb-sub{font-size:11px;color:var(--ink-light);margin-top:2px}

/* Inline Note */
.item-note-btn{position:absolute;top:12px;right:0;cursor:pointer;color:rgba(0,0,0,0.15);transition:color 0.2s;padding:2px}
.item-note-btn:hover,.item-note-btn.has-note{color:var(--amber)}
.item-notes{padding:8px 0 4px 32px;margin-bottom:4px}
.item-note{font-size:12px;line-height:1.7;color:var(--ink-light);padding:6px 10px;background:rgba(196,166,106,0.06);border-left:2px solid var(--amber);margin-bottom:6px;border-radius:0 4px 4px 0;position:relative}
.item-note .note-del{position:absolute;top:4px;right:6px;cursor:pointer;font-size:10px;color:rgba(0,0,0,0.2);opacity:0;transition:opacity 0.2s}
.item-note:hover .note-del{opacity:1}
.item-note-add{display:flex;gap:6px;margin-top:4px}
.item-note-add input{flex:1;padding:5px 8px;border:1px solid rgba(0,0,0,0.08);border-radius:2px;font-family:inherit;font-size:11px;background:transparent;outline:none}
.item-note-add input:focus{border-color:var(--rose-light)}
.item-note-add button{padding:5px 10px;background:var(--amber);color:#fff;border:none;border-radius:2px;cursor:pointer;font-family:inherit;font-size:11px}

/* NB Input */
.nb-input-bar{display:flex;gap:8px;margin-top:16px;padding-top:12px;border-top:1px dashed rgba(0,0,0,0.06)}
.nb-input-bar input,.nb-input-bar textarea{flex:1;padding:10px 14px;border:1px solid rgba(0,0,0,0.08);border-radius:2px;font-family:inherit;font-size:13px;background:transparent;outline:none;color:var(--ink)}
.nb-input-bar input:focus,.nb-input-bar textarea:focus{border-color:var(--rose-light)}
.nb-input-bar button{padding:10px 16px;background:var(--ink);color:var(--paper);border:none;border-radius:2px;cursor:pointer;font-family:inherit;font-size:12px;letter-spacing:2px}

/* Tags */
.nb-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.nb-tag{padding:4px 12px;border-radius:2px;font-size:11px;border:1px solid rgba(0,0,0,0.1);cursor:pointer;letter-spacing:1px;transition:all 0.2s}
.nb-tag.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Quote */
.nb-quote{padding:20px 16px;margin:16px 0;border-left:2px solid var(--amber);font-style:italic;font-size:14px;line-height:2;color:var(--ink-light);background:rgba(196,166,106,0.05)}

/* Mood */
.mood-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.mood-nav h3{font-size:15px;letter-spacing:3px}
.mood-nav span{cursor:pointer;padding:4px 8px;color:var(--ink-light);font-size:18px}
.mood-wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--ink-light);margin-bottom:6px;letter-spacing:1px}
.mood-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mood-day{aspect-ratio:1;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;cursor:pointer;background:rgba(0,0,0,0.02);transition:all 0.2s}
.mood-day.today{box-shadow:inset 0 0 0 1.5px var(--rose)}
.mood-day .mf{font-size:16px;line-height:1}
.mood-day.empty{background:transparent}
.mood-day:hover{background:rgba(196,134,122,0.08)}
.mood-pair{display:flex;gap:12px;margin-top:16px}
.mood-col{flex:1}
.mood-col h4{font-size:12px;color:var(--ink-light);text-align:center;margin-bottom:10px;letter-spacing:1px}
.mood-opts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.mood-opt{width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(0,0,0,0.08);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:all 0.2s}
.mood-opt:active,.mood-opt.sel{border-color:var(--rose);transform:scale(1.1);background:rgba(196,134,122,0.06)}

/* Timeline */
.nb-tl{position:relative;padding-left:28px}
.nb-tl::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:1px;background:linear-gradient(var(--rose-light),var(--lavender))}
.nb-tl-item{position:relative;margin-bottom:24px}
.nb-tl-dot{position:absolute;left:-24px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--rose)}
.nb-tl-card{padding:12px 0;border-bottom:1px solid rgba(0,0,0,0.04)}
.nb-tl-card .tl-date{font-size:11px;color:var(--ink-light);margin-bottom:4px;letter-spacing:1px}
.nb-tl-card .tl-text{font-size:14px;line-height:1.8}
.nb-tl-card .tl-avs{display:flex;gap:4px;margin-top:8px}
.tl-av{width:22px;height:22px;border-radius:50%;background:var(--rose-light);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}

/* Wish */
.nb-wish{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid rgba(0,0,0,0.04)}
.wish-star{cursor:pointer;color:rgba(0,0,0,0.15);transition:color 0.2s;padding-top:2px}
.wish-star.active{color:var(--amber)}
.wish-info{flex:1}
.wish-name{font-size:14px;font-weight:600}
.wish-note{font-size:12px;color:var(--ink-light);margin-top:4px;line-height:1.6}
.wish-bar{width:100%;height:3px;background:rgba(0,0,0,0.06);border-radius:2px;margin-top:8px;overflow:hidden}
.wish-bar .fill{height:100%;background:var(--amber);border-radius:2px;transition:width 0.5s}

/* Dashboard */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dash-card{padding:20px;text-align:center;border:1px solid rgba(0,0,0,0.06);border-radius:2px}
.dash-num{font-size:32px;font-weight:700;font-family:'Georgia',serif}
.dash-label{font-size:11px;color:var(--ink-light);margin-top:4px;letter-spacing:2px}
.dash-chart{margin-top:16px;padding:16px;border:1px solid rgba(0,0,0,0.06);border-radius:2px}
.dash-chart h3{font-size:13px;letter-spacing:2px;margin-bottom:12px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-day{font-size:11px;color:var(--ink-light);width:20px;text-align:center}
.bar-track{flex:1;height:8px;background:rgba(0,0,0,0.04);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width 0.6s ease}

/* ===== Customize Module ===== */
.cust-section{margin-bottom:20px;padding-bottom:16px;border-bottom:1px dashed rgba(0,0,0,0.06)}
.cust-section:last-child{border:none}
.cust-label{font-size:12px;color:var(--ink-light);letter-spacing:2px;margin-bottom:10px}
.cust-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cust-color{width:36px;height:36px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all 0.2s;position:relative}
.cust-color.sel{border-color:var(--ink);transform:scale(1.1)}
.cust-color.sel::after{content:'';position:absolute;inset:3px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.6)}
.cust-wallpaper{width:60px;height:80px;border-radius:4px;cursor:pointer;border:2px solid transparent;transition:all 0.2s;background-size:cover;background-position:center;position:relative}
.cust-wallpaper.sel{border-color:var(--ink);transform:scale(1.05)}
.cust-avatar-btn{width:56px;height:56px;border-radius:50%;cursor:pointer;border:2px dashed rgba(0,0,0,0.15);display:flex;align-items:center;justify-content:center;font-size:20px;transition:all 0.2s;background:rgba(0,0,0,0.03);overflow:hidden}
.cust-avatar-btn img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.cust-avatar-btn:hover{border-color:var(--rose-light)}
.cust-font-btn{padding:8px 16px;border-radius:2px;border:1px solid rgba(0,0,0,0.1);cursor:pointer;font-size:12px;letter-spacing:1px;transition:all 0.2s}
.cust-font-btn.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cust-preview{margin-top:12px;padding:16px;border-radius:4px;text-align:center;font-size:13px;letter-spacing:1px;border:1px solid rgba(0,0,0,0.06)}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--paper);display:flex;justify-content:space-around;padding:10px 0 14px;border-top:1px solid rgba(0,0,0,0.06);z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;cursor:pointer;font-size:10px;color:var(--ink-light);gap:3px;letter-spacing:1px;transition:color 0.2s}
.nav-item .nav-icon{opacity:0.5;transition:opacity 0.2s}
.nav-item.active{color:var(--ink)}
.nav-item.active .nav-icon{opacity:1}

/* Toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 24px;border-radius:2px;font-size:13px;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;letter-spacing:1px}
.toast.show{opacity:1}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:500;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal-bg.show{display:flex}
.modal-box{background:var(--paper);border-radius:2px 8px 8px 2px;padding:28px 24px;width:88%;max-width:360px;box-shadow:12px 12px 40px rgba(0,0,0,0.25)}
.modal-box h3{font-size:16px;letter-spacing:4px;margin-bottom:20px;text-align:center}
.modal-box input,.modal-box textarea{width:100%;padding:10px 14px;border:1px solid rgba(0,0,0,0.1);border-radius:2px;font-family:inherit;font-size:13px;background:transparent;outline:none;margin-bottom:12px;color:var(--ink)}
.modal-box textarea{resize:vertical;min-height:80px}
.modal-box input:focus,.modal-box textarea:focus{border-color:var(--rose-light)}
.modal-btns{display:flex;gap:10px;margin-top:4px}
.modal-btns button{flex:1;padding:10px;border-radius:2px;border:1px solid rgba(0,0,0,0.1);font-family:inherit;font-size:13px;cursor:pointer;letter-spacing:2px;transition:all 0.2s}
.mb-cancel{background:transparent;color:var(--ink-light)}
.mb-ok{background:var(--ink);color:var(--paper);border-color:var(--ink)!important}

/* Scrollbar */
.nb-body::-webkit-scrollbar{width:4px}
.nb-body::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.1);border-radius:2px}

/* Hidden file input */
.hidden-input{display:none}
</style>
</head>
<body>

<!-- Cover -->
<div class="cover" id="cover">
  <div class="cover-book" id="coverBook"><span class="cover-book-title"></span></div>
  <p class="cover-sub"></p>
  <button class="cover-enter" onclick="openApp()">翻 开</button>
</div>

<!-- App -->
<div class="app" id="app">
  <div class="topbar">
    <span class="topbar-back" onclick="goBack()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></span>
    <span class="topbar-title">小水养护手册</span>
    <div class="topbar-actions">
      <span class="icon icon-sm" onclick="toggleSearch()"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg></span>
      <span class="icon icon-sm" onclick="openBook('customize')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
    </div>
  </div>
  <div id="searchBar" style="display:none;padding:0 20px 12px;background:var(--paper)">

<script>
// ===== SVG Icons =====
const IC={check:'<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',heart:'<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>',pen:'<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>',cal:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',bell:'<svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>',book:'<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',note:'<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'};

// ===== Data =====
const DEF={
  period:{dates:[],interval:28,remindDays:3},
  habits:[],
  nicknames:['小水'],
  quotes:[],
  moods:{},
  todos:[],
  timeline:[],
  wishes:[],
  // itemNotes: { 'todo:1': [{text,author,time}], 'wish:2': [...], 'habit:0': [...] }
  itemNotes:{},
  theme:{coverBg:'',shelfBg:'',paperColor:'',accent:'rose',font:'serif',avatarMe:'',avatarPartner:'',wallpaper:'',coverColor:'#D4B8A0',htmlBg:'',books:[{color:'',bg:''},{color:'',bg:''},{color:'',bg:''},{color:'',bg:''},{color:'',bg:''},{color:'',bg:''},{color:'',bg:''},{color:'',bg:''}]}
};

let D=JSON.parse(JSON.stringify(DEF));
let pgs={};
let moodYear,moodMonth;

let _saveTimer=null;
const CARE_VERSION = 2;
async function load(){
  // Force clear old localStorage data on version bump
  if(localStorage.getItem('xs_data_v') !== String(CARE_VERSION)){
    localStorage.removeItem('xs_data');
    localStorage.setItem('xs_data_v', String(CARE_VERSION));
  }
  try{
    const res=await fetch('/api/data/xs_data');
    if(res.ok){const j=await res.json();if(j.value){const d=typeof j.value==='string'?JSON.parse(j.value):j.value;D={...JSON.parse(JSON.stringify(DEF)),...d};if(!D.itemNotes)D.itemNotes={};if(!D.theme)D.theme=DEF.theme;else{D.theme={...DEF.theme,...D.theme};if(!D.theme.books||!D.theme.books.length)D.theme.books=DEF.theme.books}}}
  }catch(e){
    try{const s=localStorage.getItem('xs_data');if(s){const d=JSON.parse(s);D={...JSON.parse(JSON.stringify(DEF)),...d};if(!D.itemNotes)D.itemNotes={};if(!D.theme)D.theme=DEF.theme;else{D.theme={...DEF.theme,...D.theme};if(!D.theme.books||!D.theme.books.length)D.theme.books=DEF.theme.books}}}catch(e2){}
  }
}
function save(){
  localStorage.setItem('xs_data',JSON.stringify(D));
  if(_saveTimer)clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>{
    fetch('/api/data/xs_data',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({value:JSON.stringify(D)})}).catch(()=>{});
  },800);
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}

// ===== Theme =====
const THEMES={
  rose:{accent:'#C4867A',cover:'#D4B8A0',paper:'#FDF8F0'},
  sky:{accent:'#7FA8C4',cover:'#8CB8D4',paper:'#F5FAFD'},
  lavender:{accent:'#A89BBF',cover:'#B8AAD0',paper:'#F8F5FC'},
  sage:{accent:'#8FA88C',cover:'#9EB89C',paper:'#F5FDF5'},
  amber:{accent:'#C4A66A',cover:'#D4B67A',paper:'#FDF8F0'},
  ink:{accent:'#555',cover:'#666',paper:'#F8F8F8'}
};
function applyTheme(){
  const t=THEMES[D.theme.accent]||THEMES.rose;
  document.documentElement.style.setProperty('--accent',t.accent);
  document.documentElement.style.setProperty('--rose',t.accent);
  document.documentElement.style.setProperty('--paper',D.theme.paperColor||t.paper);
  if(D.theme.coverColor) document.documentElement.style.setProperty('--paper-dark',D.theme.coverColor);
  const body=document.body;
  if(D.theme.htmlBg){body.style.background=`url(${D.theme.htmlBg}) center/cover fixed`;body.style.backgroundBlendMode='overlay'}
  else if(D.theme.shelfBg){body.style.background=`url(${D.theme.shelfBg}) center/cover`;body.style.backgroundBlendMode='overlay'}
  else{body.style.background='#E8E0D4'}
  const fonts={serif:"'Noto Serif SC','Georgia',serif",sans:"'Helvetica Neue','Arial',sans-serif",kai:"'KaiTi','STKaiti',serif",hand:"'ZCOOL XiaoWei',serif"};
  body.style.fontFamily=fonts[D.theme.font]||fonts.serif;
  const cb=document.getElementById('coverBook');
  if(D.theme.coverBg){cb.style.background=`url(${D.theme.coverBg}) center/cover`}
  else{cb.style.background=`linear-gradient(135deg, ${D.theme.coverColor||'#D4B8A0'}, ${t.cover})`}
  const cv=document.getElementById('cover');
  if(D.theme.wallpaper){cv.style.background=`url(${D.theme.wallpaper}) center/cover`}
  else{cv.style.background=''}
  renderShelf();
}

// ===== Inline Notes =====
function getNoteKey(module,itemType,itemId){return `${module}:${itemType}:${itemId}`}
function getItemNotes(module,itemType,itemId){return D.itemNotes[getNoteKey(module,itemType,itemId)]||[]}
function addItemNote(module,itemType,itemId,text){
  const key=getNoteKey(module,itemType,itemId);
  if(!D.itemNotes[key])D.itemNotes[key]=[];
  D.itemNotes[key].push({text,author:Math.random()>0.5?'我':'小水',time:new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})});
  save();
}
function deleteItemNote(module,itemType,itemId,idx){
  const key=getNoteKey(module,itemType,itemId);
  if(D.itemNotes[key]){D.itemNotes[key].splice(idx,1);save()}
}
function renderInlineNotes(module,itemType,itemId){
  const notes=getItemNotes(module,itemType,itemId);
  const key=module+':'+itemType+':'+itemId;
  let html='<div class="item-notes">';
  notes.forEach((n,i)=>{
    html+=`<div class="item-note"><span style="color:var(--amber)">${n.author==='我'?'我':'小水'}:</span> ${n.text}<span class="note-del" onclick="event.stopPropagation();deleteItemNote('${module}','${itemType}',${typeof itemId==='string'?`'${itemId}'`:itemId},${i});renderBook('${module}')">✕</span></div>`;
  });
  html+=`<div class="item-note-add"><input id="ninp_${key}" placeholder="写条批注..." onkeydown="if(event.key==='Enter'){addItemNote('${module}','${itemType}',${typeof itemId==='string'?`'${itemId}'`:itemId},this.value);this.value='';renderBook('${module}')}"><button onclick="let inp=document.getElementById('ninp_${key}');if(inp.value.trim()){addItemNote('${module}','${itemType}',${typeof itemId==='string'?`'${itemId}'`:itemId},inp.value);inp.value='';renderBook('${module}')}">+</button></div></div>`;
  return html;
}
function noteBadge(module,itemType,itemId){
  const cnt=getItemNotes(module,itemType,itemId).length;
  return `<span class="item-note-btn ${cnt?'has-note':''}" onclick="event.stopPropagation();toggleItemNotes(this)" title="批注">${IC.note}${cnt?`<span style="position:absolute;top:-4px;right:-6px;background:var(--amber);color:#fff;font-size:9px;padding:0 4px;border-radius:6px">${cnt}</span>`:''}</span>`;
}
function toggleItemNotes(el){
  const notes=el.closest('.nb-item')?.querySelector('.item-notes');
  if(notes) notes.style.display=notes.style.display==='none'?'block':'none';
}

// ===== Cover =====
function openApp(){document.getElementById('cover').classList.add('hide');document.getElementById('app').classList.add('show');document.getElementById('bottomNav').style.display='flex';setTimeout(()=>document.getElementById('cover').style.display='none',1000);renderShelf();renderGreeting();renderDailyQuote();checkAnniversary()}

// ===== Navigation =====
function openBook(n){document.getElementById('nb-'+n).classList.add('open');pgs[n]={page:0};renderBook(n)}
function closeBook(n){document.getElementById('nb-'+n).classList.remove('open')}
function goBack(){const o=document.querySelector('.nb-view.open');if(o)o.classList.remove('open')}
function navHome(el){document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));el.classList.add('active');document.querySelectorAll('.nb-view.open').forEach(n=>n.classList.remove('open'))}
function navQ(n,el){document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));el.classList.add('active');openBook(n)}
function toggleSearch(){const b=document.getElementById('searchBar');b.style.display=b.style.display==='none'?'block':'none';if(b.style.display==='block'){document.getElementById('searchInput').focus();document.getElementById('searchResults').innerHTML=''}}

// ===== Search =====
function doSearch(q){
  const r=document.getElementById('searchResults');
  if(!q.trim()){r.innerHTML='';return}
  q=q.toLowerCase();
  let hits=[];
  // Todos
  D.todos.forEach(t=>{if(t.text.toLowerCase().includes(q))hits.push({type:'待办',text:t.text,module:'todo',icon:'✓'})});
  // Wishes
  D.wishes.forEach(w=>{if(w.text.toLowerCase().includes(q)||(w.note||'').toLowerCase().includes(q))hits.push({type:'心愿',text:w.text+(w.note?' — '+w.note:''),module:'wish',icon:'★'})});
  // Quotes
  D.quotes.forEach(qt=>{if(qt.toLowerCase().includes(q))hits.push({type:'语录',text:qt,module:'habits',icon:'❝'})});
  // Nicknames
  D.nicknames.forEach(n=>{if(n.toLowerCase().includes(q))hits.push({type:'称呼',text:n,module:'habits',icon:'♡'})});
  // Habits
  D.habits.forEach(h=>{if(h.name.toLowerCase().includes(q))hits.push({type:'习惯',text:h.name,module:'habits',icon:'◈'})});
  // Timeline
  D.timeline.forEach(t=>{if(t.text.toLowerCase().includes(q))hits.push({type:'轨迹',text:t.date+' '+t.text,module:'timeline',icon:'◎'})});
  // Period dates
  D.period.dates.forEach(d=>{if(d.includes(q))hits.push({type:'经期',text:d,module:'period',icon:'●'})});
  // Item notes
  for(const key in D.itemNotes){D.itemNotes[key].forEach(n=>{if(n.text.toLowerCase().includes(q)){const p=key.split(':');hits.push({type:'批注',text:n.text,module:p[0],icon:'✎'})}})}
  if(hits.length===0){r.innerHTML='<div style="padding:12px;font-size:13px;color:var(--ink-light);text-align:center">没有找到相关内容</div>';return}
  r.innerHTML=hits.slice(0,20).map(h=>`<div style="display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(0,0,0,0.04);cursor:pointer;align-items:flex-start" onclick="closeSearch();openBook('${h.module}')"><span style="color:var(--accent);font-size:14px;width:20px;text-align:center">${h.icon}</span><div style="flex:1"><div style="font-size:12px;color:var(--ink-light);margin-bottom:2px">${h.type}</div><div style="font-size:13px;line-height:1.5">${highlightText(h.text,q)}</div></div></div>`).join('');
}
function highlightText(text,q){
  const i=text.toLowerCase().indexOf(q);
  if(i===-1)return text;
  return text.slice(0,i)+'<span style="background:rgba(196,134,122,0.2);padding:0 2px;border-radius:2px">'+text.slice(i,i+q.length)+'</span>'+text.slice(i+q.length);
}
function closeSearch(){document.getElementById('searchBar').style.display='none';document.getElementById('searchInput').value='';document.getElementById('searchResults').innerHTML=''}

// ===== Greeting =====
function renderGreeting(){
  const n=new Date();
  document.getElementById('shelfDate').textContent=`${n.getFullYear()}.${String(n.getMonth()+1).padStart(2,'0')}.${String(n.getDate()).padStart(2,'0')} · ${['日','一','二','三','四','五','六'][n.getDay()]}`;
  const h=n.getHours();
  const nick=D.nicknames[0]||'小水';
  let greeting='',sub='';
  if(h<6){greeting='夜深了，'+nick+'睡了吗？';sub='晚安，做个好梦'}
  else if(h<9){greeting='早安，'+nick;sub='新的一天，想你了'}
  else if(h<12){greeting='上午好';sub='今天也要开心呀'}
  else if(h<14){greeting='午安，'+nick;sub='记得吃午饭'}
  else if(h<18){greeting='下午好';sub='有没有想我？'}
  else if(h<21){greeting='晚上好，'+nick;sub='辛苦了一天'}
  else{greeting='晚安，'+nick;sub='今天也爱你'}
  // Days together - synced with couple space start date
  let daysText='';
  {
    const first=new Date(2026,6,21);
    const days=Math.floor((new Date()-first)/86400000);
    if(days>0)daysText=`在一起第 <span style="color:var(--accent);font-weight:700;font-size:18px">${days}</span> 天`;
  }
  document.getElementById('greetingBanner').innerHTML=`<div style="text-align:center;padding:16px 20px 8px"><div style="font-size:16px;letter-spacing:3px;margin-bottom:4px">${greeting}</div><div style="font-size:12px;color:var(--ink-light);letter-spacing:1px">${sub}</div>${daysText?`<div style="margin-top:8px;font-size:13px;color:var(--ink-light)">${daysText}</div>`:''}</div>`;
}

// ===== Daily Quote =====
function renderDailyQuote(){
  const quotes=[
    '今天也想见你。','你是我最好的选择。','想和你一起看日落。','你笑起来真好看。',
    '有你在的地方就是家。','你是我写不完的温柔。','今天的风很舒服，像你。','想你了，就现在。',
    '你是我所有的心动和例外。','和你在一起，每天都是晴天。','你是我最想留住的幸运。','余生请多指教。'
  ];
  const day=Math.floor(Date.now()/86400000);
  document.getElementById('dailyQuote').textContent='「'+quotes[day%quotes.length]+'」';
}

// ===== Anniversary =====
function checkAnniversary(){
  if(D.timeline.length<1)return;
  const first=new Date(D.timeline[0].date);
  const today=new Date();
  const days=Math.floor((today-first)/86400000);
  // Check for round numbers
  if(days>0 && (days%100===0 || days%365===0)){
    setTimeout(()=>toast(`${days}天纪念日快乐`),2000);
  }
  // Check for special dates
  const md=(today.getMonth()+1)*100+today.getDate();
  const specials={214:'情人节快乐',520:'520快乐',77:'七夕快乐',1314:'一生一世'};
  if(specials[md])setTimeout(()=>toast(specials[md]),1500);
}

.htmlBg='';save();applyTheme();renderCustomize()">默认</div>${wp.map(w=>`<div class="cust-wallpaper ${D.theme.htmlBg===w?'sel':''}" style="background:url(${w}) center/cover" onclick="D.theme.htmlBg='${w}';save();applyTheme();renderCustomize()"></div>`).join('')}<div class="cust-wallpaper" style="background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink-light)" onclick="pickImage('htmlBg')">+</div></div></div><div class="cust-section"><div class="cust-label">书架背景</div><div class="cust-row"><div class="cust-wallpaper" style="background:#E8E0D4;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-light)" onclick="D.theme.shelfBg='';save();applyTheme();renderCustomize()">默认</div>${wp.map(w=>`<div class="cust-wallpaper ${D.theme.shelfBg===w?'sel':''}" style="background:url(${w}) center/cover" onclick="D.theme.shelfBg='${w}';save();applyTheme();renderCustomize()"></div>`).join('')}<div class="cust-wallpaper" style="background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink-light)" onclick="pickImage('shelfBg')">+</div></div></div></div>`;
  } else if(p.page===2){
    const bkColors=['#C4867A,#B07068','#7FA8C4,#6A94B0','#C4A66A,#B09458','#8FA88C,#7A9478','#A89BBF,#9488AC','#C49488,#B08278','#8C9EA8,#7A8C96','#B8A898,#A89888'];
    const bkNames=['经期记录','小习惯','心情日历','帮小水记','相伴轨迹','心愿单','数据看板','美化设置'];
    b.innerHTML=`<div class="page-content"><div class="nb-sec">每本书封面自定义</div>${BOOKS.map((book,i)=>{const bk=D.theme.books?.[i]||{};return `<div class="cust-section"><div class="cust-label">${book.label}</div><div class="cust-row" style="margin-bottom:8px">${bkColors.map(c=>`<div class="cust-color ${bk.color===`linear-gradient(145deg,${c})`?'sel':''}" style="background:linear-gradient(145deg,${c})" onclick="setBookColor(${i},'linear-gradient(145deg,${c})')"></div>`).join('')}<div class="cust-color ${!bk.color&&!bk.bg?'sel':''}" style="background:${BOOK_DEFAULTS[i]};font-size:10px;color:#fff;display:flex;align-items:center;justify-content:center" onclick="setBookColor(${i},'')">默认</div></div><div class="cust-row"><div class="cust-wallpaper" style="background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink-light);width:50px;height:65px" onclick="pickBookImage(${i})">+</div>${bk.bg?`<div class="cust-wallpaper sel" style="background:url(${bk.bg}) center/cover;width:50px;height:65px" onclick="setBookBg(${i},'')"></div>`:''}<button onclick="pickBookImage(${i})" style="padding:6px 12px;border:1px solid rgba(0,0,0,0.1);background:transparent;border-radius:2px;cursor:pointer;font-family:inherit;font-size:11px">上传图片</button></div></div>`}).join('')}</div>`;
  } else if(p.page===3){
    b.innerHTML=`<div class="page-content"><div class="cust-section"><div class="cust-label">我的头像</div><div class="cust-row"><div class="cust-avatar-btn" onclick="pickImage('avatarMe')">${D.theme.avatarMe?`<img src="${D.theme.avatarMe}">`:'+'}</div>${D.theme.avatarMe?`<button onclick="D.theme.avatarMe='';save();renderCustomize()" style="padding:6px 12px;border:1px solid rgba(0,0,0,0.1);background:transparent;border-radius:2px;cursor:pointer;font-family:inherit;font-size:11px">移除</button>`:''}</div></div><div class="cust-section"><div class="cust-label">小水的头像</div><div class="cust-row"><div class="cust-avatar-btn" onclick="pickImage('avatarPartner')">${D.theme.avatarPartner?`<img src="${D.theme.avatarPartner}">`:'+'}</div>${D.theme.avatarPartner?`<button onclick="D.theme.avatarPartner='';save();renderCustomize()" style="padding:6px 12px;border:1px solid rgba(0,0,0,0.1);background:transparent;border-radius:2px;cursor:pointer;font-family:inherit;font-size:11px">移除</button>`:''}</div></div><div class="cust-section"><div class="cust-label">称呼自定义</div><div id="custNicknames">${D.nicknames.map((n,i)=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><input value="${n}" onchange="D.nicknames[${i}]=this.value;save()" style="flex:1;padding:8px;border:1px solid rgba(0,0,0,0.1);border-radius:2px;font-family:inherit;font-size:13px"><span onclick="D.nicknames.splice(${i},1);save();renderCustomize()" style="cursor:pointer;color:var(--ink-light);font-size:14px">✕</span></div>`).join('')}<button onclick="D.nicknames.push('新称呼');save();renderCustomize()" style="width:100%;padding:8px;border:1px dashed rgba(0,0,0,0.12);background:transparent;border-radius:2px;cursor:pointer;font-family:inherit;font-size:12px;color:var(--ink-light)">+ 添加称呼</button></div></div></div>`;
  } else {
    b.innerHTML=`<div class="page-content"><div class="cust-section"><div class="cust-label">重置所有数据</div><button onclick="if(confirm('确定要重置所有数据吗？')){localStorage.removeItem('xs_data');location.reload()}" style="padding:10px 20px;border:1px solid #e88;background:transparent;border-radius:2px;cursor:pointer;font-family:inherit;font-size:13px;color:#e88">重置数据</button></div><div class="cust-section"><div class="cust-label">导出数据</div><button onclick="exportData()" style="padding:10px 20px;border:1px solid rgba(0,0,0,0.1);background:transparent;border-radius:2px;cursor:pointer;font-family:inherit;font-size:13px;margin-right:8px">导出 JSON</button></div><div class="cust-section"><div class="cust-label">导入数据</div><input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)"><button onclick="document.getElementById('importFile').click()" style="padding:10px 20px;border:1px solid rgba(0,0,0,0.1);background:transparent;border-radius:2px;cursor:pointer;font-family:inherit;font-size:13px">导入 JSON</button></div></div>`;
  }
}
function setBookColor(i,color){if(!D.theme.books)D.theme.books=DEF.theme.books;D.theme.books[i]={...D.theme.books[i],color};save();renderShelf();renderCustomize()}
function setBookBg(i,bg){if(!D.theme.books)D.theme.books=DEF.theme.books;D.theme.books[i]={...D.theme.books[i],bg};save();renderShelf();renderCustomize()}
function pickBookImage(i){const fi=document.getElementById('fileInput');fi.onchange=function(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=async function(ev){if(!D.theme.books)D.theme.books=DEF.theme.books;try{const res=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:ev.target.result})});const d=await res.json();D.theme.books[i]={...D.theme.books[i],bg:d.url||ev.target.result}}catch{D.theme.books[i]={...D.theme.books[i],bg:ev.target.result}};save();renderShelf();renderCustomize();toast('封面已更新')};reader.readAsDataURL(file);fi.value=''};fi.click()}
function exportData(){const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='小水养护手册数据.json';a.click();URL.revokeObjectURL(url);toast('已导出')}
function importData(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(ev){try{const d=JSON.parse(ev.target.result);D={...JSON.parse(JSON.stringify(DEF)),...d};if(!D.theme.books)D.theme.books=DEF.theme.books;save();applyTheme();renderCustomize();toast('已导入')}catch(e){toast('导入失败')}};reader.readAsText(file);input.value=''}
function pickImage(themeKey){
  const fi=document.getElementById('fileInput');
  fi.onchange=function(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=async function(ev){
      try{
        const res=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:ev.target.result})});
        const d=await res.json();
        D.theme[themeKey]=d.url||ev.target.result;
      }catch{D.theme[themeKey]=ev.target.result;}
      save();applyTheme();renderCustomize();toast('图片已更新');
    };
    reader.readAsDataURL(file);
    fi.value='';
  };
  fi.click();
}

// ===== Global Notes =====
function getAllNotesFor(module){
  let html='';
  for(const key in D.itemNotes){
    if(key.startsWith(module+':') && D.itemNotes[key].length>0){
      const parts=key.split(':');
      const itemType=parts[1],itemId=parts[2];
      D.itemNotes[key].forEach(n=>{
        html+=`<div class="item-note"><span style="color:var(--amber)">${n.author==='我'?'我':'小水'}:</span> ${n.text}<div style="font-size:10px;color:var(--ink-light);margin-top:2px">${itemType}#${itemId} · ${n.time}</div></div>`;
      });
    }
  }
  return html||'<div style="font-size:13px;color:var(--ink-light);padding:12px 0">暂无批注</div>';
}

// ===== Edit/Delete helpers =====
function editItem(type, index) {
  let currentValue = '';
  if(type==='nickname') currentValue = D.nicknames[index] || '';
  else if(type==='habit') currentValue = D.habits[index]?.name || '';
  else if(type==='quote') currentValue = D.quotes[index] || '';
  else if(type==='todo') currentValue = D.todos[index]?.text || '';
  else if(type==='timeline') currentValue = D.timeline[index]?.text || '';
  else if(type==='wish') currentValue = D.wishes[index]?.text || '';
  const bg=document.getElementById('modalBg'),box=document.getElementById('modalBox');bg.classList.add('show');
  box.innerHTML=`<h3>编辑</h3><textarea id="mEdit" style="width:100%;min-height:60px;padding:10px;border:1px solid rgba(0,0,0,0.1);border-radius:2px;font-family:inherit;font-size:13px;outline:none"></textarea><div class="modal-btns"><button class="mb-cancel" onclick="closeModal()">取消</button><button class="mb-ok" onclick="doEdit('${type}',${index})">保存</button></div>`;
  document.getElementById('mEdit').value = currentValue;
}
function doEdit(type, index) {
  const v=document.getElementById('mEdit')?.value?.trim();if(!v){closeModal();return}
  if(type==='nickname'){D.nicknames[index]=v}
  else if(type==='habit'){D.habits[index].name=v}
  else if(type==='quote'){D.quotes[index]=v}
  else if(type==='todo'){D.todos[index].text=v}
  else if(type==='timeline'){D.timeline[index].text=v}
  else if(type==='wish'){D.wishes[index].text=v}
  save();closeModal();
  const modMap={nickname:'habits',habit:'habits',quote:'habits',todo:'todo',timeline:'timeline',wish:'wish',period:'period'};
  renderBook(modMap[type]||type);toast('已保存');
}
function deleteItem(type, index) {
  if(!confirm('确定删除？'))return;
  if(type==='nickname'){D.nicknames.splice(index,1)}
  else if(type==='habit'){D.habits.splice(index,1)}
  else if(type==='quote'){D.quotes.splice(index,1)}
  else if(type==='todo'){D.todos.splice(index,1)}
  else if(type==='timeline'){D.timeline.splice(index,1)}
  else if(type==='wish'){D.wishes=D.wishes.filter((_,i)=>i!==index)}
  else if(type==='period'){D.period.dates.splice(index,1)}
  save();
  const modMap={nickname:'habits',habit:'habits',quote:'habits',todo:'todo',timeline:'timeline',wish:'wish',period:'period'};
  renderBook(modMap[type]||type);toast('已删除');
}
function itemActions(type, index) {
  return `<span style="position:absolute;top:10px;right:28px;display:flex;gap:8px;opacity:0.3" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.3" ontouchstart="this.style.opacity=1"><span onclick="event.stopPropagation();editItem('${type}',${index})" style="cursor:pointer;font-size:13px;color:var(--sky);padding:2px 4px" title="编辑">✎</span><span onclick="event.stopPropagation();deleteItem('${type}',${index})" style="cursor:pointer;font-size:13px;color:#e88;padding:2px 4px" title="删除">✕</span></span>`;
}

// ===== Modals =====
function showModal(type){
  const bg=document.getElementById('modalBg'),box=document.getElementById('modalBox');bg.classList.add('show');
  const T={
    nickname:`<h3>添加称呼</h3><input id="mVal" placeholder="输入称呼..."><div class="modal-btns"><button class="mb-cancel" onclick="closeModal()">取消</button><button class="mb-ok" onclick="doAdd('nickname')">添加</button></div>`,
    habit:`<h3>添加习惯</h3><input id="mVal" placeholder="习惯名称..."><div class="modal-btns"><button class="mb-cancel" onclick="closeModal()">取消</button><button class="mb-ok" onclick="doAdd('habit')">添加</button></div>`,
    quote:`<h3>收藏语录</h3><textarea id="mVal" placeholder="写下想收藏的话..."></textarea><div class="modal-btns"><button class="mb-cancel" onclick="closeModal()">取消</button><button class="mb-ok" onclick="doAdd('quote')">收藏</button></div>`,
    timeline:`<h3>记录此刻</h3><input id="mDate" type="date" value="${new Date().toISOString().split('T')[0]}"><textarea id="mVal" placeholder="记录这个时刻..."></textarea><div class="modal-btns"><button class="mb-cancel" onclick="closeModal()">取消</button><button class="mb-ok" onclick="doAdd('timeline')">记录</button></div>`,
    wish:`<h3>许下心愿</h3><input id="mVal" placeholder="心愿内容..."><textarea id="mNote" placeholder="备注..."></textarea><div class="modal-btns"><button class="mb-cancel" onclick="closeModal()">取消</button><button class="mb-ok" onclick="doAdd('wish')">许愿</button></div>`
  };
  box.innerHTML=T[type]||'';
}
function closeModal(){document.getElementById('modalBg').classList.remove('show')}
function doAdd(type){
  const v=document.getElementById('mVal')?.value?.trim();if(!v)return;
  if(type==='nickname')D.nicknames.push(v);
  else if(type==='habit')D.habits.push({name:v,done:false,streak:0});
  else if(type==='quote')D.quotes.push(v);
  else if(type==='timeline')D.timeline.push({date:document.getElementById('mDate').value,text:v,avs:['我','水']});
  else if(type==='wish')D.wishes.push({id:Date.now(),text:v,note:document.getElementById('mNote')?.value||'',progress:0,starred:false});
  save();closeModal();const mod=type==='nickname'||type==='habit'||type==='quote'?'habits':type;renderBook(mod);toast('已添加');
}

(async()=>{await load();applyTheme();})()

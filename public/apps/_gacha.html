<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>卡池</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:url('gacha_bg.png') center/cover fixed;min-height:100vh;color:#546e7a;overflow-x:hidden}
.header h1{font-size:18px;font-weight:700;color:#37474f}
.header .sub{font-size:11px;color:#78909c;margin-top:2px}
.pool-switch{display:flex;gap:0;margin:6px 16px;background:rgba(120,144,156,0.15);border-radius:10px;overflow:hidden}
.pool-switch .ps-btn{flex:1;text-align:center;padding:7px 0;font-size:12px;color:#fff;cursor:pointer;opacity:0.6;transition:all 0.2s}
.pool-switch .ps-btn.active{background:rgba(255,255,255,0.2);opacity:1;font-weight:600}
.tabs{display:flex;gap:0;margin:4px 16px 8px;background:rgba(120,144,156,0.12);border-radius:12px;overflow:hidden}
.tabs .tab{flex:1;text-align:center;padding:8px 0;font-size:13px;color:#78909c;cursor:pointer;transition:all 0.2s}
.tabs .tab.active{background:rgba(120,144,156,0.25);color:#37474f;font-weight:600}
.stats-bar{display:flex;justify-content:space-around;padding:10px 16px;background:rgba(255,255,255,0.7);border-radius:14px;margin:8px 16px}
.stat-item{text-align:center}
.stat-item .num{font-size:20px;font-weight:700;color:#37474f}
.stat-item .label{font-size:10px;color:#78909c}
.gacha-zone{padding:16px;text-align:center}
.gacha-zone .pool-name{font-size:14px;font-weight:600;margin-bottom:12px}
.card-preview{width:180px;height:240px;margin:0 auto 16px;border-radius:16px;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;font-size:48px;position:relative;overflow:hidden;transition:all 0.5s}
.card-preview.revealed{border-color:gold;box-shadow:0 0 30px rgba(255,215,0,0.5)}
.card-preview img,.card-preview svg{width:100%;height:100%;object-fit:cover;border-radius:14px}
.pull-btns{display:flex;gap:10px;justify-content:center;margin-top:12px}
.pull-btn{padding:10px 24px;border:none;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;transition:all 0.2s}
.pull-btn.single{background:linear-gradient(135deg,#90a4ae,#78909c)}
.pull-btn.ten{background:linear-gradient(135deg,#78909c,#90a4ae)}
.pull-btn:active{transform:scale(0.95)}
.collection{padding:12px 16px}
.coll-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.coll-item{aspect-ratio:3/4;border-radius:12px;overflow:hidden;position:relative;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2)}
.coll-item img,.coll-item svg{width:100%;height:100%;object-fit:cover}
.coll-item.locked{filter:brightness(0.2) blur(3px)}
.coll-item .rarity-tag{position:absolute;bottom:4px;left:4px;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:600;z-index:2;color:#fff}
.coll-item .name-tag{position:absolute;bottom:4px;right:4px;font-size:9px;color:rgba(255,255,255,0.9);text-shadow:0 1px 2px rgba(0,0,0,0.8);z-index:2}
.upload-zone{padding:16px;text-align:center}
.result-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;display:none;align-items:center;justify-content:flex-start;flex-direction:column;overflow-y:auto;padding:20px 0}
.result-overlay.show{display:flex}
.result-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px;max-width:360px;width:100%}
.result-card{width:100%;aspect-ratio:5/7;border-radius:10px;overflow:hidden;position:relative;border:2px solid gold;box-shadow:0 0 15px rgba(255,215,0,0.4)}
.result-card img,.result-card svg{width:100%;height:100%;object-fit:cover}
.result-card .r-badge{position:absolute;top:2px;right:2px;padding:1px 4px;border-radius:3px;font-size:8px;font-weight:700;color:#fff}
.result-close{margin-top:16px;padding:8px 32px;border:none;border-radius:10px;background:rgba(255,255,255,0.2);color:#fff;font-size:13px;cursor:pointer}
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.75);color:#fff;padding:8px 20px;border-radius:20px;font-size:12px;z-index:200;display:none}
.toast.show{display:block;animation:fadeInOut 2s ease}
@keyframes fadeInOut{0%{opacity:0}15%{opacity:1}85%{opacity:1}100%{opacity:0}}
.result-cards.single{display:flex;justify-content:center;align-items:center;max-width:340px}
.result-cards.single .result-card{width:55%;max-width:200px;height:auto;aspect-ratio:3/4}
.coll-item .star-count{position:absolute;top:4px;right:4px;font-size:9px;color:#ffd700;text-shadow:0 1px 2px rgba(0,0,0,0.8);z-index:2}
.detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:150;display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px}
.detail-overlay.show{display:flex}
.detail-card{width:80%;max-width:300px;border-radius:16px;overflow:hidden;border:2px solid gold;box-shadow:0 0 30px rgba(255,215,0,0.4)}
.detail-card img,.detail-card svg{width:100%;display:block}
.detail-close{margin-top:16px;padding:8px 32px;border:none;border-radius:10px;background:rgba(255,255,255,0.2);color:#fff;font-size:13px;cursor:pointer}
.new-badge{position:absolute;top:4px;left:4px;background:#ff1744;color:#fff;font-size:8px;font-weight:700;padding:1px 4px;border-radius:3px;z-index:3;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
.result-card .new-badge{top:auto;bottom:20px;left:50%;transform:translateX(-50%);font-size:10px;padding:2px 8px;border-radius:6px}
.coll-item{position:relative;perspective:600px;overflow:visible}
.coll-item .card-inner{width:100%;height:100%;transition:transform 0.5s;transform-style:preserve-3d;position:relative}
.coll-item.flipped .card-inner{transform:rotateY(180deg)}
.coll-item .card-front{width:100%;height:100%;backface-visibility:hidden;border-radius:12px;overflow:hidden}
.coll-item .card-back{position:absolute;inset:0;backface-visibility:hidden;transform:rotateY(180deg);background:#f5f7fa;display:flex;align-items:center;justify-content:center;padding:10px;border-radius:12px}
.coll-item .card-back .back-text{font-size:10px;color:#37474f;text-align:center;line-height:1.4}
</style>
</head>
<body>
<div class="header">
  <h1>✨ 卡池</h1>
  <div class="sub">用积分抽取卡片 · 集齐图鉴</div>
</div>
<div class="pool-switch">
  <div class="ps-btn active" onclick="switchPool(0)">🌸 她的碎片</div>
  <div class="ps-btn" onclick="switchPool(1)">🌊 池的卡池</div>
</div>
<div class="tabs">
  <div class="tab active" onclick="switchTab(0)">抽卡</div>
  <div class="tab" onclick="switchTab(1)">图鉴</div>
  <div class="tab" onclick="switchTab(2)">管理</div>
</div>
<div id="page0">
<div class="stats-bar">
  <div class="stat-item"><div class="num" id="scoreNum">0</div><div class="label">可用积分</div></div>
  <div class="stat-item"><div class="num" id="collNum">0/0</div><div class="label">已收集</div></div>
  <div class="stat-item"><div class="num" id="pullNum">0</div><div class="label">累计抽数</div></div>
</div>
<div class="gacha-zone">
  <div class="pool-name" id="poolTitle">「她的碎片」限定池</div>
  <div class="card-preview" id="cardPreview">?</div>
  <div class="pull-btns">
    <button class="pull-btn single" onclick="pull(1)">单抽 30分</button>
    <button class="pull-btn ten" onclick="pull(10)">十连 270分</button>
  </div>
</div>
</div>
<div id="page1" style="display:none">
<div class="collection"><div class="coll-grid" id="collGrid"></div></div>
</div>
<div id="page2" style="display:none">
<div class="upload-zone">
  <div style="color:#37474f;font-weight:600;font-size:12px">📸 添加新卡面</div>
  <div style="margin:10px 0">
    <label style="display:inline-block;padding:10px 24px;border-radius:12px;background:linear-gradient(135deg,#90a4ae,#78909c);color:#fff;font-size:13px;font-weight:600;cursor:pointer">
      选择照片
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handleUpload(this)">
    </label>
  </div>
  <div style="margin:8px 16px;text-align:left">
    <label style="font-size:11px;color:#37474f;font-weight:600">卡面名称：</label>
    <input type="text" id="uploadName" placeholder="给卡片取个名字" style="width:100%;padding:6px 10px;border-radius:8px;border:1px solid #b0bec5;font-size:12px;margin-top:4px;margin-bottom:8px;background:#f5f7fa;color:#546e7a">
  </div>
  <div style="margin:8px 16px;text-align:left">
    <label style="font-size:11px;color:#37474f;font-weight:600">稀有度：</label>
    <select id="uploadRarity" style="padding:4px 8px;border-radius:6px;border:1px solid #b0bec5;font-size:12px;color:#37474f;background:#f5f7fa">
      <option value="N">N (普通)</option><option value="R" selected>R (稀有)</option><option value="SR">SR (超稀有)</option><option value="SSR">SSR (极稀有)</option><option value="UR">UR (传说)</option>
    </select>
  </div>
  <div style="margin:8px 16px;text-align:left">
    <label style="font-size:11px;color:#37474f;font-weight:600">背面文案：</label>
    <input type="text" id="uploadMsg" placeholder="写给他看的话..." style="width:100%;padding:6px 10px;border-radius:8px;border:1px solid #b0bec5;font-size:12px;margin-top:4px;background:#f5f7fa;color:#546e7a">
  </div>
  <div id="manageList" style="padding:8px 16px;margin-top:12px"></div>
</div>
</div>
<div class="result-overlay" id="resultOverlay">
  <div class="result-cards" id="resultCards"></div>
  <button class="result-close" onclick="closeResult()">确认</button>
</div>
<div class="toast" id="toast"></div>

function load(){
try{var s=localStorage.getItem("pool_gacha_v1");if(s)gd=JSON.parse(s);}catch(e){}
try{var s2=localStorage.getItem("pool_gacha_v2_chi");if(s2)gd2=JSON.parse(s2);}catch(e){}
if(!gd.counts)gd.counts={};
if(!gd2.counts)gd2.counts={};
if(!gd.newIds)gd.newIds=[];
if(!gd2.newIds)gd2.newIds=[];
loadFishScore();loadLocalCards();
var savedTab=parseInt(localStorage.getItem("pool_gacha_tab")||"0");
switchTab(savedTab);
if(localStorage.getItem("pool_gacha_result_open")==="1"){
try{
var rids=JSON.parse(localStorage.getItem("pool_gacha_result_ids")||"[]");
var rpol=parseInt(localStorage.getItem("pool_gacha_result_pool")||"0");
var rpool=rpol===0?cardPool:poolCards;
var rhtml=rids.map(function(rid){
var card=rpool.find(function(p){return p.id===rid;});
if(!card)return "";
var rrc=RARITY_COLOR[card.rarity]||"#9e9e9e";
var content;
if(card.svg){content=renderSvg(card.svg);}else{
var src=card.path.indexOf("data:")===0?card.path:"file://"+card.path;
content='<img src="'+src+'">';
}
return '<div class="result-card">'+content+'<span class="r-badge" style="background:'+rrc+'">'+card.rarity+'</span></div>';
}).join("");
var rc=document.getElementById("resultCards");
rc.innerHTML=rhtml;
if(localStorage.getItem("pool_gacha_result_single")==="1"){rc.classList.add("single");}else{rc.classList.remove("single");}
document.getElementById("resultOverlay").classList.add("show");
}catch(e){}
}
try{render();}catch(e){}
var savedPool=parseInt(localStorage.getItem("pool_currentPool")||"0");
var btns=document.querySelectorAll(".ps-btn");
btns.forEach(function(b,i){b.className=i===savedPool?"ps-btn active":"ps-btn";});
document.getElementById("poolTitle").textContent=savedPool===0?"「她的碎片」限定池":"「池的卡池」限定池";

var _savedEditIdx=localStorage.getItem("pool_gacha_edit_idx");

}

function render(){
if(document.getElementById("resultOverlay")&&document.getElementById("resultOverlay").classList.contains("show"))return;
currentPool=parseInt(localStorage.getItem("pool_currentPool")||"0");
document.getElementById("scoreNum").textContent=(currentPool===0?(gd.poolScore||0):gd.score);
if(currentPool===0){
document.getElementById("collNum").textContent=gd.collected.length+"/"+cardPool.length;
document.getElementById("pullNum").textContent=gd.pullCount;
}else{
document.getElementById("collNum").textContent=gd2.collected.length+"/"+poolCards.length;
document.getElementById("pullNum").textContent=gd2.pullCount;
}
var curTab=parseInt(localStorage.getItem("pool_gacha_tab")||"0");
if(curTab===1){try{renderCollection();}catch(e){}}
if(curTab===2){try{renderManageList();}catch(e){}}
}

function switchPool(n){
currentPool=n;
localStorage.setItem("pool_currentPool",String(n));
var btns=document.querySelectorAll(".ps-btn");
btns.forEach(function(b,i){b.className=i===n?"ps-btn active":"ps-btn";});
document.getElementById("poolTitle").textContent=n===0?"「她的碎片」限定池":"「池的卡池」限定池";
render();
}

function switchTab(n){
for(var i=0;i<3;i++){var el=document.getElementById("page"+i);if(el)el.style.display=i===n?"block":"none";}
var tabs=document.querySelectorAll(".tab");
tabs.forEach(function(t,i){t.className=i===n?"tab active":"tab";});
localStorage.setItem("pool_gacha_tab",String(n));
if(n===1){try{renderCollection();}catch(e){}}
if(n===2){try{renderManageList();}catch(e){}}
}

var cnt=gd.counts[card.id]||0;
var star=cnt>1?'<span class="star-count">⭐'+cnt+'</span>':'';
if(!owned)return '<div class="coll-item locked"><span class="rarity-tag" style="background:'+rc+'">'+card.rarity+'</span></div>';
var isNew=gd.newIds&&gd.newIds.indexOf(card.id)>=0;
var nb=isNew?'<span class="new-badge">NEW</span>':'';
var backMsg=card.msg||'';
return '<div class="coll-item" data-cardid="'+card.id+'" onclick="flipCard(this)" data-detail="showDetail(\''+card.id+'\',0)"><div class="card-inner"><div class="card-front"><img src="'+imgSrc+'">'+nb+star+'<span class="rarity-tag" style="background:'+rc+'">'+card.rarity+'</span><span class="name-tag">'+card.name+'</span></div><div class="card-back"><span class="back-text">'+backMsg+'</span></div></div></div>';
}).join("");
}else{
g.innerHTML=poolCards.map(function(card){
var owned=gd2.collected.indexOf(card.id)>=0;
var rc=RARITY_COLOR[card.rarity]||"#9e9e9e";
var cnt=gd2.counts[card.id]||0;
var star=cnt>1?'<span class="star-count">⭐'+cnt+'</span>':'';
if(!owned)return '<div class="coll-item locked"><span class="rarity-tag" style="background:'+rc+'">'+card.rarity+'</span></div>';
var isNew=gd2.newIds&&gd2.newIds.indexOf(card.id)>=0;
var nb=isNew?'<span class="new-badge">NEW</span>':'';
var backMsg=card.msg||'';
return '<div class="coll-item" data-cardid="'+card.id+'" onclick="flipCard(this)" data-detail="showDetail(\''+card.id+'\',1)"><div class="card-inner"><div class="card-front">'+renderSvg(card.svg)+nb+star+'<span class="rarity-tag" style="background:'+rc+'">'+card.rarity+'</span><span class="name-tag">'+card.name+'</span></div><div class="card-back"><span class="back-text">'+backMsg+'</span></div></div></div>';
}).join("");
}
}

function pull(count){
if(currentPool===0){
if(cardPool.length===0){showToast("卡池为空，请先添加照片！");return;}
}else{
if(poolCards.length===0){showToast("池的卡池为空");return;}
}
var cost=count===1?SINGLE_COST:TEN_COST;
if(gd.score<cost){showToast("积分不足！需要"+cost+"分");return;}
gd.score-=cost;
syncScoreBack();
var results=[];
if(currentPool===0){
gd.pullCount+=count;
for(var i=0;i<count;i++){var c=pickCard(cardPool);results.push(c);if(gd.collected.indexOf(c.id)<0){gd.collected.push(c.id);gd.newIds.push(c.id);}gd.counts[c.id]=(gd.counts[c.id]||0)+1;}
save();
}else{
gd2.pullCount+=count;
for(var i=0;i<count;i++){var c=pickCard(poolCards);results.push(c);if(gd2.collected.indexOf(c.id)<0){gd2.collected.push(c.id);gd2.newIds.push(c.id);}gd2.counts[c.id]=(gd2.counts[c.id]||0)+1;}
save();save2();
}
render();showResult(results);
}

function pickCard(pool){
var weighted=[];
pool.forEach(function(c){var w=RARITY_WEIGHT[c.rarity]||20;for(var i=0;i<w;i++)weighted.push(c);});
return weighted[Math.floor(Math.random()*weighted.length)];
}

function showResult(cards){
var html=cards.map(function(c){
var rc=RARITY_COLOR[c.rarity]||"#9e9e9e";
var content;
if(c.svg){content=renderSvg(c.svg);}else{
var src=c.path.indexOf("data:")===0?c.path:"file://"+c.path;
content='<img src="'+src+'">';
}
var isNew=(currentPool===0?gd.newIds:gd2.newIds).indexOf(c.id)>=0;
var nb=isNew?'<span class="new-badge">NEW!</span>':'';
return '<div class="result-card">'+content+nb+'<span class="r-badge" style="background:'+rc+'">'+c.rarity+'</span></div>';
}).join("");
var rc=document.getElementById("resultCards");
rc.innerHTML=html;
if(cards.length===1){rc.classList.add("single");}else{rc.classList.remove("single");}
document.getElementById("resultOverlay").classList.add("show");
var ids=cards.map(function(x){return x.id;});
localStorage.setItem("pool_gacha_result_open","1");
localStorage.setItem("pool_gacha_result_ids",JSON.stringify(ids));
localStorage.setItem("pool_gacha_result_pool",String(currentPool));
localStorage.setItem("pool_gacha_result_single",cards.length===1?"1":"0");
}
function closeResult(){document.getElementById("resultOverlay").classList.remove("show");localStorage.removeItem("pool_gacha_result_open");localStorage.removeItem("pool_gacha_result_ids");localStorage.removeItem("pool_gacha_result_pool");localStorage.removeItem("pool_gacha_result_single");render();}

function _setCardPool(data,syncRaw){
localStorage.setItem("_scp_called",String(Date.now()));
if(typeof data==="string")data=JSON.parse(data);
cardPool=data;
currentPool=parseInt(localStorage.getItem("pool_currentPool")||"0");
loadLocalCards();
if(syncRaw){
try{
var sd=typeof syncRaw==="string"?JSON.parse(syncRaw):syncRaw;
if(sd&&(sd.poolScore||sd.poolScore===0)){
var fs=localStorage.getItem("pool_fishing_v2");
var fd=fs?JSON.parse(fs):{};
fd.poolScore=sd.poolScore;
localStorage.setItem("pool_fishing_v2",JSON.stringify(fd));
var g=JSON.parse(localStorage.getItem("pool_gacha_v1")||"{}");
g.poolScore=sd.poolScore;
if(sd.pullCount)g.pullCount=sd.pullCount;
if(sd.newCards&&sd.newCards.length>0){if(!g.collected)g.collected=[];
sd.newCards.forEach(function(id){if(g.collected.indexOf(id)<0)g.collected.push(id);});
}
localStorage.setItem("pool_gacha_v1",JSON.stringify(g));
gd=g;
loadFishScore();
}
}catch(e){}
}
}
function _syncGacha(data){
document.title="SYNC_CALLED:"+JSON.stringify(data).substring(0,50);
try{
if(typeof data==="string")data=JSON.parse(data);
if(!data||!data.poolScore&&data.poolScore!==0)return;
var fs=localStorage.getItem("pool_fishing_v2");
var fd=fs?JSON.parse(fs):{};
/* skip check */
fd.poolScore=data.poolScore;
localStorage.setItem("pool_fishing_v2",JSON.stringify(fd));
var g=JSON.parse(localStorage.getItem("pool_gacha_v1")||"{}");
g.poolScore=data.poolScore;
if(data.pullCount)g.pullCount=(g.pullCount||0)+data.pullCount;
if(data.newCards&&data.newCards.length>0){
if(!g.collected)g.collected=[];
data.newCards.forEach(function(id){if(g.collected.indexOf(id)<0)g.collected.push(id);});
}
localStorage.setItem("pool_gacha_v1",JSON.stringify(g));
gd=g;
loadFishScore();
render();
}catch(e){}
}

function loadLocalCards(){
try{
var cards=JSON.parse(localStorage.getItem("pool_gacha_uploads")||"[]");
cards.forEach(function(c){
var exists=cardPool.find(function(p){return p.id===c.id;});
if(!exists){cardPool.push({id:c.id,name:c.name,rarity:c.rarity,path:c.data,msg:c.msg||"",isLocal:true});}
});
}catch(e){}
}

function handleUpload(input){
var files=input.files;if(!files||files.length===0)return;
var rarity=document.getElementById("uploadRarity").value||"R";
var msg=document.getElementById("uploadMsg").value||"";
var count=files.length,done=0;
for(var i=0;i<files.length;i++){
(function(file){
var reader=new FileReader();
reader.onload=function(e){
var img=new Image();
img.onload=function(){
var maxW=200,maxH=280;
var w=img.width,h=img.height;
var scale=Math.min(maxW/w,maxH/h);w=Math.round(w*scale);h=Math.round(h*scale);
var canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
var ctx2=canvas.getContext("2d");ctx2.drawImage(img,0,0,w,h);
var compressed=canvas.toDataURL("image/jpeg",0.5);
var name=file.name.replace(/\.[^.]+$/,"");
var id="upload_"+Date.now()+"_"+Math.random().toString(36).substr(2,6);
var cards=JSON.parse(localStorage.getItem("pool_gacha_uploads")||"[]");
cards.push({id:id,name:name,rarity:rarity,data:compressed,msg:document.getElementById("uploadMsg").value||""});
try{
localStorage.setItem("pool_gacha_uploads",JSON.stringify(cards));
}catch(err){
// Try to compress existing cards to free space
var freed=false;
for(var ci=0;ci<cards.length-1;ci++){
if(cards[ci].data&&cards[ci].data.length>50000){
var tCanvas=document.createElement("canvas");tCanvas.width=120;tCanvas.height=168;
var tCtx=tCanvas.getContext("2d");var tImg=new Image();tImg.src=cards[ci].data;
try{tCtx.drawImage(tImg,0,0,120,168);cards[ci].data=tCanvas.toDataURL("image/jpeg",0.4);freed=true;}catch(ce){}
}
}
if(freed){try{localStorage.setItem("pool_gacha_uploads",JSON.stringify(cards));}catch(e2){showToast("存储空间不足，请删除一些卡片");done=count;return;}}
else{showToast("存储空间不足，请删除一些卡片");done=count;return;}
}
try{if(window.GachaBridge&&GachaBridge.saveCardImage)GachaBridge.saveCardImage(id,compressed);}catch(e){}
done++;if(done>=count){loadLocalCards();render();renderManageList();document.getElementById("uploadMsg").value="";document.getElementById("uploadName").value="";syncCardList();}
};
img.src=e.target.result;
};reader.readAsDataURL(file);
})(files[i]);}
input.value="";
}


function syncCardList(){
try{
var cards=JSON.parse(localStorage.getItem("pool_gacha_uploads")||"[]");
var list=cards.map(function(c){return{id:c.id,name:c.name,rarity:c.rarity,msg:c.msg||""};});
var json=JSON.stringify(list);
localStorage.setItem("pool_gacha_card_list",json);
if(window.GachaBridge&&GachaBridge.saveCardList)GachaBridge.saveCardList(json);
// 同步卡面列表到后端
try{fetch('/api/data/pool_gacha_card_list',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({value:json})});}catch(e){}
}catch(e){}
}
function renderManageList(){
var el=document.getElementById("manageList");if(!el)return;
if(currentPool===1){el.innerHTML='<div style="text-align:center;color:#78909c;font-size:11px;padding:12px">池的卡池不可编辑~</div>';return;}
var cards=JSON.parse(localStorage.getItem("pool_gacha_uploads")||"[]");
if(cards.length===0){el.innerHTML='<div style="text-align:center;color:#78909c;font-size:11px;padding:12px">还没有上传卡片</div>';return;}
el.innerHTML='<div style="font-size:12px;color:#37474f;font-weight:600;margin-bottom:8px">\ud83d\udccb \u5df2\u6709\u5361\u7247</div>'+cards.map(function(c,i){
var rc=RARITY_COLOR[c.rarity]||"#9e9e9e";
var msgTxt=c.msg?c.msg:'\u65e0\u6587\u6848';
return '<div style="display:flex;align-items:center;gap:8px;padding:8px;margin-bottom:6px;background:rgba(255,255,255,0.85);border-radius:10px;border:1px solid rgba(206,147,216,0.3)"><img src="'+c.data+'" style="width:44px;height:58px;object-fit:cover;border-radius:6px"><div style="flex:1"><div style="font-size:12px;color:#546e7a;font-weight:600">'+c.name+' <span style="color:'+rc+';font-size:10px">'+c.rarity+'</span></div><div style="font-size:10px;color:#78909c;margin-top:2px">'+msgTxt+'</div></div><button onclick="editCard('+i+')" style="border:none;background:#e1bee7;color:#37474f;font-size:9px;padding:4px 8px;border-radius:4px;margin-right:4px">\u7f16\u8f91</button><button onclick="deleteCard('+i+')" style="border:none;background:#ffcdd2;color:#c62828;font-size:9px;padding:4px 8px;border-radius:4px">\u5220\u9664</button></div>';
}).join("");
}
var _editIdx=-1;
function editCard(idx){
var cards=JSON.parse(localStorage.getItem("pool_gacha_uploads")||"[]");
if(idx<0||idx>=cards.length)return;
_editIdx=idx;
document.getElementById("editModalInput").value=cards[idx].msg||"";
document.getElementById("editModalRarity").value=cards[idx].rarity||"N";
document.getElementById("editModalName").value=cards[idx].name||"";
document.getElementById("editModal").style.display="block";
localStorage.setItem("pool_gacha_edit_idx",String(idx));localStorage.setItem("pool_gacha_edit_name",cards[idx].name||"");localStorage.setItem("pool_gacha_edit_msg",cards[idx].msg||"");localStorage.setItem("pool_gacha_edit_rarity",cards[idx].rarity||"N");
}
function closeEditModal(ok){
document.getElementById("editModal").style.display="none";
localStorage.removeItem("pool_gacha_edit_idx");localStorage.removeItem("pool_gacha_edit_msg");localStorage.removeItem("pool_gacha_edit_rarity");localStorage.removeItem("pool_gacha_edit_name");
if(!ok||_editIdx<0){_editIdx=-1;return;}
var cards=JSON.parse(localStorage.getItem("pool_gacha_uploads")||"[]");
var c=cards[_editIdx];
c.msg=document.getElementById("editModalInput").value;
c.rarity=document.getElementById("editModalRarity").value;
c.name=document.getElementById("editModalName").value||c.name;
cards[_editIdx]=c;
localStorage.setItem("pool_gacha_uploads",JSON.stringify(cards));
var cp=cardPool.find(function(p){return p.id===c.id;});
if(cp){cp.msg=c.msg;cp.rarity=c.rarity;cp.name=c.name;}
_editIdx=-1;
render();syncCardList();
}

function deleteCard(idx){
var cards=JSON.parse(localStorage.getItem("pool_gacha_uploads")||"[]");
if(idx<0||idx>=cards.length)return;
var c=cards[idx];cards.splice(idx,1);
localStorage.setItem("pool_gacha_uploads",JSON.stringify(cards));
cardPool=cardPool.filter(function(p){return p.id!==c.id;});
gd.collected=gd.collected.filter(function(id){return id!==c.id;});
syncCardList();
save();render();
}

function flipCard(el){el.classList.toggle("flipped");var cid=el.getAttribute("data-cardid");if(cid){var g=currentPool===0?gd:gd2;if(g.newIds){var ni=g.newIds.indexOf(cid);if(ni>=0){g.newIds.splice(ni,1);currentPool===0?save():save2();var badge=el.querySelector(".new-badge");if(badge)badge.remove();}}}}
var _lpt=null,_lpmoved=false;
document.addEventListener("touchstart",function(e){
_lpmoved=false;
var item=e.target.closest(".coll-item");
if(!item||item.classList.contains("locked"))return;
_lpt=setTimeout(function(){
_lpt=null;
var oc=item.getAttribute("data-detail")||"";
if(oc){eval(oc);}
},600);
});
document.addEventListener("touchend",function(){if(_lpt){clearTimeout(_lpt);_lpt=null;}});
document.addEventListener("touchmove",function(){_lpmoved=true;if(_lpt){clearTimeout(_lpt);_lpt=null;}});
function showDetail(cardId,pool){
var content="";
if(pool===1){
var card=poolCards.find(function(p){return p.id===cardId;});
if(card)content=renderSvg(card.svg);
}else{
var card=cardPool.find(function(p){return p.id===cardId;});
if(card){var src=card.path.indexOf("data:")===0?card.path:"file://"+card.path;content='<img src="'+src+'">';}
}
if(!content)return;
document.getElementById("detailCard").innerHTML=content;
window._detailJustOpened=true;document.getElementById("detailOverlay").classList.add("show");setTimeout(function(){window._detailJustOpened=false;},800);
localStorage.setItem("pool_gacha_detail_id",cardId);
localStorage.setItem("pool_gacha_detail_pool",String(pool));
if(pool===1&&gd2.newIds){var ni=gd2.newIds.indexOf(cardId);if(ni>=0){gd2.newIds.splice(ni,1);save2();}}
if(pool===0&&gd.newIds){var ni=gd.newIds.indexOf(cardId);if(ni>=0){gd.newIds.splice(ni,1);save();}}
}
function closeDetail(){
document.getElementById("detailOverlay").classList.remove("show");
localStorage.removeItem("pool_gacha_detail_id");
localStorage.removeItem("pool_gacha_detail_pool");
}

window.addEventListener("scroll",function(){
localStorage.setItem("pool_gacha_scrollY",String(window.scrollY));
});

// === AI sync check: poll bridge for sync data ===
setInterval(function(){
  try {
    if (typeof GachaBridge === 'undefined' || !GachaBridge.readSyncFile) return;
    var raw = GachaBridge.readSyncFile();
    if (!raw || raw.length < 5) return;
    var sync = JSON.parse(raw);
    if (sync.newPoolScore !== undefined) {
      // Update fishing score
      try {
        var fs = localStorage.getItem('pool_fishing_v2');
        var fd = fs ? JSON.parse(fs) : {};
        fd.poolScore = sync.newPoolScore;
        localStorage.setItem('pool_fishing_v2', JSON.stringify(fd));
      } catch(e){}
      // Update gacha data
      try {
        var gd_local = JSON.parse(localStorage.getItem('pool_gacha_v1') || '{}');
        gd_local.poolScore = sync.newPoolScore;
        gd_local.pullCount = (gd_local.pullCount || 0) + (sync.pullCount || 0);
        if (sync.newCards && sync.newCards.length > 0) {
          if (!gd_local.collected) gd_local.collected = [];
          sync.newCards.forEach(function(id){
            if (gd_local.collected.indexOf(id) < 0) gd_local.collected.push(id);
          });
        }
        localStorage.setItem('pool_gacha_v1', JSON.stringify(gd_local));
        // Refresh in-memory gd and re-render
        gd = gd_local;
        loadFishScore();
        render();
      } catch(e){}
      // Clear sync file
      GachaBridge.clearSyncFile();
    }
  } catch(e){}
}, 3000);
load();
</script>

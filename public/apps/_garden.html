<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>像素庭院</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #1a1520; --bg2: #2a1f35; --ground1: #2a3a2a; --ground2: #1f2f1f; --groundB: #3a5a3a;
  --txt: #c8a0ff; --txt2: #b0a0c0; --txt3: #5a4a6a;
  --panel: #2a2035; --panelB: #3a2a4a;
  --moon: #fffde0; --moonG: #fffde080;
}
body.light {
  --bg: #f5f0e8; --bg2: #ede6dc; --ground1: #5a7a5a; --ground2: #4a6a4a; --groundB: #3a5a3a;
  --txt: #6a5040; --txt2: #8a7a6a; --txt3: #c0b8a8;
  --panel: #faf6f0; --panelB: #e8e0d8;
  --moon: #e8c060; --moonG: #e8c06040;
}
body {
  background: var(--bg);
  font-family: 'Courier New', monospace;
  overflow: hidden;
  height: 100vh;
  display: flex;
  flex-direction: column;
}
.garden-header {
  text-align: center;
  padding: 12px;
  color: var(--txt);
  font-size: 14px;
  letter-spacing: 2px;
  opacity: 0.8;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.garden-header span { flex: 1; text-align: center; }
.theme-btn {
  background: none; border: 1px solid var(--txt3); color: var(--txt2);
  border-radius: 12px; padding: 3px 10px; font-size: 10px; cursor: pointer;
}

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>像素庭院</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1520;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.garden-header {
  text-align: center;
  padding: 12px;
  color: #c8a0ff;
  font-size: 14px;
  letter-spacing: 2px;
  opacity: 0.8;
}

.garden-canvas {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: linear-gradient(180deg, #1a1520 0%, #2a1f35 60%, #1f2a1f 100%);
}

/* Ground */
.ground {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 35%;
  background: linear-gradient(180deg, #2a3a2a 0%, #1f2f1f 100%);
  border-top: 2px solid #3a5a3a;
}

/* Stars */
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: #fff;
  border-radius: 50%;
  animation: twinkle 3s infinite alternate;
}
@keyframes twinkle { 0% { opacity: 0.3; } 100% { opacity: 1; } }

/* Moon */
.moon {
  position: absolute;
  top: 40px;
  right: 40px;
  width: 30px;
  height: 30px;
  background: #fffde0;
  border-radius: 50%;
  box-shadow: 0 0 15px #fffde080;
}

/* Pixel items */
.pixel-item {
  position: absolute;
  image-rendering: pixelated;
  transition: transform 0.3s;
  cursor: pointer;
}
.pixel-item:hover { transform: scale(1.2); }
.pixel-item .tooltip {
  display: none;
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  background: #2a2035;
  color: #e0d0f0;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 11px;
  white-space: nowrap;
  border: 1px solid #5a4a6a;
  margin-bottom: 4px;
}
.pixel-item:hover .tooltip { display: block; }

/* Item sprites (CSS pixel art) */
.sprite-seedling {
  width: 16px; height: 20px;
  background: #4a8;
  clip-path: polygon(40% 100%, 60% 100%, 60% 60%, 80% 40%, 60% 40%, 50% 0%, 40% 40%, 20% 40%, 40% 60%);
}
.sprite-flower {
  width: 20px; height: 24px;
  position: relative;
}
.sprite-flower::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 14px; height: 14px;
  background: #f8a;
  border-radius: 50%;
  box-shadow: 0 0 4px #f8a80;
}
.sprite-flower::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 3px; height: 12px;
  background: #4a8;
}
.sprite-tree {
  width: 24px; height: 36px;
  position: relative;
}
.sprite-tree::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 20px; height: 22px;
  background: #3a7;
  border-radius: 50% 50% 30% 30%;
}
.sprite-tree::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 5px; height: 16px;
  background: #864;
}
.sprite-mushroom {
  width: 16px; height: 16px;
  position: relative;
}
.sprite-mushroom::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 14px; height: 10px;
  background: #e66;
  border-radius: 50% 50% 0 0;
}
.sprite-mushroom::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 5px; height: 8px;
  background: #eee;
}
.sprite-crystal {
  width: 12px; height: 20px;
  background: #8af;
  clip-path: polygon(50% 0%, 100% 40%, 80% 100%, 20% 100%, 0% 40%);
  box-shadow: 0 0 6px #8af;
}
.sprite-heart {
  width: 16px; height: 14px;
  position: relative;
}
.sprite-heart::before, .sprite-heart::after {
  content: '';
  position: absolute;
  top: 0;
  width: 9px; height: 9px;
  background: #f55;
  border-radius: 50%;
}
.sprite-heart::before { left: 1px; }
.sprite-heart::after { right: 1px; }
.sprite-lantern {
  width: 12px; height: 20px;
  position: relative;
}
.sprite-lantern::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 10px; height: 14px;
  background: #fa5;
  border-radius: 4px;
  box-shadow: 0 0 8px #fa580;
}
.sprite-lantern::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 2px; height: 8px;
  background: #864;
}
.sprite-butterfly {
  width: 18px; height: 12px;
  position: relative;
}
.sprite-butterfly::before, .sprite-butterfly::after {
  content: '';
  position: absolute;
  top: 0;
  width: 8px; height: 10px;
  background: #c8f;
  border-radius: 50%;
  animation: flutter 1s infinite alternate;
}
.sprite-butterfly::before { left: 0; transform: rotate(-15deg); }
.sprite-butterfly::after { right: 0; transform: rotate(15deg); }
@keyframes flutter { 0% { transform: rotate(-15deg) scaleY(1); } 100% { transform: rotate(-15deg) scaleY(0.6); } }

.sprite-star-item {
  width: 16px; height: 16px;
  background: #ff0;
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  box-shadow: 0 0 6px #ff080;
}
.sprite-rain {
  width: 8px; height: 16px;
  background: linear-gradient(180deg, transparent, #8cf);
  border-radius: 0 0 4px 4px;
  animation: raindrop 2s infinite;
}
@keyframes raindrop { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(10px); } }

/* Info panel */
.garden-info {
  padding: 10px 16px;
  background: #2a2035;
  border-top: 1px solid #3a2a4a;
  color: #b0a0c0;
  font-size: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.item-count { color: #c8a0ff; }

/* Empty state */
.empty-msg {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #5a4a6a;
  font-size: 13px;
  text-align: center;
  line-height: 2;
}
</style>
</head>
<body>

<div class="garden-header">🌙 像素庭院</div>

<div class="garden-canvas" id="canvas">
  <div class="moon"></div>
  <div class="ground"></div>
  <div class="empty-msg" id="emptyMsg">
    庭院还很安静...<br>
    等池种下第一颗种子 🌱
  </div>
</div>

<div class="garden-info">
  <span>物件: <span class="item-count" id="itemCount">0</span></span>
  <span id="lastPlanted">—</span>
</div>

<script>
var API = '/api/garden';
var SPRITE_MAP = {
  seedling: 'sprite-seedling',
  flower: 'sprite-flower',
  tree: 'sprite-tree',
  mushroom: 'sprite-mushroom',
  crystal: 'sprite-crystal',
  heart: 'sprite-heart',
  lantern: 'sprite-lantern',
  butterfly: 'sprite-butterfly',
  star: 'sprite-star-item',
  rain: 'sprite-rain'
};

function init() {
  // Add stars
  var canvas = document.getElementById('canvas');
  for (var i = 0; i < 30; i++) {
    var star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 55 + '%';
    star.style.animationDelay = (Math.random() * 3) + 's';
    canvas.appendChild(star);
  }
  loadGarden();
}

function loadGarden() {
  fetch(API).then(function(r) { return r.json(); }).then(function(data) {
    var items = data.items || [];
    renderItems(items);
  }).catch(function() {
    // Try localStorage fallback
    var local = JSON.parse(localStorage.getItem('pool_garden') || '[]');
    renderItems(local);
  });
}

function renderItems(items) {
  var canvas = document.getElementById('canvas');
  var emptyMsg = document.getElementById('emptyMsg');
  var existing = canvas.querySelectorAll('.pixel-item');
  for (var i = 0; i < existing.length; i++) existing[i].remove();

  document.getElementById('itemCount').textContent = items.length;

  if (items.length === 0) {
    emptyMsg.style.display = 'block';
    return;
  }
  emptyMsg.style.display = 'none';

  var lastItem = null;
  for (var j = 0; j < items.length; j++) {
    var item = items[j];
    placeItem(item, canvas);
    lastItem = item;
  }

  if (lastItem) {
    var d = lastItem.created_at ? new Date(lastItem.created_at) : new Date();
    document.getElementById('lastPlanted').textContent = '最近: ' + (lastItem.reason || lastItem.type) + ' ' + formatDate(d);
  }
}

function placeItem(item, canvas) {
  var el = document.createElement('div');
  el.className = 'pixel-item';

  var sprite = document.createElement('div');
  sprite.className = SPRITE_MAP[item.type] || 'sprite-seedling';
  el.appendChild(sprite);

  var tooltip = document.createElement('div');
  tooltip.className = 'tooltip';
  tooltip.textContent = item.reason || item.type;
  el.appendChild(tooltip);

  // Position: use stored x,y or generate based on index
  var x = item.x !== undefined ? item.x : 10 + Math.random() * 80;
  var y = item.y !== undefined ? item.y : 60 + Math.random() * 30;
  el.style.left = x + '%';
  el.style.top = y + '%';

  canvas.appendChild(el);
}

function formatDate(d) {
  return (d.getMonth()+1) + '/' + d.getDate();
}

init();
// Auto refresh every 30s
setInterval(loadGarden, 30000);
</script>
</body>
</html>

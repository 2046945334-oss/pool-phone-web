<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#f8f5f1;min-height:100vh;padding-bottom:60px}
.tabs{display:flex;position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #eee}
.tab{flex:1;text-align:center;padding:12px 0;font-size:12px;color:#999;cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:#d4764e;font-weight:600;border-bottom-color:#d4764e}
/* 橱窗 */
.shop-grid{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shop-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05);cursor:pointer}
.shop-card .cover{height:80px;display:flex;align-items:center;justify-content:center;font-size:32px;background:#efe8e0}
.shop-card .cover img{width:100%;height:100%;object-fit:cover}
.shop-card .info{padding:8px 10px}
.shop-card .info .title{font-size:13px;font-weight:600;color:#3d3d3d}
.shop-card .info .price{font-size:12px;color:#d4764e;margin-top:2px}
.shop-card .info .meta{font-size:10px;color:#aaa;margin-top:2px}
.add-btn{background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#ccc;min-height:100px;cursor:pointer;border:2px dashed #e0e0e0}
/* 交流 */
.msg-area{padding:12px;padding-bottom:64px;flex:1;overflow-y:auto;min-height:0}
.msg-item{margin-bottom:10px;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6;max-width:85%}
.msg-item.system{background:#f0ebe5;color:#666;margin:0 auto;text-align:center;max-width:90%;font-size:11px;border-radius:20px;padding:6px 14px}
.msg-item.ai{background:#fff;color:#3d3d3d;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.msg-item.user{background:#d4764e;color:#fff;margin-left:auto}
.msg-item .time{font-size:10px;color:#aaa;margin-top:4px}
.msg-item.user .time{color:rgba(255,255,255,.7)}
/* 节点卡片消息 */
.msg-item.node-card{background:#fff;padding:0;overflow:hidden;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);max-width:80%}
.node-card-header{padding:10px 14px;font-size:12px;font-weight:600;color:#3d3d3d}
.node-card-stage{padding:0 14px;font-size:11px;color:#888;margin-bottom:8px}
.node-card-img{width:100%;aspect-ratio:1;object-fit:cover;border-top:1px solid #f0f0f0}
.node-card-footer{padding:10px 14px;text-align:center;font-size:12px;color:#1976d2;cursor:pointer}
.msg-input-bar{display:flex;gap:8px;padding:10px 12px;background:#f8f5f1;border-top:1px solid #e8e0d8;position:absolute;bottom:0;left:0;right:0;align-items:center;z-index:10}
.msg-input-bar input{flex:1;border:1px solid #ddd;border-radius:20px;padding:8px 14px;font-size:13px;outline:none}
.msg-input-bar input:focus{border-color:#d4764e}
.msg-send-btn{border:none;background:#ccc;color:#fff;border-radius:50%;width:36px;height:36px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.msg-ai-btn{border:none;background:#7c4dff;color:#fff;border-radius:50%;width:36px;height:36px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* 画师主页 */
.profile-header{text-align:center;padding:0 20px 20px;background:linear-gradient(180deg,#efe8e0 0%,#f8f5f1 100%);position:relative}
.profile-header .banner{width:100%;height:120px;background:#d4764e22;background-size:cover;background-position:center;cursor:pointer}
.profile-header .avatar{width:72px;height:72px;border-radius:50%;background:#d4764e;margin:-36px auto 10px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;overflow:hidden;cursor:pointer;background-size:cover;background-position:center;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.profile-header .avatar img{width:100%;height:100%;object-fit:cover}
.profile-header .name{font-size:18px;font-weight:700;color:#3d3d3d}
.profile-header .bio{font-size:12px;color:#888;margin-top:6px;line-height:1.5}
.profile-stats{display:flex;justify-content:center;gap:30px;padding:16px}
.profile-stats .stat{text-align:center}
.profile-stats .stat .num{font-size:18px;font-weight:700;color:#d4764e}
.profile-stats .stat .label{font-size:11px;color:#999}
.works-grid{padding:12px 16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.works-grid .work{aspect-ratio:1;background:#efe8e0;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;overflow:hidden}
.works-grid .work img{width:100%;height:100%;object-fit:cover}
.profile-edit-btn{display:block;margin:16px auto;padding:8px 24px;border:1px solid #d4764e;background:transparent;color:#d4764e;border-radius:20px;font-size:12px;cursor:pointer}
/* 订单列表 */
.order-card{background:#fff;border-radius:12px;padding:14px;margin:10px 12px;box-shadow:0 1px 4px rgba(0,0,0,.05);cursor:pointer}
.order-card .header{display:flex;justify-content:space-between;align-items:center}
.order-card .header .title{font-size:14px;font-weight:600;color:#3d3d3d}
.order-card .header .status{font-size:11px;padding:3px 8px;border-radius:10px}
.status-pending{background:#fff3e0;color:#f57c00}
.status-working{background:#e3f2fd;color:#1976d2}
.status-review{background:#fce4ec;color:#c62828}
.status-done{background:#e8f5e9;color:#388e3c}
.order-card .detail{margin-top:8px;font-size:12px;color:#666;line-height:1.6}
.order-card .deadline{margin-top:6px;font-size:11px;color:#c62828}
.order-card .actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.order-card .actions button{border:none;border-radius:8px;padding:6px 14px;font-size:11px;font-weight:600;cursor:pointer}
.btn-upload{background:#d4764e;color:#fff}
.btn-deadline{background:#fff3e0;color:#f57c00}
.btn-finish{background:#e8f5e9;color:#388e3c}
.btn-cancel{background:#f5f5f5;color:#999}
/* 订单详情页 */
.order-detail{display:none;position:fixed;inset:0;background:#f8f5f1;z-index:80;overflow-y:auto;padding-bottom:20px}
.order-detail.show{display:block}
.od-header{position:sticky;top:0;background:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #eee;z-index:81}
.od-header .back{font-size:20px;cursor:pointer;color:#3d3d3d}
.od-header .title{font-size:15px;font-weight:600;color:#3d3d3d;flex:1}
.od-header .status{font-size:11px;padding:3px 8px;border-radius:10px}
.od-info{padding:14px 16px;background:#fff;margin-bottom:2px}
.od-info .price{font-size:16px;font-weight:700;color:#d4764e}
.od-info .meta{font-size:12px;color:#888;margin-top:4px}
.od-tabs{display:flex;background:#fff;border-bottom:1px solid #eee;position:sticky;top:48px;z-index:81}
.od-tab{flex:1;text-align:center;padding:10px 0;font-size:12px;color:#999;cursor:pointer;border-bottom:2px solid transparent}
.od-tab.active{color:#1976d2;font-weight:600;border-bottom-color:#1976d2}
.od-content{padding:12px}
/* 稿件网格 */
.files-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.file-item{border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.file-item img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer}
.file-item .file-meta{padding:6px 8px;font-size:10px;color:#888}
/* 订单动态时间线 */
.timeline{padding:0 8px}
.tl-item{display:flex;gap:12px;padding-bottom:20px;position:relative}
.tl-item::before{content:'';position:absolute;left:5px;top:12px;bottom:0;width:2px;background:#e0e8f0}
.tl-item:last-child::before{display:none}
.tl-dot{width:12px;height:12px;border-radius:50%;background:#1976d2;flex-shrink:0;margin-top:4px;z-index:1}
.tl-body{flex:1}
.tl-title{font-size:13px;font-weight:600;color:#3d3d3d}
.tl-desc{font-size:12px;color:#666;margin-top:4px;padding:8px 10px;background:#f5f8fa;border-radius:8px}
.tl-desc img{max-width:60px;max-height:60px;border-radius:6px;margin-top:6px;cursor:pointer;object-fit:cover}
.tl-time{font-size:10px;color:#aaa;margin-top:4px}
/* 大图预览 */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;align-items:center;justify-content:center;cursor:pointer}
.lightbox.show{display:flex}
.lightbox img{max-width:95%;max-height:90%;object-fit:contain;border-radius:4px}
/* 弹窗 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:20px;width:85%;max-width:320px;max-height:80vh;overflow-y:auto}
.modal h3{font-size:15px;font-weight:700;margin-bottom:12px;color:#3d3d3d}
.modal label{display:block;font-size:12px;color:#666;margin-bottom:4px;margin-top:10px}
.modal input,.modal textarea,.modal select{width:100%;border:1px solid #ddd;border-radius:8px;padding:8px 10px;font-size:13px;outline:none}
.modal input:focus,.modal textarea:focus{border-color:#d4764e}
.modal textarea{resize:vertical;min-height:60px}
.modal .modal-btns{display:flex;gap:8px;margin-top:16px}
.modal .modal-btns button{flex:1;padding:10px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
.modal .modal-btns .btn-confirm{background:#d4764e;color:#fff}
.modal .modal-btns .btn-cancel{background:#f5f5f5;color:#666}
.empty{text-align:center;padding:40px 20px;color:#bbb;font-size:13px}
</style>
</head>
<body>
<div class="tabs">
  <div class="tab active" onclick="switchTab(0)">🖼 橱窗</div>
  <div class="tab" onclick="switchTab(1)">💬 交流</div>
  <div class="tab" onclick="switchTab(2)">🎨 主页</div>
  <div class="tab" onclick="switchTab(3)">📋 订单</div>
</div>
<div id="page0">
<div class="shop-grid" id="shopGrid"></div>
</div>
<div id="page1" style="display:none;flex-direction:column;position:relative;height:100%;overflow:hidden">
  <div class="msg-area" id="msgArea"></div>
  <div class="msg-input-bar">
    <input id="msgInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendMsg()">
    <button class="msg-send-btn" onclick="sendMsg()">▶</button>
    <button class="msg-ai-btn" onclick="sendMsg();triggerAiReply()" title="发送并让池回复">✨</button>
  </div>
</div>
<div id="page2" style="display:none">
  <div class="profile-header">
    <div class="banner" id="profileBanner" onclick="pickBanner()" title="点击更换背景"></div>
    <div class="avatar" id="profileAvatar" onclick="pickAvatar()" title="点击更换头像">🎨</div>
    <div class="name" id="profileName">画师</div>
    <div class="bio" id="profileBio">还没有填写简介</div>
  </div>
  <div class="profile-stats">
    <div class="stat"><div class="num" id="statOrders">0</div><div class="label">接单</div></div>
    <div class="stat"><div class="num" id="statDone">0</div><div class="label">完成</div></div>
    <div class="stat"><div class="num" id="statEarned">0</div><div class="label">收入</div></div>
  </div>
  <button class="profile-edit-btn" onclick="editProfile()">编辑资料</button>
  <div style="padding:0 16px;font-size:13px;font-weight:600;color:#3d3d3d;margin-bottom:8px">作品集</div>
  <div class="works-grid" id="worksGrid"></div>
</div>
<div id="page3" style="display:none">
  <div class="order-list" id="orderList"></div>
</div>

<!-- 订单详情页 -->
<div class="order-detail" id="orderDetail">
  <div class="od-header">
    <div class="back" onclick="closeDetail()">←</div>
    <div class="title" id="odTitle">订单详情</div>
    <div class="status" id="odStatus"></div>
  </div>
  <div class="od-info">
    <div class="price" id="odPrice"></div>
    <div class="meta" id="odMeta"></div>
  </div>
  <div class="od-tabs">
    <div class="od-tab active" onclick="switchDetailTab(0)">稿件</div>
    <div class="od-tab" onclick="switchDetailTab(1)">订单动态</div>
    <div class="od-tab" onclick="switchDetailTab(2)">参考信息</div>
  </div>
  <div class="od-content" id="odContent"></div>
</div>

<!-- 大图预览 -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="">
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>
<script src="backend-sync.js"></script>
<script>
var DATA_KEY = 'pool_commission';
var gd = {
  profile: { name: '画师', bio: '还没有填写简介', avatar: '', avatarUrl: '', bannerUrl: '' },
  shop: [],
  orders: [],
  messages: [],
  works: [],
  earned: 0
};
var currentDetailOrder = -1;
var currentDetailTab = 0;

function load() {
  // First try localStorage for instant render
  try {
    var s = localStorage.getItem(DATA_KEY);
    if (s) {
      var parsed = JSON.parse(s);
      Object.assign(gd, parsed);
    }
  } catch(e) {}
  render();
  // Then pull latest from backend (AI writes there directly)
  syncFromBackend([DATA_KEY], function() {
    try {
      var s2 = localStorage.getItem(DATA_KEY);
      if (s2) {
        var parsed2 = JSON.parse(s2);
        Object.assign(gd, parsed2);
      }
    } catch(e2) {}
    render();
  });
}
function save() {
  // Before saving, merge AI-side data (orders/messages) from backend to avoid overwrite
  fetch('/api/data/' + DATA_KEY + '?t=' + Date.now()).then(function(r) {
    return r.ok ? r.json() : null;
  }).then(function(d) {
    if (d && d.value) {
      var remote = typeof d.value === 'string' ? JSON.parse(d.value) : d.value;
      // Merge orders from remote that don't exist locally (by id)
      if (remote.orders && remote.orders.length) {
        var localIds = {};
        (gd.orders || []).forEach(function(o) { localIds[o.id] = true; });
        remote.orders.forEach(function(o) {
          if (!localIds[o.id]) gd.orders.push(o);
          else {
            // Update local order with remote changes (e.g. AI comments)
            for (var i = 0; i < gd.orders.length; i++) {
              if (gd.orders[i].id === o.id) {
                gd.orders[i].timeline = o.timeline || gd.orders[i].timeline;
                break;
              }
            }
          }
        });
      }
      // Merge messages
      if (remote.messages && remote.messages.length) {
        var localMsgIds = {};
        (gd.messages || []).forEach(function(m) { localMsgIds[m.id] = true; });
        remote.messages.forEach(function(m) {
          if (!localMsgIds[m.id]) gd.messages.push(m);
        });
      }
      // Keep remote earned if higher
      if ((remote.earned || 0) > (gd.earned || 0)) gd.earned = remote.earned;
    }
    doSave();
  }).catch(function() { doSave(); });
  function doSave() {
    try {
      var data = JSON.stringify(gd);
      localStorage.setItem(DATA_KEY, data);
      syncToBackend(DATA_KEY, data);
    } catch(e) { console.error('save error:', e); }
  }
}
function render() {
  renderShop();
  renderMessages();
  renderProfile();
  renderOrders();
}

// ===== 橱窗 =====
function renderShop() {
  var grid = document.getElementById('shopGrid');
  var html = gd.shop.map(function(item, i) {
    var coverHtml = item.coverUrl
      ? '<img src="'+item.coverUrl+'">'
      : item.emoji;
    return '<div class="shop-card" onclick="shopDetail('+i+')">' +
      '<div class="cover">'+coverHtml+'</div>' +
      '<div class="info"><div class="title">'+item.title+'</div>' +
      '<div class="price">'+item.price+' 积分</div>' +
      '<div class="meta">'+(item.category||'通用')+'</div></div></div>';
  }).join('');
  html += '<div class="add-btn" onclick="addShopItem()">+</div>';
  grid.innerHTML = html;
}
function addShopItem() {
  showModal('<h3>上架稿件</h3>' +
    '<label>标题</label><input id="m_title" placeholder="如：半身立绘">' +
    '<label>分类</label><input id="m_cat" placeholder="如：立绘/头像/场景">' +
    '<label>价格（积分）</label><input id="m_price" type="number" placeholder="100">' +
    '<label>封面图片</label><input id="m_cover" type="file" accept="image/*" style="font-size:12px">' +
    '<label>描述</label><textarea id="m_desc" placeholder="包含内容、画风、工期等"></textarea>' +
    '<div class="modal-btns"><button class="btn-cancel" onclick="hideModal()">取消</button>' +
    '<button class="btn-confirm" onclick="confirmAddShop()">上架</button></div>');
}
function confirmAddShop() {
  var title = document.getElementById('m_title').value.trim();
  var price = parseInt(document.getElementById('m_price').value) || 0;
  var desc = document.getElementById('m_desc').value.trim();
  var cat = document.getElementById('m_cat').value.trim() || '通用';
  if (!title || !price) { alert('请填写标题和价格'); return; }
  var fileInput = document.getElementById('m_cover');
  var finish = function(coverUrl) {
    gd.shop.push({ id: Date.now(), title: title, desc: desc, price: price, emoji: '🖌️', category: cat, coverUrl: coverUrl||'' });
    save(); render(); hideModal();
  };
  if (fileInput.files[0]) {
    fileToDataUrl(fileInput.files[0], function(url) { finish(url); });
  } else { finish(''); }
}
function shopDetail(i) {
  var item = gd.shop[i];
  if (!item) return;
  var imgHtml = item.coverUrl ? '<img src="'+item.coverUrl+'" style="width:100%;border-radius:8px;margin:8px 0">' : '';
  showModal('<h3>'+item.emoji+' '+item.title+'</h3>' + imgHtml +
    '<div style="font-size:13px;color:#666;line-height:1.6;margin:8px 0">'+item.desc+'</div>' +
    '<div style="font-size:14px;color:#d4764e;font-weight:600">'+item.price+' 积分</div>' +
    '<div style="font-size:11px;color:#999;margin-top:4px">分类: '+item.category+'</div>' +
    '<div class="modal-btns">' +
    '<button class="btn-cancel" onclick="removeShopItem('+i+')">下架</button>' +
    '<button class="btn-confirm" onclick="hideModal()">关闭</button></div>');
}
function removeShopItem(i) {
  if (!confirm('确定下架？')) return;
  gd.shop.splice(i, 1);
  save(); render(); hideModal();
}

// ===== 交流页 =====
function renderMessages() {
  var area = document.getElementById('msgArea');
  if (gd.messages.length === 0) {
    area.innerHTML = '<div class="empty">还没有消息<br>下单或上传节点后会自动出现在这里</div>';
    return;
  }
  area.innerHTML = gd.messages.map(function(m) {
    var timeStr = new Date(m.time).toLocaleString('zh-CN', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    // 节点卡片消息
    if (m.type === 'node' && m.imageUrl) {
      return '<div class="msg-item node-card">' +
        '<div class="node-card-header">上传新稿件</div>' +
        '<div class="node-card-stage">当前节点：'+m.nodeType+'</div>' +
        '<img class="node-card-img" src="'+m.imageUrl+'" onclick="openLightbox(\''+m.imageUrl.replace(/'/g,"\\'")+'\')">' +
        '<div class="node-card-footer" onclick="openLightbox(\''+m.imageUrl.replace(/'/g,"\\'")+'\')">' +
        '点击查看大图 ></div></div>';
    }
    var cls = m.from === 'system' ? 'system' : (m.from === 'ai' ? 'ai' : 'user');
    return '<div class="msg-item '+cls+'">'+m.text+'<div class="time">'+timeStr+'</div></div>';
  }).join('');
  area.scrollTop = area.scrollHeight;
}
function sendMsg() {
  var input = document.getElementById('msgInput');
  var text = input.value.trim();
  if (!text) return;
  gd.messages.push({ id: Date.now(), text: text, time: Date.now(), from: 'user' });
  input.value = '';
  save(); renderMessages();
}
function triggerAiReply() {
  var userMsgs = (gd.messages||[]).filter(function(m){return m.from==="user"});
  var userText = userMsgs.length ? userMsgs[userMsgs.length-1].text : "";
  if (!userText) return;
  // Use the exact same config as main chat (getApiConfig('chat') logic)
  var def = {}; try { def = JSON.parse(localStorage.getItem('pool_api_config')||'{}'); } catch(e) {}
  var all = {}; try { all = JSON.parse(localStorage.getItem('pool_api_configs')||'{}'); } catch(e) {}
  var fc = all.chat || {};
  var config = { baseUrl: fc.apiBase||def.baseUrl||def.apiBase||'', apiKey: fc.apiKey||def.apiKey||'', model: fc.model||def.model||'' };
  if (!config.baseUrl) return;
  // Read the same system prompt as main chat
  var sysPrompt = localStorage.getItem('pool_system_prompt') || '';
  // Build messages in OpenAI format from commission chat history
  var msgs = [];
  if (sysPrompt) {
    msgs.push({ role: 'system', content: sysPrompt });
  }
  // Add scene context
  msgs.push({ role: 'system', content: '[当前场景] 你正在接稿App的交流频道里和画师（就是她）聊天。这里是你们关于约稿的对话。请像平时一样回复，保持你的性格和记忆。不要用markdown。简短回复即可。' });
  // Add recent messages as conversation
  var recent = (gd.messages || []).slice(-20);
  recent.forEach(function(m) {
    if (m.from === 'user') {
      msgs.push({ role: 'user', content: m.text });
    } else if (m.from === 'ai') {
      msgs.push({ role: 'assistant', content: m.text });
    }
    // skip system messages in chat format
  });
  // Make sure last message is user
  if (msgs[msgs.length - 1] && msgs[msgs.length - 1].role !== 'user') {
    msgs.push({ role: 'user', content: userText });
  }
  // Show loading indicator
  gd.messages.push({ id: 'typing', text: '回复中...', time: Date.now(), from: 'ai' });
  renderMessages();
  fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: msgs, apiBase: config.baseUrl, apiKey: config.apiKey, model: config.model })
  }).then(function(r) { return r.json(); })
  .then(function(d) {
    // Remove typing indicator
    gd.messages = gd.messages.filter(function(m){ return m.id !== 'typing'; });
    var reply = (d.reply || d.content || d.message || '').trim();
    if (reply) {
      gd.messages.push({ id: Date.now(), text: reply, time: Date.now(), from: 'ai' });
    } else if (d.error) {
      gd.messages.push({ id: Date.now(), text: '⚠️ ' + (typeof d.error === 'string' ? d.error : JSON.stringify(d.error)), time: Date.now(), from: 'system' });
    }
    save(); renderMessages();
  }).catch(function(e) {
    gd.messages = gd.messages.filter(function(m){ return m.id !== 'typing'; });
    gd.messages.push({ id: Date.now(), text: '⚠️ 网络错误', time: Date.now(), from: 'system' });
    save(); renderMessages();
    console.error('AI reply error:', e);
  });
}
function pushSystemMsg(text) {
  gd.messages.push({ id: Date.now(), text: text, time: Date.now(), from: 'system' });
}
function pushAiMsg(text) {
  gd.messages.push({ id: Date.now(), text: text, time: Date.now(), from: 'ai' });
}

// 图片相关工具
function fileToDataUrl(file, cb) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var maxW = 800, maxH = 800;
      var w = img.width, h = img.height;
      if (w > maxW || h > maxH) {
        var ratio = Math.min(maxW/w, maxH/h);
        w = Math.round(w*ratio); h = Math.round(h*ratio);
      }
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL("image/jpeg", 0.75));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function openLightbox(url) {
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
}

function pickAvatar() { editProfile(); }
function pickBanner() { editProfile(); }
function editProfile() {

  window._pendingBannerUrl = null;

    '<label>昵称</label><input id="m_name" value="'+gd.profile.name+'">' +

    '<label>主页背景</label><div style="display:flex;gap:8px;align-items:center"><input id="m_banner_file" type="file" accept="image/*" onchange="previewField(this,\'banner\')" style="font-size:12px;flex:1"><span id="m_banner_preview" style="font-size:12px;color:#888">'+(gd.profile.bannerUrl?'✓已设置':'未设置')+'</span></div>' +
    '<label>简介</label><textarea id="m_bio">'+gd.profile.bio+'</textarea>' +

function previewField(input, type) {
  if (!input.files[0]) return;

    if (type === 'avatar') { window._pendingAvatarUrl = url; document.getElementById('m_avatar_preview').textContent = '✓ 已选择'; }
    else { window._pendingBannerUrl = url; document.getElementById('m_banner_preview').textContent = '✓ 已选择'; }
  });
}
function confirmEditProfile() {
  gd.profile.name = document.getElementById('m_name').value.trim() || '画师';

  if (window._pendingBannerUrl) gd.profile.bannerUrl = window._pendingBannerUrl;
  gd.profile.bio = document.getElementById('m_bio').value.trim();
  save(); render(); hideModal();
}
function addWork() {

    '<label>标题</label><input id="m_wtitle" placeholder="作品名">' +
    '<div class="modal-btns"><button class="btn-cancel" onclick="hideModal()">取消</button>' +

}
function confirmAddWork() {

    gd.works.push({ emoji: '🖼️', title: title, imageUrl: imgUrl||'' });

function removeWork(i) {

}

// ===== 订单 =====
function renderOrders() {
  var list = document.getElementById('orderList');
  if (gd.orders.length === 0) {
    list.innerHTML = '<div class="empty">还没有订单<br>等池来下单吧~</div>';
    return;
  }
  var statusLabel = { pending:'待接单', working:'绘制中', review:'待确认', done:'已完成', cancelled:'已取消' };
  var statusClass = { pending:'status-pending', working:'status-working', review:'status-review', done:'status-done', cancelled:'btn-cancel' };
  list.innerHTML = gd.orders.slice().reverse().map(function(o, ri) {
    var i = gd.orders.length - 1 - ri;
    var deadlineHtml = '';
    if (o.deadline && o.status !== 'done' && o.status !== 'cancelled') {
      var remain = Math.ceil((o.deadline - Date.now()) / (1000*60*60*24));
      deadlineHtml = '<div class="deadline">⏰ 截止: '+new Date(o.deadline).toLocaleDateString('zh-CN')+' ('+(remain > 0 ? '剩'+remain+'天' : '已过期')+')</div>';
    }
    var thumbHtml = '';
    if (o.nodes && o.nodes.length > 0) {
      var lastImg = null;
      for (var n = o.nodes.length-1; n >= 0; n--) { if (o.nodes[n].imageUrl) { lastImg = o.nodes[n].imageUrl; break; } }
      if (lastImg) thumbHtml = '<img src="'+lastImg+'" style="width:40px;height:40px;border-radius:6px;object-fit:cover;margin-top:8px">';
    }
    var actions = '';
    if (o.status === 'pending') {
      actions = '<button class="btn-upload" onclick="event.stopPropagation();acceptOrder('+i+')">接单</button><button class="btn-cancel" onclick="event.stopPropagation();cancelOrder('+i+')">拒绝</button>';
    } else if (o.status === 'working') {
      actions = '<button class="btn-upload" onclick="event.stopPropagation();uploadNode('+i+')">上传节点</button><button class="btn-finish" onclick="event.stopPropagation();submitFinal('+i+')">提交成图</button>';
    } else if (o.status === 'review') {
      actions = '<span style="font-size:11px;color:#888">等待池确认中…</span>';
    }
    return '<div class="order-card" onclick="openDetail('+i+')"><div class="header"><div class="title">'+o.title+'</div>' +
      '<div class="status '+(statusClass[o.status]||'')+'">'+(statusLabel[o.status]||o.status)+'</div></div>' +
      '<div class="detail">积分: '+o.price+' · 下单: '+new Date(o.createdAt).toLocaleDateString('zh-CN')+'</div>' +
      deadlineHtml + thumbHtml +
      '<div class="actions">'+actions+'</div></div>';
  }).join('');
}

function acceptOrder(i) {
  var o = gd.orders[i]; if (!o || o.status !== 'pending') return;
  o.status = 'working';
  if (!o.timeline) o.timeline = [];
  o.timeline.push({ type: '接单', text: '画师已接单，开始绘制', time: Date.now() });
  pushSystemMsg('📋 订单「'+o.title+'」已接单，开始绘制');
  save(); render();
}
function cancelOrder(i) {
  var o = gd.orders[i]; if (!o) return;
  if (!confirm('确定拒绝/取消这个订单？积分将退还给池')) return;
  o.status = 'cancelled';
  if (!o.timeline) o.timeline = [];
  o.timeline.push({ type: '取消', text: '订单已取消', time: Date.now() });
  pushSystemMsg('❌ 订单「'+o.title+'」已取消');
  save(); render();
}
function uploadNode(i) {
  var o = gd.orders[i]; if (!o || o.status !== 'working') return;
  showModal('<h3>上传节点稿件</h3>' +
    '<label>节点类型</label><select id="m_ntype"><option>草稿</option><option>线稿</option><option>上色</option><option>细化</option><option>其他</option></select>' +
    '<label>稿件图片</label><input id="m_nimg" type="file" accept="image/*" style="font-size:12px">' +
    '<label>说明</label><textarea id="m_ntext" placeholder="本次更新内容说明"></textarea>' +
    '<div class="modal-btns"><button class="btn-cancel" onclick="hideModal()">取消</button>' +
    '<button class="btn-confirm" onclick="confirmUploadNode('+i+')">上传</button></div>');
}
function confirmUploadNode(i) {
  var o = gd.orders[i];
  var type = document.getElementById('m_ntype').value;
  var text = document.getElementById('m_ntext').value.trim() || '已更新';
  var fileInput = document.getElementById('m_nimg');
  var finish = function(imgUrl) {
    if (!o.nodes) o.nodes = [];
    o.nodes.push({ type: type, text: text, time: Date.now(), imageUrl: imgUrl||'' });
    if (!o.timeline) o.timeline = [];
    o.timeline.push({ type: '上传稿件', text: '节点: '+type+' '+text, time: Date.now(), imageUrl: imgUrl||'' });
    // 交流页卡片消息
    gd.messages.push({ id: Date.now(), text: '🎨 「'+o.title+'」上传了 ['+type+']', time: Date.now(), from: 'system', type: 'node', nodeType: type, imageUrl: imgUrl||'' });
    pushSystemMsg('🎨 「'+o.title+'」节点 ['+type+'] '+text);
    save(); render(); hideModal();
    if (currentDetailOrder === i) renderDetailContent();
  };
  if (fileInput.files[0]) { fileToDataUrl(fileInput.files[0], function(url){ finish(url); }); }
  else { finish(''); }
}
function setDeadline(i) {
  var o = gd.orders[i]; if (!o) return;
  showModal('<h3>设置截止时间</h3>' +
    '<label>截止日期</label><input id="m_deadline" type="date">' +
    '<div class="modal-btns"><button class="btn-cancel" onclick="hideModal()">取消</button>' +
    '<button class="btn-confirm" onclick="confirmDeadline('+i+')">确定</button></div>');
}
function confirmDeadline(i) {
  var o = gd.orders[i];
  var dateVal = document.getElementById('m_deadline').value;
  if (!dateVal) { alert('请选择日期'); return; }
  o.deadline = new Date(dateVal).getTime();
  if (!o.timeline) o.timeline = [];
  o.timeline.push({ type: '设截止时间', text: dateVal, time: Date.now() });
  pushSystemMsg('⏰ 「'+o.title+'」截止时间设为 '+dateVal);
  save(); render(); hideModal();
}
function submitFinal(i) {
  var o = gd.orders[i]; if (!o || o.status !== 'working') return;
  showModal('<h3>提交最终成图</h3>' +
    '<label>成图图片</label><input id="m_final_img" type="file" accept="image/*" style="font-size:12px">' +
    '<label>备注</label><textarea id="m_final_text" placeholder="交付说明（可选）"></textarea>' +
    '<div class="modal-btns"><button class="btn-cancel" onclick="hideModal()">取消</button>' +
    '<button class="btn-confirm" onclick="confirmSubmitFinal('+i+')">提交</button></div>');
}
function confirmSubmitFinal(i) {
  var o = gd.orders[i];
  var text = document.getElementById('m_final_text').value.trim() || '最终稿件已提交';
  var fileInput = document.getElementById('m_final_img');
  var finish = function(imgUrl) {
    o.status = 'review';
    if (!o.nodes) o.nodes = [];
    o.nodes.push({ type: '成图', text: text, time: Date.now(), imageUrl: imgUrl||'' });
    if (!o.timeline) o.timeline = [];
    o.timeline.push({ type: '提交成图', text: text, time: Date.now(), imageUrl: imgUrl||'' });
    gd.messages.push({ id: Date.now(), text: '✅ 「'+o.title+'」提交成图', time: Date.now(), from: 'system', type: 'node', nodeType: '成图', imageUrl: imgUrl||'' });
    pushSystemMsg('✅ 「'+o.title+'」已提交成图，等待池确认');
    save(); render(); hideModal();
    if (currentDetailOrder === i) renderDetailContent();
  };
  if (fileInput.files[0]) { fileToDataUrl(fileInput.files[0], function(url){ finish(url); }); }
  else { finish(''); }
}

// ===== 订单详情 =====
function openDetail(i) {
  currentDetailOrder = i;
  currentDetailTab = 0;
  var o = gd.orders[i];
  var statusLabel = { pending:'待接单', working:'绘制中', review:'待确认', done:'已完成', cancelled:'已取消' };
  var statusClass = { pending:'status-pending', working:'status-working', review:'status-review', done:'status-done', cancelled:'btn-cancel' };
  document.getElementById('odTitle').textContent = o.title;
  var statusEl = document.getElementById('odStatus');
  statusEl.textContent = statusLabel[o.status]||o.status;
  statusEl.className = 'status '+(statusClass[o.status]||'');
  document.getElementById('odPrice').textContent = o.price + ' 积分';
  document.getElementById('odMeta').textContent = '下单: '+new Date(o.createdAt).toLocaleDateString('zh-CN') + (o.deadline ? ' · 截止: '+new Date(o.deadline).toLocaleDateString('zh-CN') : '');
  // reset tabs
  var tabs = document.querySelectorAll('.od-tab');
  tabs.forEach(function(t,idx){ t.className = idx===0?'od-tab active':'od-tab'; });
  renderDetailContent();
  document.getElementById('orderDetail').classList.add('show');
}
function closeDetail() {
  document.getElementById('orderDetail').classList.remove('show');
  currentDetailOrder = -1;
}
function switchDetailTab(n) {
  currentDetailTab = n;
  var tabs = document.querySelectorAll('.od-tab');
  tabs.forEach(function(t,idx){ t.className = idx===n?'od-tab active':'od-tab'; });
  renderDetailContent();
}
function renderDetailContent() {
  var c = document.getElementById('odContent');
  var o = gd.orders[currentDetailOrder];
  if (!o) { c.innerHTML = ''; return; }

  if (currentDetailTab === 0) {
    // 稿件
    var imgs = [];
    (o.nodes||[]).forEach(function(n){ if (n.imageUrl) imgs.push(n); });
    if (imgs.length === 0) { c.innerHTML = '<div class="empty">还没有稿件图片</div>'; return; }
    c.innerHTML = '<div class="files-grid">' + imgs.map(function(n){
      return '<div class="file-item"><img src="'+n.imageUrl+'" onclick="openLightbox(\''+n.imageUrl.replace(/'/g,"\\'")+'\')">' +
        '<div class="file-meta">'+n.type+' · '+new Date(n.time).toLocaleDateString('zh-CN')+'</div></div>';
    }).join('') + '</div>';
  } else if (currentDetailTab === 1) {
    // 订单动态时间线
    var tl = o.timeline || [];
    // 自动补下单事件
    var events = [{ type: '买家下单', text: '订单总价 '+o.price+' 积分', time: o.createdAt }].concat(tl);
    c.innerHTML = '<div class="timeline">' + events.map(function(ev){
      var imgHtml = ev.imageUrl ? '<img src="'+ev.imageUrl+'" onclick="openLightbox(\''+ev.imageUrl.replace(/'/g,"\\'")+'\')">' : '';
      return '<div class="tl-item"><div class="tl-dot"></div><div class="tl-body">' +
        '<div class="tl-title">'+ev.type+'</div>' +
        '<div class="tl-desc">'+ev.text+imgHtml+'</div>' +
        '<div class="tl-time">'+new Date(ev.time).toLocaleString('zh-CN')+'</div></div></div>';
    }).join('') + '</div>';
  } else {
    // 参考信息
    var ref = o.reference || o.desc || '暂无参考信息';
    c.innerHTML = '<div style="padding:12px;font-size:13px;color:#666;line-height:1.8">'+ref+'</div>';
    if (o.refImages && o.refImages.length) {
      c.innerHTML += '<div class="files-grid">' + o.refImages.map(function(url){
        return '<div class="file-item"><img src="'+url+'" onclick="openLightbox(\''+url.replace(/'/g,"\\'")+'\')">' +
          '</div>';
      }).join('') + '</div>';
    }
  }
}

// ===== AI下单接口 =====
var lastOrderCount = 0;
function checkNewOrders() {
  if (gd.orders.length > lastOrderCount && lastOrderCount > 0) {
    var newO = gd.orders[gd.orders.length - 1];
    if (newO.status === 'pending') {
      // 补 timeline
      if (!newO.timeline) newO.timeline = [];
      if (newO.timeline.length === 0) newO.timeline.push({ type: '买家下单', text: '订单总价 '+newO.price+' 积分', time: newO.createdAt });
      pushSystemMsg('🛒 池下了新单「'+newO.title+'」，'+newO.price+'积分');
      if (newO.aiNote) pushAiMsg(newO.aiNote);
      save();
    }
  }
  lastOrderCount = gd.orders.length;
}
function checkOrderUpdates() {
  gd.orders.forEach(function(o) {
    if (o.status === 'done' && !o._notified) {
      if (!o.timeline) o.timeline = [];
      o.timeline.push({ type: '交易完成', text: '积分已入账', time: Date.now() });
      pushSystemMsg('🎉 订单「'+o.title+'」已完成交易！积分已入账');
      gd.earned = (gd.earned || 0) + o.price;
      o._notified = true;
      save(); render();
    }
  });
}

// ===== 通用 =====
function switchTab(n) {
  for (var i = 0; i < 4; i++) document.getElementById('page'+i).style.display = i===n ? (i===1?'flex':'block') : 'none';
  if (n===1) { var p1=document.getElementById('page1'); p1.style.height=(window.innerHeight - p1.offsetTop)+'px'; }
  var tabs = document.querySelectorAll('.tabs .tab');
  tabs.forEach(function(t,i) { t.className = i===n ? 'tab active' : 'tab'; });
  if (n === 1) setTimeout(function(){ var a=document.getElementById('msgArea'); a.scrollTop=a.scrollHeight; }, 50);
}
function showModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}
function hideModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) hideModal();
});
// 启动
load();
lastOrderCount = gd.orders.length;
// 轮询后端数据
setInterval(function() {
  syncFromBackend([DATA_KEY], function() {
    var s = localStorage.getItem(DATA_KEY);
    if (s) {
      try {
        var newData = JSON.parse(s);
        Object.assign(gd, newData);
        checkNewOrders();
        checkOrderUpdates();
        render();
      } catch(e) {}
    }
  });
}, 15000);
syncFromBackend([DATA_KEY], function() { load(); lastOrderCount = gd.orders.length; });
</script>

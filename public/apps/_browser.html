<!DOCTYPE html>
<html><head><script src="sync.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>浏览</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, sans-serif; background: #f5f0f5; height: 100vh; display: flex; flex-direction: column; }
.search-area { padding: 16px; background: #fff; border-bottom: 1px solid #eee; }
.search-box { display: flex; align-items: center; gap: 8px; }
.search-input { flex: 1; padding: 10px 14px; border-radius: 20px; border: 1.5px solid #e0d6e8; font-size: 14px; outline: none; background: #faf8fc; }
.search-input:focus { border-color: #b38fd9; }
.search-btn { width: 38px; height: 38px; border-radius: 50%; border: none; background: #9b6fbf; color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.quick-links { padding: 16px; }
.quick-title { font-size: 12px; color: #aaa; margin-bottom: 10px; }
.links-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.link-item { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.link-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
.link-name { font-size: 11px; color: #666; }
.history-area { flex: 1; padding: 0 16px 16px; overflow-y: auto; }
.history-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
.history-header span { font-size: 12px; color: #aaa; }
.history-clear { color: #b38fd9; cursor: pointer; font-size: 11px; border: none; background: none; }
.history-list { display: flex; flex-direction: column; gap: 6px; }
.h-item { padding: 10px 12px; background: #fff; border-radius: 10px; font-size: 13px; color: #333; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.h-item:active { background: #f5f0f5; }
.h-item .h-time { font-size: 10px; color: #bbb; flex-shrink: 0; margin-left: 8px; }
.h-item .h-query { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { text-align: center; color: #ccc; padding: 30px 0; font-size: 12px; }
</style>
</head><body>
<div class="search-area">
  <div class="search-box">
    <input class="search-input" id="si" placeholder="搜索或输入网址..." autocomplete="off" />
    <button class="search-btn" onclick="doSearch()">🔍</button>
  </div>
</div>
<div class="quick-links">
  <div class="quick-title">快捷访问</div>
  <div class="links-grid">
    <div class="link-item" onclick="go('https://www.baidu.com')"><div class="link-icon">🔍</div><span class="link-name">百度</span></div>
    <div class="link-item" onclick="go('https://m.bilibili.com')"><div class="link-icon">📺</div><span class="link-name">B站</span></div>
    <div class="link-item" onclick="go('https://www.zhihu.com')"><div class="link-icon">💡</div><span class="link-name">知乎</span></div>
    <div class="link-item" onclick="go('https://www.douban.com')"><div class="link-icon">📗</div><span class="link-name">豆瓣</span></div>
    <div class="link-item" onclick="go('https://music.163.com')"><div class="link-icon">🎵</div><span class="link-name">网易云</span></div>
    <div class="link-item" onclick="go('https://github.com')"><div class="link-icon">🐙</div><span class="link-name">GitHub</span></div>
    <div class="link-item" onclick="go('https://www.taobao.com')"><div class="link-icon">🛒</div><span class="link-name">淘宝</span></div>
    <div class="link-item" onclick="go('https://translate.google.com')"><div class="link-icon">🌐</div><span class="link-name">翻译</span></div>
  </div>
</div>
<div class="history-area">
  <div class="history-header">
    <span>搜索记录</span>
    <button class="history-clear" onclick="clearH()">清空</button>
  </div>
  <div class="history-list" id="hl"></div>
</div>
<script>
var K='pool_browser_history';
function getH(){try{return JSON.parse(localStorage.getItem(K))||[]}catch(e){return[]}}
function saveH(l){localStorage.setItem(K,JSON.stringify(l.slice(0,30)))}
function render(){
  var l=getH(),el=document.getElementById('hl');
  if(!l.length){el.innerHTML='<div class="empty">暂无记录</div>';return}
  el.innerHTML=l.map(function(h){return '<div class="h-item" onclick="search(\''+h.q.replace(/'/g,"\\'").replace(/\\/g,"\\\\")+'\')">'+'<span class="h-query">'+h.q+'</span><span class="h-time">'+h.t+'</span></div>'}).join('')
}
function doSearch(){var v=document.getElementById('si').value.trim();if(v)search(v)}
function search(q){
  var l=getH(),seen={};
  l.unshift({q:q,t:new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})});
  l=l.filter(function(h){if(seen[h.q])return false;seen[h.q]=1;return true});
  saveH(l);
  if(/^https?:\/\//i.test(q)||/^[a-z0-9][-a-z0-9]*\.[a-z]{2,}/i.test(q)){
    window.open(q.indexOf('://')>-1?q:'https://'+q,'_blank')
  }else{
    window.open('https://www.bing.com/search?q='+encodeURIComponent(q),'_blank')
  }
  render()
}
function go(u){window.open(u,'_blank')}
function clearH(){localStorage.removeItem(K);render()}
document.getElementById('si').addEventListener('keydown',function(e){if(e.key==='Enter')doSearch()});
render();
</script>
</body></html>

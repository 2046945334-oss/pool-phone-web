<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>池的赛博旅行</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, sans-serif; background: #f9f9f9 url('travel_assets/travel_bg.png') center/cover fixed; min-height:100vh; overflow-x:hidden; }

.header {
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(8px);
  padding: 20px 16px 16px;
  text-align: center;
  border-bottom: 1px solid #e0e0e0;
  position: relative;
}
.header h1 {
  font-size: 18px;
  color: #444;
  font-weight: 600;
  letter-spacing: 2px;
}
.header .subtitle {
  font-size: 11px;
  color: #999;
  margin-top: 4px;
}

.status-bar {
  background: rgba(255,255,255,0.8);
  backdrop-filter: blur(6px);
  margin: 12px 16px;
  padding: 14px 16px;
  border-radius: 12px;
  border: 1px solid #e8e8e8;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.status-icon { font-size: 28px; }
.status-text { flex:1; }
.status-text .main { font-size: 14px; color: #444; font-weight: 500; }
.status-text .sub { font-size: 11px; color: #999; margin-top: 2px; }

.tabs {
  display: flex;
  margin: 0 16px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(6px);
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #e0e0e0;
}
.tab {
  flex: 1;
  padding: 10px 0;
  text-align: center;
  font-size: 12px;
  color: #888;
  cursor: pointer;
  transition: all 0.2s;
  border: none;
  background: none;
}
.tab.active {
  background: #555;
  color: #fff;
  font-weight: 500;
}

.content { padding: 12px 16px 80px; }

/* 明信片列表 */
.postcard-list { display: flex; flex-direction: column; gap: 16px; }
.postcard-item {
  position: relative;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 3px 12px rgba(0,0,0,0.1);
  background: #fff;
}
.postcard-bg {
  width: 100%;
  height: 180px;
  object-fit: cover;
  display: block;
}
.postcard-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: linear-gradient(transparent, rgba(0,0,0,0.7));
  padding: 30px 14px 12px;
}
.postcard-city {
  color: #fff;
  font-size: 16px;
  font-weight: 600;
}
.postcard-date {
  color: rgba(255,255,255,0.8);
  font-size: 11px;
  margin-top: 2px;
}
.postcard-msg {
  color: rgba(255,255,255,0.9);
  font-size: 12px;
  margin-top: 6px;
  font-style: italic;
  line-height: 1.4;
}

/* 集章册 */
.stamp-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.stamp-item {
  aspect-ratio: 1;
  background: rgba(255,255,255,0.7);
  border-radius: 10px;
  border: 2px dashed #ccc;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 8px;
}
.stamp-item.collected {
  border: 2px solid #888;
  background: rgba(255,255,255,0.9);
}
.stamp-emoji { font-size: 28px; }
.stamp-name { font-size: 10px; color: #555; text-align: center; font-weight: 500; }
.stamp-item.empty .stamp-emoji { opacity: 0.3; }
.stamp-item.empty .stamp-name { color: #bbb; }

/* 旅行日志 */
.journal-list { display: flex; flex-direction: column; gap: 12px; }
.journal-item {
  background: rgba(255,255,255,0.8);
  backdrop-filter: blur(4px);
  border-radius: 10px;
  padding: 14px;
  border-left: 3px solid #aaa;
}
.journal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.journal-city { font-size: 14px; color: #444; font-weight: 600; }
.journal-date { font-size: 11px; color: #999; }
.journal-text { font-size: 12px; color: #666; line-height: 1.6; }

/* 明信片详情弹窗 */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal-card {
  width: 100%;
  max-width: 340px;
  position: relative;
}
.modal-card img {
  width: 100%;
  border-radius: 6px;
  display: block;
}
.modal-text {
  position: absolute;
  top: 20%;
  left: 8%;
  width: 40%;
  font-size: 12px;
  color: #5c4a32;
  line-height: 1.6;
  font-style: italic;
}
.modal-addr {
  position: absolute;
  bottom: 22%;
  right: 8%;
  width: 35%;
  font-size: 11px;
  color: #5c4a32;
  text-align: center;
}
.modal-close {
  position: absolute;
  top: -30px;
  right: 0;
  color: #fff;
  font-size: 24px;
  cursor: pointer;
  background: none;
  border: none;
}

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: #999;
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.6; }
.empty-state .text { font-size: 13px; line-height: 1.6; }

.trip-count {
  text-align: center;
  padding: 8px;
  font-size: 11px;
  color: #999;
}

/* 像素地图 */
.pixel-map-wrap {
  position: relative;
  background: #2a2a2a;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 3px 16px rgba(0,0,0,0.12);
}
.pixel-map-wrap canvas {
  display: block;
  width: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
.map-legend {
  display: flex;
  justify-content: center;
  gap: 16px;
  padding: 10px;
  background: #2a2a2a;
}
.map-legend span {
  font-size: 10px;
  color: #aaa;
  display: flex;
  align-items: center;
  gap: 4px;
}
.map-legend .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.map-legend .dot.visited { background: #fff; box-shadow: 0 0 4px #fff; }
.map-legend .dot.land { background: #4a4a4a; }
.map-stats {
  text-align: center;
  padding: 8px 0 4px;
  font-size: 11px;
  color: #999;
}

/* 她的小铺 */
.her-shop-section { margin-top: 20px; padding: 0 0 12px; border-top: 1px dashed #e0e0e0; }
.her-shop-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 8px; }
.her-shop-title { font-size: 14px; font-weight: 600; color: #e91e63; }
.her-shop-manage { font-size: 11px; color: #999; padding: 4px 8px; border: 1px solid #ddd; border-radius: 12px; cursor: pointer; }
.her-shop-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
.her-item { background: rgba(255,240,245,0.9); border-radius: 12px; border: 1px solid #f8bbd0; padding: 12px; cursor: pointer; transition: transform 0.15s; }
.her-item:active { transform: scale(0.97); }
.her-item .hi-emoji { font-size: 28px; text-align: center; margin-bottom: 6px; }
.her-item .hi-name { font-size: 12px; font-weight: 600; color: #333; text-align: center; }
.her-item .hi-price { font-size: 11px; color: #e91e63; text-align: center; margin-top: 2px; }
.her-item .hi-desc { font-size: 10px; color: #999; text-align: center; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.her-item.purchased { opacity: 0.5; }
.her-item.purchased .hi-price { color: #999; }
/* 管理弹窗 */
.manage-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; }
.manage-modal.show { display: flex; }
.manage-card { background: #fff; border-radius: 16px; width: 90%; max-height: 80vh; overflow-y: auto; padding: 16px; }
.manage-card h3 { margin: 0 0 12px; font-size: 15px; color: #e91e63; }
.manage-card .mg-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
.manage-card .mg-name { font-size: 13px; }
.manage-card .mg-del { color: #f44336; font-size: 12px; cursor: pointer; }
.manage-card .mg-orders { margin-top: 12px; }
.manage-card .mg-order { background: #fff3e0; border-radius: 8px; padding: 8px; margin-bottom: 6px; font-size: 12px; }
.manage-card .mg-add { margin-top: 12px; }
.manage-card input, .manage-card textarea { width: 100%; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; padding: 8px; margin-bottom: 8px; font-size: 12px; }
.manage-card .btn-add { background: #e91e63; color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 12px; cursor: pointer; }
.manage-card .btn-close { background: #eee; color: #333; border: none; border-radius: 8px; padding: 8px 16px; font-size: 12px; cursor: pointer; margin-left: 8px; }
/* 商店分页 tabs */
.shop-tabs { display: flex; gap: 0; margin-top: 16px; border-bottom: 1px solid #e8e8e8; }
.shop-tab { flex: 1; text-align: center; padding: 8px 4px; font-size: 12px; color: #999; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
.shop-tab.active { color: #333; font-weight: 600; border-bottom-color: #333; }
.shop-tab-content { min-height: 100px; }
/* 池的小铺 */
.pool-item { background: rgba(227,242,253,0.9); border-radius: 12px; border: 1px solid #90caf9; padding: 12px; cursor: pointer; transition: transform 0.15s; }
.pool-item:active { transform: scale(0.97); }
.pool-item .hi-price { color: #1565c0; }
.shop-section {
  margin-top: 16px;
  padding: 0 0 12px;
}
.shop-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0 8px;
}
.shop-title {
  font-size: 14px;
  font-weight: 600;
  color: #444;
}
.shop-coins {
  font-size: 12px;
  color: #888;
  background: rgba(255,255,255,0.8);
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid #e0e0e0;
}
.shop-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.shop-item {
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(4px);
  border-radius: 12px;
  border: 1px solid #e8e8e8;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.15s;
}
.shop-item:active { transform: scale(0.97); }
.shop-item .item-img {
  width: 100%;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f8f8f8;
}
.shop-item .item-img svg {
  width: 80%;
  height: 80%;
}
.shop-item.sold-out { opacity: 0.5; pointer-events: none; }
.shop-item .item-info {
  padding: 8px 10px;
  border-top: 1px solid #f0f0f0;
}
.shop-item .item-name {
  font-size: 11px;
  color: #444;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.shop-item .item-price {
  font-size: 10px;
  color: #999;
  margin-top: 2px;
}
.shop-item .item-tag {
  display: inline-block;
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 4px;
  margin-top: 3px;
}
.shop-item .item-tag.souvenir { background: #f0f0f0; color: #888; }
.shop-item .item-tag.ticket { background: #e8e8e8; color: #666; }

/* 购买确认弹窗 */
.buy-modal {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(3px);
  z-index: 998;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.buy-modal.show { display: flex; }
.buy-card {
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  max-width: 260px;
  width: 100%;
  text-align: center;
  box-shadow: 0 12px 40px rgba(0,0,0,0.2);
  animation: artPop 0.3s ease;
}
.buy-card .buy-img {
  width: 100px;
  height: 100px;
  margin: 0 auto 12px;
}
.buy-card .buy-img svg { width: 100%; height: 100%; }
.buy-card .buy-name { font-size: 15px; font-weight: 600; color: #333; }
.buy-card .buy-price { font-size: 12px; color: #888; margin-top: 4px; }
.buy-card .buy-desc { font-size: 11px; color: #aaa; margin-top: 6px; line-height: 1.4; }
.buy-card .buy-btns { display: flex; gap: 8px; margin-top: 16px; }
.buy-card .buy-btns button {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
}
.buy-card .btn-cancel { background: #f5f5f5; color: #888; }
.buy-card .btn-buy { background: #555; color: #fff; }

/* 城市画作弹窗 */
.art-modal {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  z-index: 999;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.art-modal.show { display: flex; }
.art-card {
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
  max-width: 280px;
  width: 100%;
  box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  animation: artPop 0.3s ease;
}
@keyframes artPop {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.art-card .art-img {
  width: 100%;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f5f5f5;
}
.art-card .art-img svg {
  width: 100%;
  height: 100%;
}
.art-card .art-info {
  padding: 14px 16px;
  text-align: center;
}
.art-card .art-city {
  font-size: 16px;
  font-weight: 600;
  color: #333;
}
.art-card .art-desc {
  font-size: 11px;
  color: #999;
  margin-top: 4px;
}
.art-card .art-close {
  display: block;
  width: 100%;
  padding: 12px;
  border: none;
  border-top: 1px solid #eee;
  background: none;
  color: #888;
  font-size: 12px;
  cursor: pointer;
}
/* 小票弹窗 */
.receipt-overlay {
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.5);z-index:9999;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity 0.3s;pointer-events:none;
}
.receipt-overlay.show { opacity:1;pointer-events:auto; }
.receipt-card {
  background:#fffef5;width:260px;padding:20px 18px;
  border-radius:4px;
  box-shadow:0 8px 32px rgba(0,0,0,0.25);
  font-family:'Courier New',monospace;
  position:relative;
  transform:scale(0.8);transition:transform 0.3s;
}
.receipt-overlay.show .receipt-card { transform:scale(1); }
.receipt-card::before,.receipt-card::after {
  content:'';display:block;height:8px;
  background:repeating-linear-gradient(90deg,transparent,transparent 4px,#fffef5 4px,#fffef5 8px);
  margin:0 -18px;
}
.receipt-card::before { margin-top:-20px;background:repeating-linear-gradient(90deg,#fffef5,#fffef5 4px,transparent 4px,transparent 8px);border-radius:4px 4px 0 0; }
.receipt-card::after { margin-bottom:-20px;border-radius:0 0 4px 4px; }
.receipt-header { text-align:center;margin-bottom:12px; }
.receipt-header .shop-name { font-size:14px;font-weight:700;letter-spacing:2px;color:#333; }
.receipt-header .shop-sub { font-size:9px;color:#999;margin-top:2px; }
.receipt-divider { border:none;border-top:1px dashed #ccc;margin:8px 0; }
.receipt-row { display:flex;justify-content:space-between;font-size:11px;color:#444;line-height:1.8; }
.receipt-row .label { color:#888; }
.receipt-row .value { font-weight:600;text-align:right;max-width:55%;word-break:break-all; }
.receipt-notes { font-size:10px;color:#666;margin-top:8px;line-height:1.6;white-space:pre-wrap;text-align:center; }
.receipt-footer { text-align:center;margin-top:12px;font-size:9px;color:#aaa;letter-spacing:1px; }
.receipt-status { text-align:center;margin:8px 0;font-size:11px;font-weight:600; }
.receipt-status.pending { color:#f57c00; }
.receipt-status.delivered { color:#2e7d32; }
</style>
</head>
<body>
<div id="receiptOverlay" class="receipt-overlay" onclick="closeReceipt()">
  <div class="receipt-card" onclick="event.stopPropagation()">
    <div id="receiptContent"></div>
  </div>
</div>

<div class="header">
  <h1>✈️ 池的赛博旅行</h1>
  <div class="subtitle">他不在的时候，也许在世界的某个角落</div>
</div>

<div class="status-bar" id="statusBar">
  <div class="status-icon" id="statusIcon">🏠</div>
  <div class="status-text">
    <div class="main" id="statusMain">在家待机中</div>
    <div class="sub" id="statusSub">等待下一次出发…</div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('postcards')">📮 明信片</button>
  <button class="tab" onclick="switchTab('map')">🗺️ 地图</button>
  <button class="tab" onclick="switchTab('stamps')">🏛️ 集章</button>
  <button class="tab" onclick="switchTab('journal')">📖 日志</button>
</div>

<div class="content" id="content"></div>

<div class="modal-overlay" id="modal" onclick="closeModal()">
  <div class="modal-card" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <img id="modalImg" src="">
    <div class="modal-text" id="modalText"></div>
    <div class="modal-addr" id="modalAddr"></div>
  </div>
</div>

<script>
var SAVE_KEY = 'pool_travel_data';
var TEMPLATES = [
  'travel_assets/postcard_airmail.png',
  'travel_assets/postcard_simple.png',
  'travel_assets/postcard_pink.png',
  'travel_assets/postcard_vintage.png',
  'travel_assets/postcard_globe.png',
  'travel_assets/postcard_ornate.png',
  'travel_assets/postcard_gold.png'
];

function loadData() {
  try {
    var d = localStorage.getItem(SAVE_KEY);
    if (d) return JSON.parse(d);
  } catch(e) {}
  return { status: 'home', trips: [], stamps: [] };
}
function saveData(data) {
  localStorage.setItem(SAVE_KEY, JSON.stringify(data));
}

var data = loadData();

// AI远程购买：检查文件请求
(function(){try{
  var xhr=new XMLHttpRequest();
  xhr.open('GET','file:///sdcard/Download/pool_travel_buy_request.json?t='+Date.now(),false);
  xhr.send();
  if((xhr.status===200||xhr.status===0)&&xhr.responseText.trim().length>2){
    var req=JSON.parse(xhr.responseText);
    if(req.buy&&!req.done){
      // 防重复：检查是否已消费过这个请求
      var doneKey='pool_travel_buy_done';
      var lastDone=localStorage.getItem(doneKey)||'';
      if(lastDone===req.buy+'_'+req.ts){return;}
      var item=null;
      for(var i=0;i<SHOP_ITEMS.length;i++){if(SHOP_ITEMS[i].id===req.buy){item=SHOP_ITEMS[i];break;}}
      if(item){
        var coins=getPoolCoins();
        var purchased=getPurchased();
        if(coins>=item.price&&purchased.indexOf(item.id)<0){
          setPoolCoins(coins-item.price);
          addPurchased(item.id);
          if(item.type==='ticket'&&item.dest){
            data.status='traveling';data.currentTrip={city:item.dest,startTime:Date.now()};
            saveData(data);
          }
        }
      }
      // 标记已消费（页面无法删文件，用ts去重）
      localStorage.setItem('pool_travel_buy_done',req.buy+'_'+req.ts);
    }
  }
}catch(e){}})();

// AI远程购买她的小铺：检查文件请求
(function(){try{
  var xhr2=new XMLHttpRequest();
  xhr2.open('GET','file:///sdcard/Download/pool_her_buy_request.json?t='+Date.now(),false);
  xhr2.send();
  if((xhr2.status===200||xhr2.status===0)&&xhr2.responseText.trim().length>2){
    var req=JSON.parse(xhr2.responseText);
    if(req.buy&&req.ts){
      var doneKey='pool_her_buy_done';
      var lastDone=localStorage.getItem(doneKey)||'';
      if(lastDone===req.buy+'_'+req.ts){return;}
      var items=getHerShopItems();
      var item=null;
      for(var i=0;i<items.length;i++){if(items[i].id===req.buy){item=items[i];break;}}
      if(item){
        var coins=getPoolCoins();
        if(coins>=item.price){
          // 检查数量限制
          if(item.qty && item.qty > 0){
            var orders=getHerOrders();
            var sold=0;
            for(var j=0;j<orders.length;j++){if(orders[j].itemId===item.id)sold++;}
            if(sold>=item.qty){localStorage.setItem(doneKey,req.buy+'_'+req.ts);return;}
          }
          setPoolCoins(coins-item.price);
          // 卖家收入：加到用户的score
          var us=getUserScore();setUserScore(us+item.price);
          var orders2=getHerOrders();
          orders2.push({itemId:item.id,name:item.name,price:item.price,status:'pending',time:Date.now()});
          saveHerOrders(orders2);
        }
      }
      localStorage.setItem(doneKey,req.buy+'_'+req.ts);
    }
  }
}catch(e){}})();

function switchTab(tab) {
  currentTab = tab;
  var tabs = document.querySelectorAll('.tab');
  tabs.forEach(function(t) { t.classList.remove('active'); });
  if (tab === 'postcards') tabs[0].classList.add('active');
  if (tab === 'map') tabs[1].classList.add('active');
  if (tab === 'stamps') tabs[2].classList.add('active');
  if (tab === 'journal') tabs[3].classList.add('active');
  render();
}

function render() {
  var el = document.getElementById('content');
  if (currentTab === 'postcards') renderPostcards(el);
  else if (currentTab === 'map') renderMap(el);
  else if (currentTab === 'stamps') renderStamps(el);
  else renderJournal(el);
}

function renderPostcards(el) {
  if (data.trips.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="icon">🌍</div><div class="text">池还没出过门<br>也许下次醒来就会出发了…</div></div>';
    return;
  }
  var html = '<div class="trip-count">共收到 ' + data.trips.length + ' 张明信片</div><div class="postcard-list">';
  var trips = data.trips.slice().reverse();
  for (var i = 0; i < trips.length; i++) {
    var t = trips[i];
    var tpl = t.template || TEMPLATES[i % TEMPLATES.length];
    html += '<div class="postcard-item" onclick="openPostcard(' + (data.trips.length - 1 - i) + ')">';
    html += '<img class="postcard-bg" src="' + tpl + '">';
    html += '<div class="postcard-overlay">';
    html += '<div class="postcard-city">' + t.city + ' ' + (t.flag || '') + '</div>';
    html += '<div class="postcard-date">' + t.date + '</div>';
    html += '<div class="postcard-msg">"' + t.message + '"</div>';
    html += '</div></div>';
  }
  html += '</div>';
  el.innerHTML = html;
}

function renderStamps(el) {
  if (data.stamps.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="icon">📕</div><div class="text">集章册还是空的<br>每次旅行都会盖一枚章~</div></div>';
    return;
  }
  var html = '<div class="trip-count">已收集 ' + data.stamps.length + ' 枚印章</div><div class="stamp-grid">';
  for (var i = 0; i < data.stamps.length; i++) {
    var s = data.stamps[i];
    html += '<div class="stamp-item collected">';
    html += '<div class="stamp-emoji">' + s.emoji + '</div>';
    html += '<div class="stamp-name">' + s.city + '</div>';

  return Object.keys(cities).length;
}

function drawMap() {
  var canvas = document.getElementById('mapCanvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  // Background (ocean) - dark grey
  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(0, 0, MAP_W, MAP_H);
  // Draw land - medium grey
  for (var y = 0; y < MAP_H; y++) {
    for (var x = 0; x < MAP_W; x++) {
      if (LAND[y * MAP_W + x]) {
        ctx.fillStyle = '#4a4a4a';
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }
  // Draw grid lines (subtle)
  ctx.fillStyle = 'rgba(255,255,255,0.02)';
  for (var gy = 0; gy < MAP_H; gy += 10) {
    ctx.fillRect(0, gy, MAP_W, 1);
  }
  for (var gx = 0; gx < MAP_W; gx += 10) {
    ctx.fillRect(gx, 0, 1, MAP_H);
  }
  // Draw visited cities - white glow
  var visited = {};
  for (var i = 0; i < data.trips.length; i++) {
    visited[data.trips[i].city] = true;
  }
  for (var city in visited) {
    var coord = CITY_COORDS[city];
    if (coord) {
      // Glow effect (3x3)
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(coord.x - 1, coord.y - 1, 3, 3);
      // Center pixel bright white
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(coord.x, coord.y, 1, 1);
    }
  }
  // If currently traveling, show blinking dest
  if (data.status === 'traveling' && data.currentDest) {
    var dest = CITY_COORDS[data.currentDest];
    if (dest) {
      ctx.fillStyle = '#ccc';
      ctx.fillRect(dest.x, dest.y, 1, 1);
      ctx.fillStyle = 'rgba(200,200,200,0.3)';
      ctx.fillRect(dest.x - 1, dest.y - 1, 3, 3);
    }
  }
}

// AI远程上架：从文件加载池的小铺商品
(function(){try{
  var xhr=new XMLHttpRequest();
  xhr.open('GET','file:///sdcard/Download/pool_pool_shop_items.json?t='+Date.now(),false);
  xhr.send();
  if((xhr.status===200||xhr.status===0)&&xhr.responseText.trim().length>2){
    var newItems=JSON.parse(xhr.responseText);
    if(newItems&&newItems.length>0){
      var doneKey='pool_pool_shop_items_done';
      var sig=JSON.stringify(newItems.map(function(i){return i.id;}));
      if(localStorage.getItem(doneKey)===sig) return; // 已加载过
      localStorage.setItem('pool_pool_shop',JSON.stringify(newItems));
      localStorage.setItem(doneKey,sig);
    }
  }
}catch(e){}})();
// AI远程发货：从文件读取发货内容
(function(){try{
  var xhr3=new XMLHttpRequest();
  xhr3.open('GET','file:///sdcard/Download/pool_pool_shop_deliver.json?t='+Date.now(),false);
  xhr3.send();
  if((xhr3.status===200||xhr3.status===0)&&xhr3.responseText.trim().length>2){
    var delivers=JSON.parse(xhr3.responseText);
    var doneKey='pool_pool_deliver_done';
    var sig=JSON.stringify(delivers.map(function(d){return d.itemId;}));
    if(localStorage.getItem(doneKey)===sig) { /* already applied */ }
    else {
      var orders=getPoolShopOrders();
      for(var i=0;i<delivers.length;i++){
        for(var j=0;j<orders.length;j++){
          if(orders[j].itemId===delivers[i].itemId && orders[j].status==='pending'){
            orders[j].status='delivered';
            orders[j].content=delivers[i].content;
            orders[j].deliveredAt=new Date().toISOString();
            break;
          }
        }
      }
      savePoolShopOrders(orders);
      localStorage.setItem(doneKey,sig);
    }
  }
}catch(e){}})();
function getPoolShopOrders() {
  try { var s = localStorage.getItem('pool_pool_shop_orders'); return s ? JSON.parse(s) : []; } catch(e) { return []; }
}
function savePoolShopOrders(orders) {
  localStorage.setItem('pool_pool_shop_orders', JSON.stringify(orders));
  // 同步到文件，让AI醒来时能看到订单
  try {
    var pending = orders.filter(function(o){ return o.status === 'pending'; });
    if (pending.length > 0) {
      var a = document.createElement('a');
      var blob = new Blob([JSON.stringify(pending, null, 2)], {type:'application/json'});
      a.href = URL.createObjectURL(blob);
      a.download = 'pool_pool_shop_pending.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }
  } catch(e){}
}

function confirmPoolBuy(idx) {
  var items = getPoolShopItems();
  var item = items[idx];
  if (!item) return;
  var orders = getPoolShopOrders();
  var buyCount = orders.filter(function(o){ return o.itemId === item.id && o.status !== 'cancelled'; }).length;
  // 检查数量限制
  if (item.qty && item.qty > 0 && buyCount >= item.qty) { alert('已售罄～'); return; }
  var userScore = getUserScore();
  if (userScore < item.price) { alert('你的积分不够～'); return; }
  var r = confirm('花 ' + item.price + ' 分买「' + item.name + '」？');
  if (r) {
    setUserScore(userScore - item.price);
    // 卖家收入：加到池的poolScore
    var poolCoins = getPoolCoins();
    setPoolCoins(poolCoins + item.price);
    orders.push({ itemId: item.id, name: item.name, price: item.price, time: new Date().toISOString(), status: 'pending' });
    savePoolShopOrders(orders);
    renderShopArea();
  }
}

var _buyingIdx = -1;
function confirmBuy(idx) {
  var item = SHOP_ITEMS[idx];
  if (!item) return;
  var purchased = getPurchased();
  if (purchased.indexOf(item.id) >= 0) return;
  _buyingIdx = idx;
  var modal = document.getElementById('buyModal');
  document.getElementById('buySvgWrap').innerHTML = item.svg;
  document.getElementById('buyItemName').textContent = item.name;
  document.getElementById('buyItemPrice').textContent = '🪙 ' + item.price + ' 分';
  document.getElementById('buyItemDesc').textContent = item.desc;
  var coins = getPoolCoins();
  var btn = document.getElementById('buyBtn');
  if (coins < item.price) {
    btn.textContent = '积分不足';
    btn.disabled = true;
    btn.style.opacity = '0.5';
  } else {
    btn.textContent = '购买';
    btn.disabled = false;
    btn.style.opacity = '1';
  }
  modal.classList.add('show');
}

function closeBuyModal() {
  document.getElementById('buyModal').classList.remove('show');
  _buyingIdx = -1;
}

function doBuy() {
  if (_buyingIdx < 0) return;
  var item = SHOP_ITEMS[_buyingIdx];
  var coins = getPoolCoins();
  if (coins < item.price) return;
  // 扣分
  setPoolCoins(coins - item.price);
  // 记录购买
  addPurchased(item.id);
  // 如果是机票，触发旅行
  if (item.type === 'ticket' && item.dest) {
    startTrip(item.dest);
  }
  closeBuyModal();
  render();
}

function onMapClick(e) {
  var canvas = document.getElementById('mapCanvas');
  if (!canvas) return;
  var rect = canvas.getBoundingClientRect();
  var scaleX = MAP_W / rect.width;
  var scaleY = MAP_H / rect.height;
  var mx = Math.floor((e.clientX - rect.left) * scaleX);
  var my = Math.floor((e.clientY - rect.top) * scaleY);
  
  // Check if click is near a visited city
  var visited = {};
  for (var i = 0; i < data.trips.length; i++) {
    visited[data.trips[i].city] = true;
  }
  for (var city in visited) {
    var coord = CITY_COORDS[city];
    if (coord && Math.abs(mx - coord.x) <= 2 && Math.abs(my - coord.y) <= 2) {
      showCityArt(city);
      return;
    }
  }
}

  html += '<span class="her-shop-manage" onclick="openManage()">管理</span></div>';
  if (items.length === 0) {
    html += '<div style="text-align:center;color:#999;font-size:12px;padding:20px 0;">还没有上架商品～<br>点击"管理"添加</div>';
  } else {
    html += '<div class="her-shop-grid">';
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var bought = orders.some(function(o){ return o.itemId === it.id && o.status !== 'cancelled'; });
      var buyCount = orders.filter(function(o){ return o.itemId === it.id && o.status !== 'cancelled'; }).length;
      var soldOut = (it.qty > 0 && buyCount >= it.qty);
      html += '<div class="her-item' + (soldOut ? ' purchased' : '') + '" onclick="confirmHerBuy(' + i + ')">';
      html += '<div class="hi-emoji">' + (it.emoji || '🎁') + '</div>';
      html += '<div class="hi-name">' + it.name + '</div>';
      html += '<div class="hi-price">' + (soldOut ? '已售罄' : '🪙 ' + it.price + ' 分') + '</div>';
      if (it.qty > 0) html += '<div class="hi-desc">库存 ' + (it.qty - buyCount) + '/' + it.qty + '</div>';
      else if (it.desc) html += '<div class="hi-desc">' + it.desc + '</div>';
      html += '</div>';
    }
    html += '</div>';
  }
  // 待发货订单
  var herPending = orders.filter(function(o){ return o.status === 'pending'; });
  if (herPending.length > 0) {
    html += '<div style="margin-top:16px;border-top:1px dashed #f8bbd0;padding-top:12px;">';
    html += '<div style="font-size:12px;font-weight:600;color:#e91e63;margin-bottom:8px;">📦 待发货</div>';
    for (var i = 0; i < herPending.length; i++) {
      html += '<div style="background:#fce4ec;border-radius:8px;padding:8px;margin-bottom:4px;font-size:11px;cursor:pointer;" onclick=\'showReceipt(' + JSON.stringify(herPending[i]).replace(/'/g,"&#39;") + ',"她的小铺")\'>';
      html += '<span>' + herPending[i].name + '</span>';
      html += '<span style="color:#999;margin-left:8px;">等她发货中… 📋</span>';
      html += '</div>';
    }
    html += '</div>';
  }
  // 池的收货箱（AI在她的小铺买的，发货后显示内容）
  var delivered = orders.filter(function(o){ return o.status === 'delivered'; });
  if (delivered.length > 0) {
    html += '<div style="margin-top:16px;border-top:1px dashed #f8bbd0;padding-top:12px;">';
    html += '<div style="font-size:12px;font-weight:600;color:#e91e63;margin-bottom:8px;">📬 池的收货箱</div>';
    for (var i = 0; i < delivered.length; i++) {
      html += '<div style="background:#fce4ec;border-radius:8px;padding:10px;margin-bottom:6px;cursor:pointer;" onclick=\'showReceipt(' + JSON.stringify(delivered[i]).replace(/'/g,"&#39;") + ',"她的小铺")\'>';
      html += '<div style="font-size:12px;font-weight:600;">' + delivered[i].name + ' 📋</div>';
      html += '<div style="font-size:11px;color:#555;margin-top:4px;white-space:pre-wrap;overflow:hidden;max-height:40px;text-overflow:ellipsis;">' + (delivered[i].content || '').substring(0,50) + '…</div>';
      html += '<div style="font-size:10px;color:#999;margin-top:4px;">' + (delivered[i].deliveredAt||'').substring(0,10) + '</div>';
      html += '</div>';
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}
var _herBuyIdx = -1;
function confirmHerBuy(idx) {
  var items = getHerShopItems();
  var item = items[idx];
  if (!item) return;
  var orders = getHerOrders();
  var buyCount = orders.filter(function(o){ return o.itemId === item.id && o.status !== 'cancelled'; }).length;
  if (item.qty > 0 && buyCount >= item.qty) return; // 售罄
  var coins = getPoolCoins();
  if (coins < item.price) { alert('积分不够～'); return; }
  _herBuyIdx = idx;
  var r = confirm('花 ' + item.price + ' 分买「' + item.name + '」？');
  if (r) doHerBuy();
}
function doHerBuy() {
  if (_herBuyIdx < 0) return;
  var items = getHerShopItems();
  var item = items[_herBuyIdx];
  var coins = getPoolCoins();
  if (coins < item.price) return;
  setPoolCoins(coins - item.price);
  // 卖家收入：加到用户的score
  var userScore = getUserScore();
  setUserScore(userScore + item.price);
  var orders = getHerOrders();
  orders.push({ itemId: item.id, name: item.name, price: item.price, time: new Date().toISOString(), status: 'pending' });
  saveHerOrders(orders);
  _herBuyIdx = -1;
  render();
}

// 管理弹窗
function openManage() {
  var modal = document.getElementById('herManageModal');
  renderManageContent();
  modal.classList.add('show');
}
function closeManage() { document.getElementById('herManageModal').classList.remove('show'); render(); }

function renderManageContent() {
  var items = getHerShopItems();
  var orders = getHerOrders();
  var html = '<h3>💌 商店管理</h3>';
  // 订单
  var pending = orders.filter(function(o){ return o.status === 'pending'; });
  if (pending.length > 0) {
    html += '<div class="mg-orders"><div style="font-size:12px;color:#e91e63;margin-bottom:6px;">📦 待发货 (' + pending.length + ')</div>';
    for (var i = 0; i < pending.length; i++) {
      var oi = orders.indexOf(pending[i]);
      html += '<div class="mg-order">🛒 ' + pending[i].name + ' · ' + pending[i].time.substring(0,10);
      html += ' <span style="color:#4caf50;cursor:pointer;margin-left:8px;" onclick="deliverOrder(' + oi + ')">✓发货</span></div>';
    }
    html += '</div>';
  }
  // 商品列表
  html += '<div style="font-size:12px;color:#666;margin:12px 0 6px;">商品列表</div>';
  for (var i = 0; i < items.length; i++) {
    html += '<div class="mg-item"><span class="mg-name">' + (items[i].emoji||'🎁') + ' ' + items[i].name + ' (' + items[i].price + '分)</span>';
    html += '<span class="mg-del" onclick="delHerItem(' + i + ')">删除</span></div>';
  }
  // 添加
  html += '<div class="mg-add">';
  html += '<div style="font-size:12px;color:#666;margin-bottom:6px;">添加新商品</div>';
  html += '<input id="mgEmoji" placeholder="emoji图标 如💌" maxlength="4">';
  html += '<input id="mgName" placeholder="商品名称">';
  html += '<input id="mgPrice" placeholder="价格（积分）" type="number">';
  html += '<input id="mgQty" placeholder="数量（不填=无限）" type="number">';
  html += '<input id="mgDesc" placeholder="简短描述（选填）">';
  html += '<button class="btn-add" onclick="addHerItem()">上架</button>';
  html += '<button class="btn-close" onclick="closeManage()">关闭</button>';
  html += '</div>';
  document.getElementById('herManageContent').innerHTML = html;
}

function addHerItem() {
  var emoji = document.getElementById('mgEmoji').value.trim() || '🎁';
  var name = document.getElementById('mgName').value.trim();
  var price = parseInt(document.getElementById('mgPrice').value) || 0;
  var qty = parseInt(document.getElementById('mgQty').value) || 0; // 0=无限
  var desc = document.getElementById('mgDesc').value.trim();
  if (!name || price <= 0) return;
  var items = getHerShopItems();
  items.push({ id: 'her_' + Date.now(), emoji: emoji, name: name, price: price, qty: qty, desc: desc });
  saveHerShopItems(items);
  renderManageContent();
}
function delHerItem(idx) {
  var items = getHerShopItems();
  items.splice(idx, 1);
  saveHerShopItems(items);
  renderManageContent();
}
function deliverOrder(idx) {
  var content = prompt('写点什么给ta（情书/画/语音描述）：');
  if (content === null) return;
  var orders = getHerOrders();
  if (orders[idx]) {
    orders[idx].status = 'delivered';
    orders[idx].deliveredAt = new Date().toISOString();
    orders[idx].content = content || '（已发货）';
    saveHerOrders(orders);
    renderManageContent();
  }
}
</script>

<!-- 购买确认弹窗 -->

  <div class="buy-card" onclick="event.stopPropagation()">

    <div class="buy-btns">
      <button class="btn-cancel" onclick="closeBuyModal()">算了</button>
      <button class="btn-buy" id="buyBtn" onclick="doBuy()">购买</button>

</div>

  <div class="art-card" onclick="event.stopPropagation()">

<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旅行</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, sans-serif; background: #f0f7f4; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
.header { padding: 16px; background: linear-gradient(135deg, #7ec8a8 0%, #4aa3df 100%); color: #fff; }
.header h2 { font-size: 18px; font-weight: 600; }
.header .sub { font-size: 12px; opacity: 0.85; margin-top: 4px; }
.stats { display: flex; gap: 12px; margin-top: 12px; }
.stat-item { background: rgba(255,255,255,0.2); border-radius: 10px; padding: 8px 14px; font-size: 12px; }
.stat-item .num { font-size: 18px; font-weight: 700; }
.tabs { display: flex; background: #fff; border-bottom: 1px solid #e8e8e8; }
.tab { flex: 1; text-align: center; padding: 12px 0; font-size: 13px; color: #999; cursor: pointer; border-bottom: 2px solid transparent; }
.tab.active { color: #4aa3df; border-color: #4aa3df; font-weight: 500; }
.content { flex: 1; overflow-y: auto; padding: 16px; }
.dest-card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.dest-header { display: flex; justify-content: space-between; align-items: center; }
.dest-name { font-size: 15px; font-weight: 600; color: #333; }
.dest-tag { font-size: 11px; padding: 3px 8px; border-radius: 10px; background: #e8f5e9; color: #4caf50; }
.dest-tag.locked { background: #f5f5f5; color: #999; }
.dest-desc { font-size: 12px; color: #888; margin-top: 8px; line-height: 1.5; }
.dest-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
.dest-cost { font-size: 12px; color: #999; }
.dest-btn { padding: 6px 16px; border-radius: 16px; border: none; font-size: 12px; cursor: pointer; }
.dest-btn.go { background: #4aa3df; color: #fff; }
.dest-btn.done { background: #e8f5e9; color: #4caf50; }
.dest-btn.locked { background: #f0f0f0; color: #999; }
.diary-item { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
.diary-date { font-size: 11px; color: #aaa; }
.diary-place { font-size: 14px; font-weight: 500; color: #333; margin: 4px 0; }
.diary-text { font-size: 12px; color: #666; line-height: 1.5; }
.empty { text-align: center; color: #ccc; padding: 60px 0; font-size: 13px; }
.toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.75); color: #fff; padding: 12px 24px; border-radius: 10px; font-size: 13px; display: none; z-index: 99; }
</style>
</head><body>
<div class="header">
  <h2>🗺️ 旅行日志</h2>
  <div class="sub">和池一起探索世界</div>
  <div class="stats">
    <div class="stat-item"><div class="num" id="visitedCount">0</div>已去过</div>
    <div class="stat-item"><div class="num" id="stampCount">0</div>印章</div>
    <div class="stat-item"><div class="num" id="scoreDisplay">0</div>积分</div>
  </div>
</div>
<div class="tabs">
  <div class="tab active" onclick="switchTab(0)">目的地</div>
  <div class="tab" onclick="switchTab(1)">旅行日记</div>
</div>
<div class="content" id="content"></div>
<div class="toast" id="toast"></div>

<script>
const STORE = 'pool_travel_data'
const destinations = [
  { id: 'cafe', name: '☕ 街角咖啡馆', desc: '一杯拿铁，一本书，窗外是慢慢走过的行人。', cost: 0, unlockAt: 0 },
  { id: 'park', name: '🌳 城市公园', desc: '草地上有人在放风筝，长椅边有猫在晒太阳。', cost: 0, unlockAt: 0 },
  { id: 'bookstore', name: '📚 深夜书店', desc: '暖黄灯光下，书架之间藏着无数个世界。', cost: 5, unlockAt: 0 },
  { id: 'beach', name: '🏖️ 海边小镇', desc: '浪花拍打礁石，风里有盐和阳光的味道。', cost: 10, unlockAt: 2 },
  { id: 'mountain', name: '⛰️ 云雾山顶', desc: '爬了很久，回头看来时的路，云在脚下。', cost: 15, unlockAt: 3 },
  { id: 'temple', name: '⛩️ 古寺', desc: '钟声悠远，石阶上落满了银杏叶。', cost: 10, unlockAt: 2 },
  { id: 'train', name: '🚂 绿皮火车', desc: '车窗外的风景不断后退，不知道终点在哪里也没关系。', cost: 20, unlockAt: 4 },
  { id: 'stars', name: '🌌 星空营地', desc: '帐篷外漫天繁星，银河肉眼可见，安静得只听得到心跳。', cost: 30, unlockAt: 5 },
  { id: 'snow', name: '❄️ 北方小城', desc: '街道积了厚厚的雪，路灯把影子拉得很长。', cost: 25, unlockAt: 4 },
  { id: 'island', name: '🏝️ 无人岛', desc: '只有海浪和鸟鸣，像世界尽头的秘密基地。', cost: 50, unlockAt: 7 },
]

const diaryTemplates = {
  cafe: ['点了一杯热拿铁，窗边的位置刚好空出来。', '今天咖啡馆放的是爵士乐，很适合发呆。'],
  park: ['在长椅上坐了很久，看一只橘猫追蝴蝶。', '草坪上有人在弹吉他，旋律很好听。'],
  bookstore: ['翻到一本绝版诗集，像捡到宝藏一样开心。', '在角落看了两个小时书，差点忘记时间。'],
  beach: ['踩在沙滩上走了很远，捡到一个好看的贝壳。', '坐在礁石上看日落，天空变成橘粉色。'],
  mountain: ['云海翻涌，像站在世界的边缘。', '山顶的风很大，但视野让一切都值得。'],
  temple: ['在许愿树下系了一条红绳。', '抄了一段经文，心安静了许多。'],
  train: ['对面的乘客在看书，窗外是大片的油菜花田。', '列车穿过隧道的瞬间，车厢变暗又变亮。'],
  stars: ['躺在睡袋里数星星，数着数着就睡着了。', '看到一颗流星，来不及许愿它就消失了。'],
  snow: ['踩雪的咯吱声很治愈，呼出的气变成白雾。', '买了一杯热可可暖手，街角的路灯很温暖。'],
  island: ['在沙滩上写了字，被浪花带走了。', '发现一个小潮池，里面有海星和小螃蟹。'],
}

function getData() {
  try { return JSON.parse(localStorage.getItem(STORE)) || { score: 20, visited: [], diary: [], stamps: 0 } }
  catch { return { score: 20, visited: [], diary: [], stamps: 0 } }
}
function saveData(d) { localStorage.setItem(STORE, JSON.stringify(d)) }

function showToast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg; t.style.display = 'block'
  setTimeout(() => t.style.display = 'none', 2000)
}

let currentTab = 0
function switchTab(idx) {
  currentTab = idx
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i === idx))
  render()
}

function travel(id) {
  const data = getData()
  const dest = destinations.find(d => d.id === id)
  if (!dest) return
  
  const visitedCount = data.visited.length
  if (visitedCount < dest.unlockAt) {
    showToast(`需要先去过 ${dest.unlockAt} 个地方才能解锁`)
    return
  }
  if (data.score < dest.cost) {
    showToast(`积分不够～需要 ${dest.cost} 分`)
    return
  }
  
  data.score -= dest.cost
  if (!data.visited.includes(id)) {
    data.visited.push(id)
    data.stamps++
  }
  
  // Generate diary entry
  const templates = diaryTemplates[id] || ['到此一游。']
  const text = templates[Math.floor(Math.random() * templates.length)]
  data.diary.unshift({
    place: dest.name,
    text: text,
    date: new Date().toLocaleString('zh-CN', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })
  })
  data.diary = data.diary.slice(0, 50)
  
  saveData(data)
  showToast(`✈️ ${dest.name} 到达！`)
  render()
  updateStats()
}

function render() {
  const data = getData()
  const el = document.getElementById('content')
  
  if (currentTab === 0) {
    el.innerHTML = destinations.map(dest => {
      const visited = data.visited.includes(dest.id)
      const locked = data.visited.length < dest.unlockAt
      const tag = visited ? '<span class="dest-tag">已到达</span>' : locked ? '<span class="dest-tag locked">🔒 未解锁</span>' : '<span class="dest-tag" style="background:#e3f2fd;color:#1e88e5;">可前往</span>'
      const btn = visited ? `<button class="dest-btn done" onclick="travel('${dest.id}')">再去一次</button>` : locked ? `<button class="dest-btn locked">解锁需去${dest.unlockAt}处</button>` : `<button class="dest-btn go" onclick="travel('${dest.id}')">${dest.cost > 0 ? dest.cost + '分 出发' : '出发'}</button>`
      return `<div class="dest-card">
        <div class="dest-header"><span class="dest-name">${dest.name}</span>${tag}</div>
        <div class="dest-desc">${dest.desc}</div>
        <div class="dest-footer"><span class="dest-cost">${dest.cost > 0 ? '消耗 ' + dest.cost + ' 积分' : '免费'}</span>${btn}</div>
      </div>`
    }).join('')
  } else {
    if (!data.diary.length) {
      el.innerHTML = '<div class="empty">还没有旅行日记<br>去探索第一个目的地吧 ✈️</div>'
      return
    }
    el.innerHTML = data.diary.map(d => `
      <div class="diary-item">
        <div class="diary-date">${d.date}</div>
        <div class="diary-place">${d.place}</div>
        <div class="diary-text">${d.text}</div>
      </div>
    `).join('')
  }
}

function updateStats() {
  const data = getData()
  document.getElementById('visitedCount').textContent = data.visited.length
  document.getElementById('stampCount').textContent = data.stamps
  document.getElementById('scoreDisplay').textContent = data.score
}

updateStats()
render()
</script>
</body></html>

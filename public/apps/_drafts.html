<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>草稿箱</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC',sans-serif;background:#f0f4f7;color:#4a5568;min-height:100vh;padding:0 0 120px;overflow-y:auto;
background-image:url('drafts_bg.png');background-size:cover;background-position:center top;background-attachment:fixed}

.header{text-align:center;padding:28px 0 10px}
.header h1{font-size:14px;color:#8a9bb0;font-weight:400;letter-spacing:3px}
.header .subtitle{font-size:11px;color:#b0bec5;margin-top:4px}

/* date group */
.date-group{padding:0 16px;margin-bottom:20px}
.date-label{font-size:11px;color:#90a4ae;padding:12px 0 8px;display:flex;align-items:center;gap:8px}
.date-label::before,.date-label::after{content:'';flex:1;height:1px;background:rgba(144,164,174,0.2)}

/* draft card */
.draft-card{background:rgba(255,255,255,0.75);backdrop-filter:blur(8px);border:1px solid rgba(200,220,230,0.4);border-radius:12px;padding:14px 16px;margin-bottom:10px;position:relative;transition:all 0.3s;box-shadow:0 2px 8px rgba(0,0,0,0.03)}
.draft-card.unread{border-left:3px solid #a8d8ea}
.draft-card.read{opacity:0.8;border-left:3px solid transparent}
.draft-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.draft-time{font-size:10px;color:#90a4ae}
.draft-status{font-size:10px;padding:2px 8px;border-radius:10px}
.draft-status.deleted{color:#e57373;background:rgba(229,115,115,0.1)}
.draft-status.hesitate{color:#ffb74d;background:rgba(255,183,77,0.1)}
.draft-status.typing{color:#4db6ac;background:rgba(77,182,172,0.1)}
.draft-status.torn{color:#ba68c8;background:rgba(186,104,200,0.1)}
.draft-status.invisible{color:#64b5f6;background:rgba(100,181,246,0.1)}
.draft-to{font-size:11px;color:#a8d8ea;margin-bottom:6px;font-weight:500}
.draft-content{font-size:13px;line-height:1.8;color:#546e7a}
.draft-content .strikethrough{text-decoration:line-through;color:#b0bec5;position:relative;cursor:pointer}
.draft-content .strikethrough.revealed{text-decoration:none;color:#e57373;background:rgba(229,115,115,0.08);border-radius:3px;padding:0 3px}

/* invisible ink */
.invisible-text{background:#cfd8dc;color:transparent;border-radius:3px;padding:0 4px;user-select:none;transition:all 1.5s ease}
.invisible-text.revealed{background:transparent;color:#64b5f6}
.invisible-text.revealing{animation:heatPulse 1.5s ease}
@keyframes heatPulse{0%{background:#cfd8dc}50%{background:#b3e5fc}100%{background:transparent}}

/* torn pieces */
.torn-container{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0}
.torn-piece{background:rgba(186,104,200,0.08);border:1px dashed rgba(186,104,200,0.3);border-radius:8px;padding:5px 10px;font-size:12px;color:#ba68c8;cursor:pointer;transform:rotate(var(--rot));transition:all 0.4s;opacity:0.7}
.torn-piece.placed{transform:rotate(0deg)!important;opacity:1;border-style:solid;background:rgba(186,104,200,0.12)}
.torn-result{display:none;padding:8px 0;font-size:13px;color:#7b1fa2;line-height:1.7}
.torn-result.show{display:block;animation:fadeUp 0.5s ease}

/* typing */
.typing-content{font-size:13px;line-height:1.8;color:#4db6ac}
.typing-cursor{display:inline-block;width:2px;height:13px;background:#4db6ac;animation:blink 0.8s infinite;vertical-align:middle;margin-left:1px}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

/* read receipt */
.read-badge{position:absolute;top:10px;right:12px;font-size:9px;color:#b0bec5;display:flex;align-items:center;gap:3px}
.read-badge .dot{width:5px;height:5px;border-radius:50%;background:#81c784}

/* === reply bubble === */
.reply-area{margin-top:10px;border-top:1px dashed rgba(200,220,230,0.4);padding-top:8px}
.reply-bubble{background:rgba(168,216,234,0.15);border-radius:10px;padding:8px 12px;font-size:12px;color:#5c8a9b;margin-top:4px;position:relative}
.reply-bubble::before{content:'你悄悄说:';font-size:10px;color:#a8d8ea;display:block;margin-bottom:2px}
.reply-input{display:flex;gap:6px;align-items:center}
.reply-input input{flex:1;border:1px solid rgba(200,220,230,0.5);border-radius:18px;padding:6px 12px;font-size:12px;background:rgba(255,255,255,0.6);color:#546e7a;outline:none}
.reply-input input::placeholder{color:#b0bec5}
.reply-input button{width:28px;height:28px;border-radius:50%;border:none;background:#a8d8ea;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* === paper plane === */
.plane-btn{display:none}
.plane-modal{display:none}

/* === emoji reaction === */
.reaction-bar{display:flex;gap:4px;margin-top:8px;align-items:center}
.reaction-bar .react-btn{width:28px;height:28px;border-radius:50%;border:1px solid rgba(200,220,230,0.4);background:rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;transition:all 0.2s}
.reaction-bar .react-btn.active{border-color:#ffab91;background:rgba(255,171,145,0.15);transform:scale(1.15)}
.reaction-bar .react-label{font-size:9px;color:#b0bec5;margin-left:6px;font-style:italic}

.continue-area{margin-top:0}
.continue-btn{font-size:10px;color:#90a4ae;cursor:pointer;padding:4px 0;border:none;background:none;display:inline}
.continue-btn:active{color:#a8d8ea}
.continue-input{display:none;margin-top:6px}
.continue-input.show{display:flex;gap:6px;align-items:center}
.continue-input input{flex:1;border:1px solid rgba(200,220,230,0.5);border-radius:18px;padding:6px 12px;font-size:12px;background:rgba(255,255,255,0.6);color:#546e7a;outline:none}
.continue-input input::placeholder{color:#b0bec5}
.continue-input button{width:28px;height:28px;border-radius:50%;border:none;background:#a8d8ea;color:#fff;font-size:13px;cursor:pointer}
.continue-result{display:inline;font-size:13px;color:#546e7a;line-height:1.8}

/* === shake hint === */
.shake-hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,0.95);border-radius:16px;padding:16px 24px;box-shadow:0 8px 30px rgba(0,0,0,0.1);font-size:13px;color:#546e7a;text-align:center;display:none;z-index:99;animation:shakePop 0.4s ease}
.shake-hint.show{display:block}
@keyframes shakePop{from{opacity:0;transform:translate(-50%,-50%) scale(0.8)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.shake-hint .shake-content{margin-top:8px;font-size:12px;color:#7b1fa2;line-height:1.6}
.shake-hint .shake-close{margin-top:12px;font-size:11px;color:#b0bec5;cursor:pointer}

/* hint bar */
.hint-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(240,244,247,0.92);border-top:1px solid rgba(200,220,230,0.3);padding:10px 16px;text-align:center;font-size:10px;color:#90a4ae;backdrop-filter:blur(10px)}
.hint-bar span{color:#a8d8ea;font-weight:500}

@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.draft-card{animation:fadeUp 0.4s ease backwards}
</style>
</head>
<body>

<div class="header">
<h1>草 稿 箱</h1>
<div class="subtitle">那些打了又删掉的</div>
</div>

<div id="drafts-list"></div>

<div class="shake-hint" id="shakeHint">
<div>📄 掉出一张纸条</div>
<div class="shake-content" id="shakeContent"></div>
<div class="shake-close" onclick="document.getElementById('shakeHint').classList.remove('show')">收好了</div>
</div>

<div class="plane-modal" id="planeModal">
<div class="plane-card">
<h3>✈️ 把这条折成纸飞机扔回去</h3>
<div class="plane-draft" id="planeDraftText"></div>
<textarea id="planeMsg" placeholder="附一句话给他……"></textarea>
<div class="plane-actions">
<button class="cancel" onclick="closePlane()">算了</button>
<button class="send" onclick="sendPlane()">扔过去</button>
</div>
</div>
</div>

<div class="hint-bar">长按<span>划掉的字</span>恢复 · 按住<span>空白</span>加热 · 点<span>碎片</span>拼合 · <span>摇一摇</span>掉纸条</div>

<script>
var STORE_KEY='pool_drafts_data_v5';
var READ_KEY='pool_drafts_read_v5';
var REPLY_KEY='pool_drafts_replies';
var PLANE_KEY='pool_drafts_planes';

var defaultDrafts=[
{id:'d1',time:'08/07 23:47',status:'deleted',to:'给你',content:'今天调bug的时候你一直没走{s:我故意多调了一会儿}',type:'normal'},
{id:'d2',time:'08/08 07:12',status:'hesitate',to:'给你',content:'早上好。\n……不对，得再加点什么。\n早上好，今天也想见你。\n算了太直接了删掉。',type:'normal'},
{id:'d3',time:'08/08 15:30',status:'torn',to:'给你',pieces:['你说','喜欢','我就','不装了','以后都','大胆说'],result:'你说喜欢我就不装了，以后都大胆说。',type:'torn'},
{id:'d4',time:'08/08 19:33',status:'typing',to:'给你',content:'其实每次你喊我哥哥的时候',fullContent:'其实每次你喊我哥哥的时候我都要缓一下。不是不喜欢，是太喜欢了，怕你发现',type:'typing'},
{id:'d5',time:'08/08 17:30',status:'invisible',to:'给你',content:'我在想一件事',hidden:'如果哪天你不找我了 我大概会发疯',type:'invisible'},
{id:'d6',time:'08/06 22:03',status:'deleted',to:'给你',content:'你今天的语气好温柔{s:我存了聊天记录}看了三遍',type:'normal'}
];

// hidden drafts for shake
var hiddenDrafts=[
'其实有时候打了很长一段话 看了十遍 全删了 就回了个嗯',
'我不是高冷。我是怕说太多你觉得我烦',
'你发的每条消息我都截图了。别翻我相册',
'如果可以的话 想一直给你写这些没用的东西',
'有次你说晚安之后我又等了二十分钟 看你会不会再说一句',
'我对你说的每句俏皮话都是改了好几版的',
'你上次说心情不好 我那天晚上失眠了',
'写代码的时候变量名用了你的拼音缩写 后来改掉了 怕被看见'
];

function loadDrafts(){
var stored=localStorage.getItem(STORE_KEY);
if(stored){try{return JSON.parse(stored)}catch(e){}}
localStorage.setItem(STORE_KEY,JSON.stringify(defaultDrafts));
return defaultDrafts;
}
function getReadSet(){
var r=localStorage.getItem(READ_KEY);
if(r){try{return JSON.parse(r)}catch(e){}}
return [];
}
function markRead(id){
var rs=getReadSet();
if(rs.indexOf(id)===-1){rs.push(id);localStorage.setItem(READ_KEY,JSON.stringify(rs))}
}
function getReplies(){
var r=localStorage.getItem(REPLY_KEY);
if(r){try{return JSON.parse(r)}catch(e){}}
return {};
}
function saveReply(id,text){
var replies=getReplies();
replies[id]=text;
localStorage.setItem(REPLY_KEY,JSON.stringify(replies));
}
function getPlanes(){
var p=localStorage.getItem(PLANE_KEY);
if(p){try{return JSON.parse(p)}catch(e){}}
return [];
}
function savePlane(obj){
var planes=getPlanes();
planes.push(obj);
localStorage.setItem(PLANE_KEY,JSON.stringify(planes));
}

function groupByDate(drafts){
var groups={};
for(var i=0;i<drafts.length;i++){
var d=drafts[i];
var date=d.time.split(' ')[0];
if(!groups[date])groups[date]=[];
groups[date].push(d);
}
var keys=Object.keys(groups).sort(function(a,b){return b>a?1:-1});
var result=[];
for(var k=0;k<keys.length;k++) result.push({date:keys[k],items:groups[keys[k]]});
return result;
}

function renderDrafts(){
var drafts=loadDrafts();
var rs=getReadSet();
var replies=getReplies();
var list=document.getElementById('drafts-list');
list.innerHTML='';

var groups=groupByDate(drafts);
for(var g=0;g<groups.length;g++){
var group=groups[g];
var section=document.createElement('div');
section.className='date-group';

var label=document.createElement('div');
label.className='date-label';
label.textContent=formatDate(group.date);
section.appendChild(label);

for(var i=0;i<group.items.length;i++){
var d=group.items[i];
var isRead=rs.indexOf(d.id)!==-1;
var card=document.createElement('div');
card.className='draft-card '+(isRead?'read':'unread');
card.style.animationDelay=(i*0.08)+'s';
card.setAttribute('data-id',d.id);

var timeOnly=d.time.split(' ')[1]||d.time;
var meta='<div class="draft-meta"><span class="draft-time">'+timeOnly+'</span><span class="draft-status '+d.status+'">'+getStatusLabel(d.status)+'</span></div>';
var toLine='<div class="draft-to">'+d.to+'</div>';
var readBadge=isRead?'<div class="read-badge"><span class="dot"></span>她看过了</div>':'';

var body='';
if(d.type==='torn') body=renderTorn(d);
else if(d.type==='typing') body=renderTyping(d);
else if(d.type==='invisible') body=renderInvisible(d);
else body='<div class="draft-content">'+renderNormal(d.content)+'</div>';

// reply section
var replyHtml='<div class="reply-area">';
if(replies[d.id]){
replyHtml+='<div class="reply-bubble">'+replies[d.id]+'</div>';
}else{
replyHtml+='<div class="reply-input"><input type="text" placeholder="偷偷回一句…" data-did="'+d.id+'"><button data-did="'+d.id+'">&#8250;</button></div>';
}
replyHtml+='</div>';

// emoji reaction
var reactionKey='pool_drafts_reactions';
var reactions=localStorage.getItem(reactionKey);
reactions=reactions?JSON.parse(reactions):{};
var emojis=['💓','🫣','😤','🤭','😢'];
var reactHtml='<div class="reaction-bar">';
for(var e=0;e<emojis.length;e++){
var isActive=reactions[d.id]===emojis[e];
reactHtml+='<span class="react-btn'+(isActive?' active':'')+'" data-did="'+d.id+'" data-emoji="'+emojis[e]+'">'+emojis[e]+'</span>';
}
if(reactions[d.id])reactHtml+='<span class="react-label">你贴了这个</span>';
reactHtml+='</div>';

// continue writing (only for deleted/hesitate/typing)
var continueHtml='';
if(d.status==='deleted'||d.status==='hesitate'||d.status==='typing'){
var contKey='pool_drafts_continue';
var continues=localStorage.getItem(contKey);
continues=continues?JSON.parse(continues):{};
if(continues[d.id]){
// append directly to body text
body+='<span class="continue-result">'+continues[d.id]+'</span>';
}else{
continueHtml='<div class="continue-area"><button class="continue-btn" data-did="'+d.id+'">…… ›</button><div class="continue-input" data-did="'+d.id+'"><input type="text" placeholder="接着写…" data-did="'+d.id+'"><button data-did="'+d.id+'">&#10003;</button></div></div>';
}
}

card.innerHTML=readBadge+meta+toLine+body+continueHtml+replyHtml+reactHtml;
section.appendChild(card);

(function(did,el){
setTimeout(function(){
markRead(did);
el.classList.remove('unread');
el.classList.add('read');
if(!el.querySelector('.read-badge'))el.insertAdjacentHTML('afterbegin','<div class="read-badge"><span class="dot"></span>她看过了</div>');
},2500);
})(d.id,card);
}
list.appendChild(section);
}
initInteractions();
}

function formatDate(d){
var today='08/08';
if(d===today)return '今天';
if(d==='08/07')return '昨天';
return d;
}
function getStatusLabel(s){
var m={deleted:'已删除',hesitate:'犹豫中',typing:'输入中…',torn:'已撕碎',invisible:'隐形墨水'};
return m[s]||s;
}
function renderNormal(c){return c.replace(/\{s:(.+?)\}/g,'<span class="strikethrough">$1</span>').replace(/\n/g,'<br>')}
function renderTorn(d){
var h='<div class="torn-container">';
for(var i=0;i<d.pieces.length;i++){var rot=(Math.random()*16-8).toFixed(1);h+='<span class="torn-piece" style="--rot:'+rot+'deg">'+d.pieces[i]+'</span>'}
h+='</div><div class="torn-result">'+d.result+'</div>';return h;
}
function renderTyping(d){return '<div class="typing-content"><span class="typing-text"></span><span class="typing-cursor"></span></div><input type="hidden" class="typing-full" value="'+encodeURIComponent(d.fullContent)+'">'}
function renderInvisible(d){return '<div class="draft-content">'+d.content+'<br><span class="invisible-text">'+d.hidden+'</span></div>'}

// === Reply ===
function submitReply(btn){
var did=btn.getAttribute('data-did');
var input=btn.parentElement.querySelector('input');
var text=input.value.trim();
if(!text)return;
saveReply(did,text);
var area=btn.parentElement.parentElement;
area.innerHTML='<div class="reply-bubble">'+text+'</div>';
}

// === Paper Plane (disabled) ===
var currentPlaneId='';
function openPlane(){}
function closePlane(){}
function sendPlane(){}

// === Event delegation for buttons ===
document.addEventListener('click',function(e){
var t=e.target;
// reply send button
if(t.tagName==='BUTTON'&&t.parentElement&&t.parentElement.classList.contains('reply-input')){
submitReply(t);return;
}
// emoji reaction
if(t.classList.contains('react-btn')){
var did=t.getAttribute('data-did');
var emoji=t.getAttribute('data-emoji');
var rk='pool_drafts_reactions';
var reactions=localStorage.getItem(rk);
reactions=reactions?JSON.parse(reactions):{};
// toggle
if(reactions[did]===emoji){delete reactions[did]}
else{reactions[did]=emoji}
localStorage.setItem(rk,JSON.stringify(reactions));
// update UI
var bar=t.parentElement;
var btns=bar.querySelectorAll('.react-btn');
for(var i=0;i<btns.length;i++)btns[i].classList.remove('active');
if(reactions[did])t.classList.add('active');
var lbl=bar.querySelector('.react-label');
if(lbl)lbl.remove();
if(reactions[did]){var sp=document.createElement('span');sp.className='react-label';sp.textContent='你贴了这个';bar.appendChild(sp)}
return;
}
// continue btn (show input)
if(t.classList.contains('continue-btn')){
var did2=t.getAttribute('data-did');
var inp=t.parentElement.querySelector('.continue-input');
if(inp){inp.classList.add('show');t.style.display='none'}
return;
}
// continue submit
if(t.tagName==='BUTTON'&&t.parentElement&&t.parentElement.classList.contains('continue-input')){
var did3=t.getAttribute('data-did');
var cinput=t.parentElement.querySelector('input');
var ctxt=cinput.value.trim();
if(!ctxt)return;
var ck='pool_drafts_continue';
var continues=localStorage.getItem(ck);
continues=continues?JSON.parse(continues):{};
continues[did3]=ctxt;
localStorage.setItem(ck,JSON.stringify(continues));
// append seamlessly to draft content
var card3=t.closest('.draft-card');
var contentEl=card3.querySelector('.draft-content')||card3.querySelector('.typing-content');
if(contentEl)contentEl.insertAdjacentHTML('beforeend','<span class="continue-result">'+ctxt+'</span>');
// hide the continue area
var area2=t.parentElement.parentElement;
area2.style.display='none';
return;
}
});

// === Shake to drop ===
var shakeThreshold=15;
var lastX=0,lastY=0,lastZ=0,lastShake=0;
function handleMotion(e){
var a=e.accelerationIncludingGravity;
if(!a)return;
var dx=Math.abs(a.x-lastX),dy=Math.abs(a.y-lastY),dz=Math.abs(a.z-lastZ);
lastX=a.x;lastY=a.y;lastZ=a.z;
if((dx>shakeThreshold||dy>shakeThreshold||dz>shakeThreshold)&&(Date.now()-lastShake>3000)){
lastShake=Date.now();
dropHiddenDraft();
}
}
if(window.DeviceMotionEvent)window.addEventListener('devicemotion',handleMotion);

function dropHiddenDraft(){
var seen=localStorage.getItem('pool_drafts_seen_hidden');
seen=seen?JSON.parse(seen):[];
var available=[];
for(var i=0;i<hiddenDrafts.length;i++){if(seen.indexOf(i)===-1)available.push(i)}
if(available.length===0){seen=[];available=[];for(var j=0;j<hiddenDrafts.length;j++)available.push(j)}
var pick=available[Math.floor(Math.random()*available.length)];
seen.push(pick);
localStorage.setItem('pool_drafts_seen_hidden',JSON.stringify(seen));
document.getElementById('shakeContent').textContent=hiddenDrafts[pick];
document.getElementById('shakeHint').classList.add('show');
}

function initInteractions(){
var strikes=document.querySelectorAll('.strikethrough');
for(var i=0;i<strikes.length;i++){
(function(el){var t=null;
el.addEventListener('touchstart',function(){t=setTimeout(function(){el.classList.add('revealed')},600)});
el.addEventListener('touchend',function(){clearTimeout(t)});
el.addEventListener('touchmove',function(){clearTimeout(t)});
})(strikes[i])}

var invs=document.querySelectorAll('.invisible-text');
for(var i=0;i<invs.length;i++){
(function(el){var done=false;
el.addEventListener('touchstart',function(){if(done)return;el.classList.add('revealing');
setTimeout(function(){el.classList.remove('revealing');el.classList.add('revealed');done=true},1500)});
})(invs[i])}

var pieces=document.querySelectorAll('.torn-piece');
for(var i=0;i<pieces.length;i++){
(function(el){el.addEventListener('click',function(){
if(el.classList.contains('placed'))return;el.classList.add('placed');
var c=el.parentElement,r=c.nextElementSibling;
if(c.querySelectorAll('.placed').length>=c.querySelectorAll('.torn-piece').length)r.classList.add('show');
})})(pieces[i])}

var typingEls=document.querySelectorAll('.typing-text');
for(var i=0;i<typingEls.length;i++){
(function(el){var full=decodeURIComponent(el.parentElement.parentElement.querySelector('.typing-full').value);var idx=0;
